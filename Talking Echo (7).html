<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Talking Echo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: a full-bleed room. Status bar floats on top, the action dock sits at the bottom, sheets slide up between them and the room shrinks to stay visible. Single bright look by choice: the room itself follows the real clock. */
:root{
  --sky:#cfe6f7; --sky2:#a9d2f0; --ink:#17120f; --jacket:#2f6a93; --jacket-dk:#1f4a69;
  --butter:#ffd45e; --blush:#ff93a8; --paper:#f8fcff; --glass:rgba(255,255,255,.86);
  --text:#1e2f44; --muted:#5d7690; --good:#35c28a; --warn:#ffb21f; --bad:#ff5f6d;
  --shadow:0 6px 18px rgba(30,70,120,.18);
  --f-display:'Baloo 2','Trebuchet MS',system-ui,sans-serif; --f-body:'Nunito',system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:#bfe0f6;color:var(--text);font-family:var(--f-body);font-weight:600;overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible{outline:3px solid var(--jacket);outline-offset:2px}
svg{display:block}
#app{position:relative;height:100%;display:flex;flex-direction:column;overflow:hidden}

/* status bar */
#hud{position:absolute;z-index:6;left:0;right:0;top:0;padding:10px 16px 0;display:grid;gap:8px;pointer-events:none}
#hud>*{pointer-events:auto}
.toprow{display:flex;align-items:center;gap:8px}
.badge{display:flex;align-items:center;gap:8px;background:var(--glass);border-radius:999px;padding:3px 14px 3px 3px;box-shadow:var(--shadow);min-width:0}
.ring{position:relative;width:38px;height:38px;flex:none}
.ring svg{position:absolute;inset:0}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:800 15px var(--f-display);color:var(--jacket)}
.badge .nm{font:800 16px/1 var(--f-display)}
.badge small{display:block;font:700 11px/1.1 var(--f-body);color:var(--muted)}
.sp{flex:1}
.pill{background:var(--glass);border-radius:999px;box-shadow:var(--shadow);height:38px;display:flex;align-items:center;gap:6px;padding:0 14px 0 10px;font:800 16px var(--f-display)}
.pill svg{width:20px;height:20px;color:#e9a400}
.pill.bump{animation:bump .35s}
@keyframes bump{40%{transform:scale(1.18)}}
.ibtn{width:38px;height:38px;border-radius:50%;background:var(--glass);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--text)}
.ibtn svg{width:20px;height:20px}
.needs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.meter{background:var(--glass);border-radius:14px;padding:6px 6px;display:flex;align-items:center;gap:4px;box-shadow:var(--shadow);min-width:0;text-align:left}
.meter .mi{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none;background:var(--c)}
.meter .mi svg{width:14px;height:14px}
.meter .bar{flex:1;height:8px;border-radius:99px;background:rgba(30,70,120,.14);overflow:hidden;min-width:0}
.meter .bar i{display:block;height:100%;width:50%;border-radius:inherit;background:var(--c);transition:width .4s,background .3s}
.meter.low .bar i{background:var(--bad)}
.meter.low{animation:wob 1.1s infinite}
@keyframes wob{0%,70%,100%{transform:none}78%{transform:rotate(-3deg)}86%{transform:rotate(3deg)}94%{transform:rotate(-2deg)}}
#app.ingame .needs{visibility:hidden}

/* stage */
#stage{position:relative;flex:1;min-height:0;overflow:hidden;--insetTop:104px;--insetBottom:0px}
#scene{position:absolute;left:0;top:var(--insetTop);width:100%;height:calc(100% - var(--insetTop) - var(--insetBottom));overflow:visible;touch-action:none;transition:height .3s ease}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
#echoRoot{cursor:grab}
.prop{cursor:pointer}
#bubble{position:absolute;z-index:4;left:50%;top:40%;pointer-events:none;max-width:min(270px,72%);background:#fff;border-radius:20px;padding:9px 14px;font:700 16px/1.25 var(--f-display);color:var(--text);box-shadow:var(--shadow);transform:translate(-50%,-100%) scale(.6);transform-origin:50% 100%;opacity:0;transition:opacity .16s,transform .22s cubic-bezier(.3,1.6,.5,1);text-align:center;overflow-wrap:anywhere}
#bubble.show{opacity:1;transform:translate(-50%,-100%) scale(1)}
#bubble::after{content:"";position:absolute;left:50%;bottom:-9px;width:16px;height:16px;background:#fff;transform:translateX(-50%) rotate(45deg);border-radius:3px}
#toast{position:absolute;z-index:8;left:50%;top:var(--insetTop);transform:translate(-50%,-16px);background:var(--text);color:#fff;border-radius:999px;padding:8px 16px;font:700 14px var(--f-display);opacity:0;pointer-events:none;transition:opacity .2s,transform .25s;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,6px)}

/* dock */
#dock{position:relative;z-index:7;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;padding:8px 8px 10px;background:linear-gradient(#ffffffd9,#e6f3ffef);backdrop-filter:blur(10px);border-radius:24px 24px 0 0;box-shadow:0 -6px 24px rgba(30,70,120,.18)}
#app.ingame #dock{display:none}
.dbtn{display:grid;justify-items:center;gap:3px;font:800 11px/1 var(--f-display);color:var(--muted);min-width:0}
.dbtn .ic{width:44px;height:44px;border-radius:16px;display:grid;place-items:center;color:#fff;background:var(--c);box-shadow:0 4px 0 rgba(0,0,0,.14);transition:transform .12s,box-shadow .12s}
.dbtn .ic svg{width:24px;height:24px}
.dbtn:active .ic{transform:translateY(3px) scale(.96);box-shadow:0 1px 0 rgba(0,0,0,.14)}
.dbtn.on .ic{outline:3px solid #fff;box-shadow:0 0 0 3px var(--c)}

/* sheets */
.sheet{position:absolute;z-index:6;left:0;right:0;bottom:0;max-height:54%;overflow:auto;background:var(--glass);backdrop-filter:blur(12px);border-radius:24px 24px 0 0;padding:12px 16px 16px;box-shadow:0 -8px 28px rgba(30,70,120,.2);transform:translateY(105%);transition:transform .3s cubic-bezier(.3,1.2,.5,1),visibility 0s linear .3s;visibility:hidden}
.sheet.open{transform:none;visibility:visible;transition-delay:0s}
.tnum{font-variant-numeric:tabular-nums}
.sh-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.sh-head h2{margin:0;font:800 20px var(--f-display)}
.x{width:34px;height:34px;border-radius:50%;background:#e4f1fb;display:grid;place-items:center}
.x svg{width:18px;height:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:10px}
.card{position:relative;background:#fff;border-radius:16px;padding:8px 4px 7px;display:grid;justify-items:center;align-content:start;gap:1px;box-shadow:0 3px 0 rgba(30,70,120,.12);font:700 12px/1.15 var(--f-display);text-align:center;min-width:0}
.card svg.pv{width:46px;height:46px}
.card .nm{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .tag{font:800 11px var(--f-body);color:var(--muted);display:flex;align-items:center;gap:3px;min-height:15px}
.card .tag svg{width:12px;height:12px;color:#e9a400}
.card.locked{opacity:.62}
.card.on{outline:3px solid var(--jacket)}
.card .fav{position:absolute;top:4px;right:4px;width:18px;height:18px;color:var(--blush)}
.card:active{transform:translateY(2px)}
.tabs{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto;padding-bottom:2px}
.tab{flex:none;padding:7px 14px;border-radius:999px;background:#e4f1fb;font:800 14px var(--f-display);color:var(--muted)}
.tab.on{background:var(--jacket);color:#fff}
.gcards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:12px}
.gcard{text-align:left;padding:12px;border-radius:18px;background:var(--c);color:#fff;display:grid;gap:2px;box-shadow:0 4px 0 rgba(0,0,0,.16);min-width:0}
.gcard b{font:800 17px/1.1 var(--f-display)}
.gcard span{font:700 12px/1.25 var(--f-body);opacity:.95}
.gcard em{font:800 11px var(--f-body);font-style:normal;opacity:.9;margin-top:2px}
.gcard:active{transform:translateY(2px)}
.sub{margin:4px 0 8px;font:800 13px var(--f-display);color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 14px;border-radius:999px;background:#fff;box-shadow:0 3px 0 rgba(30,70,120,.12);font:800 14px var(--f-display)}
.chip.on{background:var(--jacket);color:#fff;box-shadow:0 3px 0 var(--jacket-dk)}
.say{display:flex;gap:8px;margin-bottom:12px}
.say input{flex:1;min-width:0;border:3px solid #cfe4f5;border-radius:16px;padding:10px 14px;font:700 16px var(--f-body);color:var(--text);background:#fff;user-select:text;-webkit-user-select:text}
.btn{background:var(--jacket);color:#fff;border-radius:16px;padding:10px 18px;font:800 16px var(--f-display);box-shadow:0 4px 0 var(--jacket-dk)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--jacket-dk)}
.btn.alt{background:#e4f1fb;color:var(--text);box-shadow:0 4px 0 #c3dbee}
.btn.danger{background:var(--bad);box-shadow:0 4px 0 #c24150}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:2px solid #e4f1fb;font:800 15px var(--f-display)}
.row:last-child{border:0}
.sw{width:50px;height:30px;border-radius:99px;background:#c9dcec;position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .2s}
.sw.on{background:var(--good)}
.sw.on::after{transform:translateX(20px)}
.hint{font:600 13px/1.4 var(--f-body);color:var(--muted);margin:2px 0 0}

/* game overlay */
#gamebar{position:absolute;z-index:6;left:0;right:0;top:58px;padding:0 16px;display:none;align-items:center;gap:8px;pointer-events:none}
#gamebar.on{display:flex}
#gamebar>*{pointer-events:auto}
.gstat{background:var(--glass);border-radius:999px;box-shadow:var(--shadow);padding:6px 14px;font:800 17px var(--f-display);display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.gstat small{font:700 11px var(--f-body);color:var(--muted)}
#gmsg{position:absolute;z-index:5;left:0;right:0;top:34%;text-align:center;font:800 34px/1 var(--f-display);color:#fff;text-shadow:0 3px 0 rgba(30,70,120,.45),0 0 20px rgba(30,70,120,.35);pointer-events:none;opacity:0;transform:scale(.6);transition:opacity .2s,transform .3s cubic-bezier(.3,1.6,.5,1);padding:0 16px}
#gmsg.show{opacity:1;transform:scale(1)}
#pads{position:absolute;z-index:6;left:0;right:0;bottom:0;padding:10px 16px 14px;display:none;gap:10px}
#pads.on{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr)}
.pad{height:78px;border-radius:22px;background:var(--c);color:#fff;font:800 15px var(--f-display);display:grid;place-items:center;align-content:center;gap:2px;box-shadow:0 5px 0 rgba(0,0,0,.2);touch-action:none;transition:filter .08s}
.pad svg{width:30px;height:30px}
.pad.lit{filter:brightness(1.3) saturate(1.1);transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.pad{position:relative}
.pad i{position:absolute;inset:-6px;border-radius:26px;border:5px solid #fff;pointer-events:none;opacity:0}
.pad[disabled]{opacity:.55}

/* modal */
#modal{position:absolute;z-index:9;inset:0;display:none;place-items:center;background:rgba(20,50,90,.4);padding:16px}
#modal.open{display:grid}
.mcard{background:#fff;border-radius:26px;padding:22px 20px 20px;max-width:340px;width:100%;text-align:center;box-shadow:0 20px 50px rgba(20,50,90,.35);animation:pop .4s cubic-bezier(.3,1.6,.5,1);display:grid;gap:10px}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.mcard h3{margin:0;font:800 26px/1.1 var(--f-display)}
.mcard p{margin:0;font:700 15px/1.4 var(--f-body);color:var(--muted)}
.big{font:800 52px/1 var(--f-display);color:var(--jacket);font-variant-numeric:tabular-nums}
.mrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:4px}
.gain{display:flex;gap:14px;justify-content:center;font:800 15px var(--f-display)}
.gain span{display:flex;align-items:center;gap:4px}
.gain svg{width:18px;height:18px;color:#e9a400}

@media (prefers-reduced-motion:reduce){.sheet,#toast,#bubble,#scene{transition:none}.meter.low{animation:none}}
@media (max-height:600px){.dbtn .ic{width:40px;height:40px;border-radius:14px}.dbtn .ic svg{width:22px;height:22px}#stage{--insetTop:96px}}

/* v2 additions */
#cam{will-change:transform}
.ctxrow{position:absolute;z-index:5;left:0;right:0;top:calc(var(--insetTop) + 2px);display:flex;justify-content:center;pointer-events:none}
#ctx{pointer-events:auto;background:var(--glass);border-radius:999px;box-shadow:var(--shadow);padding:6px 16px;font:800 15px var(--f-display);display:flex;align-items:center;gap:6px;max-width:56%}
#ctx svg{width:16px;height:16px;color:var(--muted)}
#ctx span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.navb{position:absolute;z-index:5;top:46%;width:40px;height:56px;border-radius:20px;background:var(--glass);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--text)}
.navb svg{width:22px;height:22px}
#navL{left:6px}#navR{right:6px}
#app.ingame .navb,#app.ingame #ctx,#app.ingame #tools,#app.ingame #wx{display:none}
#wx{position:absolute;z-index:5;left:10px;top:calc(var(--insetTop) + 2px);display:flex;align-items:center;gap:5px;background:var(--glass);border-radius:999px;box-shadow:var(--shadow);padding:5px 11px 5px 7px;font:800 14px var(--f-display)}
#wx svg{width:22px;height:22px}
#tools{position:absolute;z-index:5;right:10px;top:calc(var(--insetTop) + 2px);display:grid;gap:8px}
#tools .ibtn{width:42px;height:42px;position:relative}
#tools .ibtn.on{background:var(--bad);color:#fff}
#tools .ibtn.listen{background:var(--good);color:#fff;animation:lpulse 1s infinite}
@keyframes lpulse{50%{box-shadow:0 0 0 8px rgba(53,194,138,.3)}}
#stage.punch #scene{cursor:crosshair}
.drift{animation:drift 14s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-22px)}to{transform:translateX(22px)}}
.rainfall{animation:rainfall .55s linear infinite}
@keyframes rainfall{to{transform:translate(-6px,26px)}}
.snowfall{animation:snowfall 3.2s linear infinite}
@keyframes snowfall{to{transform:translate(-14px,30px)}}
.swayp{transform-box:fill-box;transform-origin:50% 100%;animation:swayp calc(3.2s / var(--wind,1)) ease-in-out infinite alternate}
@keyframes swayp{from{transform:rotate(-2.5deg)}to{transform:rotate(2.5deg)}}
.rattle .rt{animation:rattle .12s linear 6}
@keyframes rattle{25%{transform:translate(1.5px,-1px) rotate(1deg)}75%{transform:translate(-1.5px,1px) rotate(-1deg)}}
.zone{opacity:0;transition:opacity .2s}
.zhint .zone{opacity:1}
.zone ellipse{animation:zp 1s ease-in-out infinite alternate}
@keyframes zp{from{stroke-opacity:.35}to{stroke-opacity:1}}
#map{position:absolute;z-index:8;inset:0;display:none;background:linear-gradient(#bfe6ff,#d9f3d0);overflow:auto}
#map.open{display:block}
.mapwrap{position:relative;width:100%;max-width:520px;margin:0 auto;height:100%;min-height:520px}
.mapwrap svg.bg{position:absolute;inset:0;width:100%;height:100%}
.pin{position:absolute;transform:translate(-50%,-100%);display:grid;justify-items:center;gap:2px;font:800 12px var(--f-display);color:var(--text);width:92px;text-align:center}
.pin .pb{width:52px;height:52px;border-radius:50% 50% 50% 8px;transform:rotate(-45deg);background:var(--c);display:grid;place-items:center;box-shadow:0 4px 0 rgba(0,0,0,.18);border:3px solid #fff}
.pin .pb b{transform:rotate(45deg);font:800 22px var(--f-display);color:#fff}
.pin.lock{filter:grayscale(.85);opacity:.82}
.pin small{background:#fff;border-radius:99px;padding:2px 8px;box-shadow:0 2px 0 rgba(0,0,0,.1);font:800 11px var(--f-body);color:var(--muted)}
.pin.here .pb{outline:3px solid var(--butter)}
.maptop{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;pointer-events:none}
.maptop>*{pointer-events:auto}
.maptop h2{margin:0;background:var(--glass);border-radius:999px;padding:6px 16px;font:800 18px var(--f-display);box-shadow:var(--shadow)}
#ride{position:absolute;z-index:6;left:0;right:0;top:calc(var(--insetTop) + 4px);display:none;justify-content:center;gap:8px;align-items:center}
#ride.on{display:flex}
#ride .pill{height:34px}
.plbars{display:grid;gap:6px;margin:6px 0 10px}
.plb{display:flex;align-items:center;gap:8px;font:800 13px var(--f-display)}
.plb .bar{flex:1;height:10px;border-radius:99px;background:rgba(30,70,120,.14);overflow:hidden}
.plb .bar i{display:block;height:100%;background:var(--c);border-radius:inherit;transition:width .3s}
.plb span{width:64px}
.prow{display:flex;gap:8px;flex-wrap:wrap}
.prow .btn{padding:9px 14px;font-size:15px}
.btn[disabled]{opacity:.5;filter:grayscale(.5)}
.pcard{display:flex;gap:12px;align-items:center}
.pcard svg.pv{width:84px;height:92px;flex:none;background:#e9f6ff;border-radius:16px}
.menuhead{font:700 13px/1.35 var(--f-body);color:var(--muted);margin:0 0 8px}
</style>

      echoSend.connect(d); d.connect(lp); lp.connect(fb); fb.connect(d);

}
function tone(f,dur=.12,o={}){

  osc.connect(g); g.connect(o.bus||sfxG);
  if(o.send){const s=AC.createGain(); s.gain.value=o.send; g.connect(s); s.connect(echoSend);}
  osc.start(t0); osc.stop(t0+dur+.05);
}
function noise(dur,o={}){

}

function blip(ch,mod=1){
  if(!AC||!S.sfx||S.real) return;

/* ---------- springs ---------- */
class Sp{
  constructor(x,k,c){this.x=x;this.t=x;this.v=0;this.k=k;this.c=c}
  step(dt){const h=dt/4;for(let i=0;i<4;i++){this.v+=(this.k*(this.t-this.x)-this.c*this.v)*h;this.x+=this.v*h}}
  to(t){this.t=t;return this}
  snap(x){this.x=this.t=x;this.v=0}
}

function reach(side,tx,ty){
  const sx=side==='L'?-54:54,sy=-222,a=38,b=50;
  const dx=tx-sx,dy=ty-sy,d=Math.hypot(dx,dy),dd=clamp(d,Math.abs(a-b)+1,a+b-.5);
  const base=Math.atan2(dy,dx),al=Math.acos(clamp((a*a+dd*dd-b*b)/(2*a*dd),-1,1));
  const c1={g:base+al},c2={g:base-al};
  [c1,c2].forEach(c=>{c.ex=sx+Math.cos(c.g)*a;c.ey=sy+Math.sin(c.g)*a});
  const lowA=Math.abs(c1.ey-c2.ey)>5?(c1.ey>c2.ey?c1:c2):(Math.abs(c1.ex)>Math.abs(c2.ex)?c1:c2);
  const hx=sx+Math.cos(base)*dd,hy=sy+Math.sin(base)*dd;
  const th=Math.atan2(-Math.cos(lowA.g),Math.sin(lowA.g));
  const fx=hx-lowA.ex,fy=hy-lowA.ey,fl=Math.hypot(fx,fy)||1;
  const ph=Math.atan2(-fx/fl,fy/fl);
  let rel=(ph-th)/D2R;while(rel>180)rel-=360;while(rel<-180)rel+=360;
  const S_=R['a'+side+'s'],E_=R['a'+side+'e'];
  S_.t=unwrap(th/D2R,S_.x);E_.t=rel;
}

function stepFx(dt){
  for(let i=FX.length-1;i>=0;i--){
    const p=FX[i];p.life-=dt;if(p.life<=0){FX.splice(i,1);continue}
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.g*dt;if(p.fric){const k=Math.max(0,1-p.fric*dt);p.vx*=k;p.vy*=p.k==='bubble'?1:k}p.rot+=p.vr*dt;
    if(p.grow)p.sz+=p.grow*dt;
    if(p.k==='bubble'&&p.wob)p.x+=Math.sin(T*3+p.wob)*18*dt;
  }
}

async function say(txt,o={}){
  const id=++speakId;txt=String(txt).replace(/\s+/g,' ').trim().slice(0,140);if(!txt)return;
  SPEAKING=true;const pitch=o.pitch||1;
  showBubble(txt,Math.max(1700,txt.length*80+1100));

  for(let i=0;i<txt.length;i++){

    let d=64;
    if(v){R.mO.t=v[0];R.mW.t=v[1];R.mR.t=v[2];R.hY.v-=34;R.hRot.t=Math.sin(i*.9)*3.5;blip(c,pitch*(1+(i%3)*.04));d=78}
    else if(/[a-z]/.test(c)){const mb='mbp'.includes(c);R.mO.t=mb?0:.28;R.mW.t=.5;R.mR.t=0;blip(c,pitch);}
    else if(/[.,!?]/.test(ch)){R.mO.t=base.o||0;R.mW.t=base.w??.5;R.mR.t=0;d=210}
    else{R.mO.t=base.o||0;R.mR.t=0;d=70}

}

function tap(part,prop,p){
  if(SLEEP){wakeUp();return}
  if(BUSY)return;
  if(T<cooldown)return;cooldown=T+.12;
  if(prop&&propTap(prop,p))return;
  if(prop==='lamp')return toggleLights();
  if(prop==='clock')return sayTime();
  if(prop==='trophy')return showRecords();
  if(part==='head')return reactHead();
  if(part==='nose')return reactNose();
  if(part==='mouth')return reactMouth();
  if(part==='shades')return reactShades();

  if(ballVisible()&&Math.random()<.85&&!E.air)return act(chaseBall);

  $('#gameCards').innerHTML=list.map(g=>`<button class="gcard" type="button" data-game="${g.id}" style="--c:${g.c}"><b>${g.n}</b><span>${g.d}</span><em>Best ${S.best[g.k]||0}</em></button>`).join('');
  $('#trickChips').innerHTML=Object.keys(TRICKS).map(k=>`<button class="chip" type="button" data-trick="${k}">${({wave:'Wave',flip:'Flip',spin:'Spin',flex:'Flex',dance:'Dance',peek:'Peek',breakdance:'Breakdance',ball:'Ball',balloon:'Balloon',fireworks:'Fireworks'})[k]}</button>`).join('');
}
async function startGame(id){
  if(BUSY||SLEEP)return;
  if(S.needs.energy<12){toast('Echo is too sleepy to play');emote('sleepy',1600);return}
  if(S.hurt>75){toast('Echo is too hurt to play');return}
  if(RIDE.on||roomBusy)return;
  BUSY=true;MODE=id;ACT++;enterGameUI();relax();gazeLock=T+9999;
  const g=GAME=GAMES[id]();
  const ok=await g.intro();
  if(ok&&GAME===g)g.live=true;
}
async function countdown(){
  for(const t of ['3','2','1','Go!']){if(!GAME)return false;showMsg(t);t==='Go!'?SFX.ding():SFX.tap();await wait(t==='Go!'?520:720)}
  hideMsg();return !!GAME;
}
function finishGame(g,quit){
  if(GAME!==g)return;GAME=null;g.live=false;
  if(g.cleanup)g.cleanup();
  leaveGameUI();MODE='home';BUSY=false;gazeLock=0;relax();E.forceWalk=false;
  walkTo(200,470,120);
  if(quit&&g.score<=0)return;
  const sc=Math.round(g.score),coins=Math.round(g.score*g.cm),xp=Math.round(6+g.score*g.xm);
  const best=S.best[g.key]||0,nb=sc>best&&sc>0;if(nb)S.best[g.key]=sc;
  need('fun',22+Math.min(34,sc*.6));need('energy',-8);S.love=clamp(S.love+2,0,100);
  addCoins(coins,true);addXp(xp);
  if(nb){confetti(60);SFX.lvl()}else SFX.ding();
  act(async(ok,w)=>{emote(sc>0?'happy':'sad',2000);await jump(ok,w,480);say(nb?'New record!':sc>0?pick(['That was fun!','Again!','Great game!']):'Oh well!');await w(1200);relax()});
  showModal(`<h3>${g.title}</h3><div class="big">${sc}</div><p>${nb?'New best score!':'Best: '+Math.max(best,sc)}</p><div class="gain"><span><svg><use href="#i-coin"/></svg>+${coins}</span><span>+${xp} XP</span></div><div class="mrow"><button class="btn" data-again type="button">Play again</button><button class="btn alt" data-ok type="button">Done</button></div>`,c=>{
    $('[data-ok]',c).onclick=closeModal;$('[data-again]',c).onclick=()=>{closeModal();setTimeout(()=>startGame(g.key),250)};
  });
}
function buildPads(defs,onDown){
  const el=$('#pads');el.innerHTML=defs.map((d,i)=>`<button class="pad" type="button" data-i="${i}" style="--c:${d.c}"><i></i><svg><use href="#${d.ic}"/></svg>${d.n}</button>`).join('');el.classList.add('on');
  $$('.pad',el).forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();ensureAudio();onDown(+b.dataset.i)}));
  $('#stage').style.setProperty('--insetBottom','108px');
}
function litPad(i,ms=220){const b=$$('#pads .pad')[i];if(!b)return;b.classList.add('lit');setTimeout(()=>b.classList.remove('lit'),ms)}

    onDown(p){g.tx=p.x},onMove(p){if(PT.down)g.tx=p.x},
    update(dt){
      if(!g.live)return;
      g.t-=dt;g.spawn-=dt;
      if(g.spawn<=0){g.spawn=rnd(.3,.6)*(g.t<10?.75:1);const r=Math.random(),type=r<.15?'bad':r<.25?'gold':'star';g.objs.push({type,x:rnd(46,354),y:-30,vy:rnd(150,225)+(30-g.t)*3.5,rot:rnd(0,6),sz:type==='gold'?21:16})}

        if(!o.dead&&o.y>E.fy-335*s&&o.y<E.fy-190*s&&Math.abs(o.x-E.x)<88*s){
          o.dead=true;
          if(o.type==='bad'){g.score=Math.max(0,g.score-2);g.combo=0;SFX.bad();emote('yuck',700);burst('crumb',o.x,o.y,6,{col:'#3bb26b',s0:30,s1:90,g:300,life:.7,sz:5});floatTxt('-2',o.x,o.y-20,'#ff6b78');R.hS.x=.9;R.tilt.v+=120}
          else{const gain=o.type==='gold'?5:1+Math.floor(g.combo/6);g.combo++;g.score+=gain;SFX[o.type==='gold'?'sparkle':'pop']();sparkles(o.x,o.y,o.type==='gold'?12:5,['#ffd45e','#fff','#ffb3d1']);floatTxt('+'+gain,o.x,o.y-24);R.hY.v-=120;if(g.combo%6===0&&g.combo)emote('happy',900)}

      }
      const tx='Stars '+g.score+(g.combo>=6?` <small>x${1+Math.floor(g.combo/6)}</small>`:'');if(tx!==g.txt){g.txt=tx;setBar(tx,Math.max(0,Math.ceil(g.t))+'s')}else $('#gsB').textContent=Math.max(0,Math.ceil(g.t))+'s';

          c.fillStyle='#17120f';c.beginPath();c.arc(-3,0,1.6,0,TAU);c.arc(3,0,1.6,0,TAU);c.fill();
        }else{
          const gold=o.type==='gold',r=o.sz;

          c.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.5:r;c.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}c.closePath();
          c.fillStyle=gold?'#ff9d3c':'#ffd45e';c.fill();c.lineJoin='round';c.lineWidth=3;c.strokeStyle='#17120f';c.stroke();

function gSays(){
  const defs=[{n:'Wave',c:'#ff7eb0',ic:'i-wave'},{n:'Spin',c:'#2bb0e0',ic:'i-spin'},{n:'Jump',c:'#e6a800',ic:'i-up'},{n:'Flex',c:'#2fb784',ic:'i-flex'}];

    async(ok,w)=>{armFront('R',true);R.aRs.t=-155;R.aRe.t=0;if(!await w(150))return;for(let i=0;i<3;i++){R.aRe.t=i%2?-34:34;if(!await w(120))return}armFront('R',false);R.aRs.t=-8;R.aRe.t=10},
    async(ok,w)=>{SFX.whoosh();await tween(520,t=>{R.spin.x=R.spin.t=360*ease(t);R.spin.v=0});R.spin.snap(0)},
    async(ok,w)=>{await jump(ok,w,470)},
    async(ok,w)=>{armFront('L',true);armFront('R',true);R.aLs.t=90;R.aLe.t=90;R.aRs.t=-90;R.aRe.t=-90;R.tum.x=1.1;if(!await w(480))return;armFront('L',false);armFront('R',false);R.aLs.t=8;R.aLe.t=-10;R.aRs.t=-8;R.aRe.t=10}
  ];

  const g={key:'says',title:'Echo Says',cm:2.4,xm:1.6,score:0,seq:[],idx:0,phase:'idle',live:false,
    async intro(){walkTo(200,462,140);buildPads(defs,i=>g.pad(i));setBar('Round 1','Get ready');await wait(1300);if(GAME!==g)return false;face('happy0');setTimeout(()=>GAME===g&&g.round(),200);return true},
    async round(){
      g.phase='show';g.idx=0;g.seq.push(Math.floor(Math.random()*4));setBar('Round '+g.seq.length,'Watch!');

/* Dance Party */
function gDance(){
  const defs=[{n:'Left',c:'#ff7eb0',ic:'i-left'},{n:'Pop',c:'#e6a800',ic:'i-up'},{n:'Right',c:'#2bb0e0',ic:'i-right'}];
  const beat=.58,lead=1.35,N=30,evs=[];let prev=-1;
  for(let k=0;k<N;k++){let p;do{p=Math.floor(Math.random()*3)}while(p===prev);prev=p;evs.push({t:1.8+k*beat,pad:p,done:false})}
  const g={key:'dance',title:'Dance Party',cm:.5,xm:.42,score:0,clock:0,lastBeat:-1,combo:0,hits:0,live:false,
    async intro(){await walkTo(200,466,140);if(GAME!==g)return false;buildPads(defs,i=>g.pad(i));R.disco.t=1;E.dance=Math.PI/beat;setBar('Score 0','Ready');return countdown()},
    pad(i){
      if(GAME!==g||!g.live)return;
      litPad(i,180);
      let best=null;for(const e of evs){if(!e.done&&e.pad===i&&Math.abs(e.t-g.clock)<.3&&(!best||Math.abs(e.t-g.clock)<Math.abs(best.t-g.clock)))best=e}
      const h=headPos();
      if(!best){g.combo=0;SFX.bad();return}
      best.done=true;const err=Math.abs(best.t-g.clock);g.hits++;g.combo++;
      const pts=err<.09?3:2;g.score+=pts+Math.floor(g.combo/8);
      floatTxt(err<.09?'Perfect!':'Good',h.x,h.y-120*h.s,err<.09?'#fff':'#ffd45e');
      SFX.note([523,659,784][i]*(err<.09?2:1));sparkles(h.x+(i-1)*60,h.y-40*h.s,err<.09?8:4);
      const d=i-1;R.tilt.v+=d*190;R.hair.v+=d*200;if(i===1){E.air=true;E.vy=330}else{R.aLs.v+=d*400;R.aRs.v+=d*400}R.hS.x=1.06;
    },
    update(dt){
      if(!g.live)return;
      g.clock+=dt;
      const nb=Math.floor(g.clock/beat);
      if(nb>g.lastBeat){g.lastBeat=nb;tone(130,.16,{to:45,vol:.38,bus:musG||sfxG,music:true});if(nb%2)noise(.06,{ft:'highpass',f:6000,vol:.08});if(nb%4===0)tone(98,.5,{type:'triangle',vol:.1,music:true})}
      const pads=$$('#pads .pad');
      for(const e of evs){if(!e.done&&g.clock>e.t+.26){e.done=true;g.combo=0;SFX.bad()}}
      pads.forEach((p,i)=>{
        const e=evs.find(x=>!x.done&&x.pad===i&&x.t-g.clock<lead);const ring=p.querySelector('i');
        if(e){const k=clamp((e.t-g.clock)/lead,0,1);ring.style.opacity=(.95-k*.55).toFixed(2);ring.style.transform=`scale(${(1+k*1.4).toFixed(3)})`}else ring.style.opacity=0;
      });
      setBar('Score '+g.score,g.combo>=3?`Combo x${g.combo}`:'Keep going');
      if(g.clock>evs[evs.length-1].t+1.1){g.score=g.score;finishGame(g)}
    }
  };
  return g;
}

const STYLE_CATS=[['outfit','Outfits'],['top','Tops'],['pants','Pants'],['shoes','Shoes'],['hat','Hats'],['glass','Shades'],['neck','Neck'],['wall','Room']];

function pickItem(id){
  const cat=styleCat,it=SHOP[cat].find(x=>x.id===id);if(!it)return;
  const owned=S.own[cat].includes(id);
  if(!owned){
    if(S.level<it.l){toast(`Unlocks at level ${it.l}`);SFX.bad();return}

  }

  {l:'Say hi',run:()=>echoBack('Hi Echo!')},

function echoBack(text){
  return act(async(ok,w)=>{
    text=String(text).trim().slice(0,100);if(!text||SLEEP||BUSY)return;
    face('wow');R.hRot.t=7;R.mO.t=.25;if(!await w(430))return;
    face('happy');await say(text);if(!ok())return;
    const last=text.split(/\s+/).slice(-2).join(' ').replace(/[.!?,]+$/,'');
    for(let i=0;i<2;i++){
      if(!await w(220))return;const m=mouthPos();
      burst('ring',m.x,m.y,1,{s0:0,s1:0,life:.8,sz:12,grow:90-i*30,col:'rgba(255,255,255,.9)'});
      await say('...'+last+(i?'...':'!'),{pitch:1.2+i*.22,slow:.9});if(!ok())return;
    }
    S.love=clamp(S.love+.5,0,100);if(!await w(300))return;relax();
  });
}
function tellJoke(){
  const j=pick(JOKES);
  act(async(ok,w)=>{emote('smug',3500);await say(j[0]);if(!await w(900))return;await say(j[1]);if(!ok())return;SFX.giggle();emote('laugh',1700);R.tum.x=1.14;if(!await w(1500))return;relax()});
}
function knock(){
  act(async(ok,w)=>{
    emote('smug',9000);
    await say('Knock knock!');if(!await w(450))return;
    await say("Who's there?",{pitch:1.35});if(!await w(450))return;
    await say('Echo.');if(!await w(450))return;
    await say('Echo who?',{pitch:1.35});if(!await w(500))return;
    await say('Echo who? Echo who? Echo who?',{pitch:1.1});if(!ok())return;
    SFX.giggle();emote('laugh',1800);if(!await w(1600))return;relax();
  });
}
function sing(){
  const mel=[[523,'la'],[659,'la'],[784,'laa'],[659,'la'],[523,'la'],[587,'la'],[659,'laaa'],[0,''],[784,'e'],[880,'cho'],[784,'e'],[659,'cho'],[523,'laaa']];

    face('happy');R.eyeH.t=1;
    for(let i=0;i<mel.length;i++){
      const [f,s]=mel[i];if(!ok())return;if(!f){await w(300);continue}

function gMemory(){
  const GL=[['★','#ffb21f'],['♥','#ff5f7e'],['♣','#4ec06a'],['●','#3cb4e8'],['▲','#b58cff'],['♦','#ff9d3c']];
  let cards=[],first=null,lock=0,round=0,pairsDone=0;
  const deal=()=>{const set=[...GL].sort(()=>Math.random()-.5).slice(0,4),ids=[];set.forEach((s,i)=>{ids.push(i,i)});ids.sort(()=>Math.random()-.5);
    cards=ids.map((id,i)=>({id,g:set[id],x:42+(i%4)*76,y:-40+Math.floor(i/4)*64,w:64,h:56,flip:0,face:0,done:0}));first=null;pairsDone=0;round++};
  const g={key:'memory',title:'Memory Match',cm:.9,xm:.7,score:0,t:45,live:false,
    async intro(){await walkTo(200,470,140);if(GAME!==g)return false;face('happy0');deal();setBar('Pairs 0','45s');return countdown()},
    onDown(p){
      if(!g.live||lock>0)return;
      const c=cards.find(k=>!k.done&&!k.face&&p.x>k.x&&p.x<k.x+k.w&&p.y>k.y&&p.y<k.y+k.h);if(!c)return;
      c.face=1;SFX.pop();tone(500+c.id*90,.1,{type:'triangle',vol:.14});R.lx.t=clamp((c.x+33-E.x)/140,-1,1);R.ly.t=-.7;
      if(!first){first=c;return}
      if(first.id===c.id){const a=first,b=c;first=null;lock=.5;setTimeout(()=>{a.done=1;b.done=1},350);g.score+=2;pairsDone++;SFX.sparkle&&SFX.sparkle();sparkles(c.x+33,c.y+33,8);emote('happy',900);
        if(pairsDone>=4){g.score+=3+Math.round(g.t/10);g.t=Math.min(45,g.t+6);confetti(30);setTimeout(()=>{if(GAME===g&&g.live)deal()},900);lock=1}}
      else{const a=first,b=c;first=null;lock=.8;setTimeout(()=>{a.face=0;b.face=0},700);emote('sad',600)}
    },
    update(dt){if(!g.live)return;g.t-=dt;if(lock>0)lock-=dt;for(const c of cards)c.flip+=((c.face||c.done?1:0)-c.flip)*Math.min(1,dt*14);setBar('Score '+g.score,Math.max(0,Math.ceil(g.t))+'s');if(g.t<=0)finishGame(g)},
    draw(c){
      for(const k of cards){
        if(k.done&&k.flip>.98&&lock<=0&&false)continue;
        const sx=Math.abs(Math.cos(k.flip*Math.PI)),showFace=k.flip>.5;
        c.save();c.translate(k.x+k.w/2,k.y+k.h/2);c.scale(Math.max(.04,sx),1);
        c.globalAlpha=k.done?.55:1;
        c.fillStyle=showFace?'#fff':'#7a55c7';c.strokeStyle=INK;c.lineWidth=3.5;c.beginPath();c.roundRect?c.roundRect(-k.w/2,-k.h/2,k.w,k.h,12):c.rect(-k.w/2,-k.h/2,k.w,k.h);c.fill();c.stroke();
        c.textAlign='center';c.textBaseline='middle';
        if(showFace){c.fillStyle=k.g[1];c.font="800 40px 'Baloo 2',sans-serif";c.fillText(k.g[0],0,3)}
        else{c.fillStyle='rgba(255,255,255,.55)';c.font="800 30px 'Baloo 2',sans-serif";c.fillText('E',0,2)}
        c.restore();
      }
    }
  };
  return g;
}
function gBounce(){
  const g={key:'bounce',title:'Bounce Master',cm:.7,xm:.6,score:0,t:30,live:false,ph:'wait',pt:0,combo:0,tapped:null,maxH:0,msg:'',msgT:0,pow:560,TW:.62},
  setMsg=(m,col)=>{g.msg=m;g.msgT=.7;g.col=col};
  Object.assign(g,{
    async intro(){await walkTo(120,468,140);if(GAME!==g)return false;E.tramp=true;face('laugh');R.sq.t=1;setBar('Bounces 0','30s');g.pt=0;return countdown()},
    onDown(){if(!g.live||g.ph!=='wait'||g.tapped!==null)return;g.tapped=g.pt;
      const d=Math.abs(g.pt-g.TW);
      if(d<.09){g.combo++;g.pow=Math.min(1150,g.pow+75);g.score+=2+Math.min(g.combo,4);setMsg('PERFECT!','#ffd45e');SFX.sparkle&&SFX.sparkle()}
      else if(d<.2){g.combo=Math.max(1,g.combo);g.score+=1;g.pow=Math.min(1150,Math.max(620,g.pow));setMsg('Good','#fff')}
      else{g.combo=0;g.pow=Math.max(560,g.pow-110);setMsg('Oops','#ff9a9a')}
      g.launch();
    },
    launch(){R.sq.t=1.14;R.hY.t=-8;E.air=true;E.vy=g.pow;SFX.boing();tone(300+g.combo*60,.3,{to:600+g.combo*60,type:'sine',vol:.12});R.aLs.t=140;R.aRs.t=-140;R.lL.t=-14;R.lR.t=14;g.ph='air';g.maxH=0;
      if(g.combo>=3&&g.combo%3===0){tween(700,t=>{R.tilt.x=R.tilt.t=360*ease(t);R.tilt.v=0}).then(()=>R.tilt.snap(0))}},
    update(dt){
      if(!g.live)return;g.t-=dt;if(g.msgT>0)g.msgT-=dt;
      if(g.ph==='wait'){g.pt+=dt;if(g.pt>.18&&g.pt<g.TW){R.sq.t=.78;R.hY.t=10}
        if(g.pt>g.TW+.28&&g.tapped===null){g.combo=0;g.pow=Math.max(560,g.pow-110);setMsg('Late','#ff9a9a');g.tapped=g.pt;g.launch()}}
      else if(g.ph==='air'){g.maxH=Math.max(g.maxH,E.h);if(!E.air&&E.h<=0){g.ph='wait';g.pt=0;g.tapped=null;R.sq.t=.8}}
      setBar('Bounces '+g.score+(g.combo>=2?` <small>x${g.combo}</small>`:''),Math.max(0,Math.ceil(g.t))+'s');
      if(g.t<=0)finishGame(g);
    },
    draw(c){
      if(g.ph==='wait'&&g.tapped===null){
        const k=clamp(g.pt/g.TW,0,1.4),r=48+Math.max(0,1-k)*70;
        c.save();c.translate(E.x,E.fy-8);c.scale(1,.36);
        c.strokeStyle='rgba(255,255,255,.95)';c.lineWidth=7;c.beginPath();c.arc(0,0,48,0,TAU);c.stroke();
        c.strokeStyle=Math.abs(g.pt-g.TW)<.09?'#ffd45e':'#7fe0ff';c.lineWidth=6;c.beginPath();c.arc(0,0,r,0,TAU);c.stroke();c.restore();
      }
      if(g.msgT>0){c.save();c.globalAlpha=clamp(g.msgT*3,0,1);c.fillStyle=g.col||'#fff';c.strokeStyle=INK;c.lineWidth=5;c.font="800 34px 'Baloo 2',sans-serif";c.textAlign='center';c.strokeText(g.msg,E.x,E.fy-E.h-340+ (0.7-g.msgT)*-30);c.fillText(g.msg,E.x,E.fy-E.h-340+(0.7-g.msgT)*-30);c.restore()}
    },
    cleanup(){E.tramp=false;R.tilt.snap(0)}
  });
  return g;
}
Object.assign(GAMES,{mole:gMole,memory:gMemory,bounce:gBounce});

 {id:'mole',n:'Mole Mash',d:'Tap the moles. Skip the broccoli!',c:'#a8744c',k:'mole',loc:'playground'},

/* ============================================================
   Talking Echo v2: actions that tie rooms together, init
   ============================================================ */
ROOMS.kitchen.eatX=290;
async function goFeed(){
  if(SLEEP){toast('Shh... Echo is sleeping');return}if(BUSY||GAME||roomBusy||RIDE.on){toast('Echo is busy right now');return}
  if(ROOM.eat){openSheet('menu');return}
  if(!atHome()){toast('Eat at a restaurant here on the map, or head home');return}
  if(curRoom!=='kitchen')await goRoom('kitchen',{dir:1,x:140});
  openSheet('feed');
}
async function goBath(){
  if(SLEEP){toast('Shh... Echo is sleeping');return}if(BUSY||GAME||roomBusy||RIDE.on){toast('Echo is busy right now');return}
  if(!atHome()){toast("Let's go home first");return}
  closeSheets();
  if(curRoom!=='bath')await goRoom('bath',{dir:1,x:200});
  ZHINT=T+5;toast('Drag Echo onto the toilet or the bath mat');
  act(async(ok,w)=>{emote('happy0',1600);say('Toilet or bath? Drag me!')});
}
async function goBed(){
  if(SLEEP){wakeUp();return}if(BUSY||GAME||roomBusy||RIDE.on){toast('Echo is busy right now');return}
  if(!atHome()){toast("Let's go home first");return}
  closeSheets();goSleep(false);
}
function zoneAction(id){
  if(BUSY||SLEEP||GAME||roomBusy)return;
  if(id==='toilet')useToilet();else if(id==='tub')bath();else if(id==='bed')goSleep(false);else if(id==='table')openSheet('feed');
}
function coffee(){
  if(BUSY||SLEEP)return;BUSY=true;
  act(async(ok,w)=>{
    await walkTo(110,470,130);if(!ok())return;
    armFront('R',true);reach('R',-30,-250);face('happy0');say('Coffee break!');if(!await w(700))return;SFX.pop();
    R.mO.t=.4;R.hY.t=-4;if(!await w(500))return;need('energy',16);need('fun',2);R.mO.t=0;
    emote('wow',1800);say('Whoa, I feel super fast!');
    for(let i=0;i<10;i++){R.lL.t=i%2?26:-26;R.lR.t=i%2?-26:26;R.hRot.t=i%2?5:-5;R.hair.v+=i%2?200:-200;E.wamp=1;if(!await w(90))return}
    E.wamp=0;
  }).then(()=>{BUSY=false;relax()});
}
function propTap(prop,p){
  if(RIDE.on||GAME)return true;
  if(prop==='curtain'){curtainsToggle();return true}
  if(prop.startsWith('plant:')){openPlant(prop.slice(6));return true}
  switch(prop){
    case'fridge':case'table':openSheet('feed');return true;
    case'toilet':useToilet();return true;
    case'piano':openPiano();return true;
    case'tramp':act(trampoline);return true;
    case'tub':bath();return true;
    case'wardrobe':styleCat='outfit';openSheet('style');return true;
    case'gcan':toast('Tap a plant to water it or give it food');SFX.pop();return true;
    case'swing':startGame('swing');return true;
    case'sandbox':startGame('dig');return true;
    case'papers':startGame('grade');return true;
    case'board':startGame('quiz');return true;
    case'coffee':coffee();return true;
    case'trike':openMap();return true;
    case'menu':openSheet('menu');return true;
    case'schooldoor':act(async(ok,w)=>{await walkTo(200,470,130);if(!ok())return;SFX.swish();say('Time for class!');await goRoom('faculty',{dir:1,x:110})});return true;
  }
  return false;
}
/* ---------- init ---------- */
function todayKey(){return new Date().toDateString()}
function pickFave(){const k=todayKey();let h=0;for(const c of k)h=(h*31+c.charCodeAt(0))>>>0;return FOODS[h%9].id}
function catchUp(){
  if(!S.last)return 0;
  const sec=clamp((Date.now()-S.last)/1000,0,6*3600),n=S.needs,f=.2;
  n.hunger=Math.max(10,n.hunger-.115*sec*f);n.fun=Math.max(14,n.fun-.1*sec*f);n.clean=Math.max(16,n.clean-.06*sec*f);n.potty=Math.max(25,n.potty-.085*sec*f);n.energy=Math.min(100,n.energy+Math.min(60,sec*.01));
  S.hurt=Math.max(0,S.hurt-sec*.03);
  return sec;
}
function init(){
  const away=catchUp();
  S.fave=pickFave();
  mountRoom('living');hereLoc='home';
  applyLook();sizeCanvas();updateView();wire();updateHud();
  E.x=200;E.fy=470;relax();face(moodFace());R.light.snap(1);R.sq.snap(1);
  setWeather(W.kind,W.temp,'snapshot');syncWeather();
  requestAnimationFrame(frame);
  const newDay=S.day!==todayKey(),fv=FOODS.find(f=>f.id===S.fave);
  if(!S.intro){
    BUSY=true;E.h=360;E.air=true;E.vy=0;R.eyeO.snap(1);
    showModal(`<h3>Meet Echo</h3><p>Echo is your new best friend. Feed him, give him baths, play games, dress him up, grow plants, ride his e-bike around town, and say anything. He repeats it back with an echo.</p><div class="gain"><span><svg><use href="#i-coin"/></svg>+15 welcome coins</span></div><div class="mrow"><button class="btn" data-ok type="button">Say hi</button></div>`,c=>{
      $('[data-ok]',c).onclick=()=>{
        closeModal();ensureAudio();S.intro=true;S.day=todayKey();S.coins+=15;S.seen.v2=1;updateHud();persist();SFX.sparkle();
        act(async(ok,w)=>{BUSY=true;await w(1000);BUSY=false;if(!ok())return;emote('happy',2000);await say('Hi! I\'m Echo!');if(!await w(300))return;await say('Tap me, feed me, play with me!');if(!await w(500))return;relax()});
      };
    });
  }else if(!S.seen.v2){
    S.seen.v2=1;S.day=todayKey();
    showModal(`<h3>Echo has a bigger home!</h3><p>New rooms: use the arrows to visit the bedroom, kitchen, bathroom and backyard. Drag Echo to the toilet, bath or bed. Tap windows to close the curtains and tap plants to water them. Visit the town on the map with his e-bike, and try the mic button to hear Echo repeat you.</p><div class="mrow"><button class="btn" data-ok type="button">Let's explore</button></div>`,c=>{$('[data-ok]',c).onclick=closeModal});
  }else if(newDay){
    S.day=todayKey();
    showModal(`<h3>Welcome back!</h3><p>${away>1800?'Echo missed you.':'Echo is happy to see you.'} Today's favorite food is <b>${fv.n.toLowerCase()}</b>.</p><div class="gain"><span><svg><use href="#i-coin"/></svg>+15 daily gift</span></div><div class="mrow"><button class="btn" data-ok type="button">Collect</button></div>`,c=>{
      $('[data-ok]',c).onclick=()=>{closeModal();ensureAudio();S.coins+=15;updateHud();SFX.coin();persist();act(async(ok,w)=>{emote('happy',2000);await jump(ok,w,520);say('You\'re back!')})};
    });
  }else if(away>1800){
    act(async(ok,w)=>{await w(500);emote('love',2400);await jump(ok,w,520);say('You came back!');hearts(E.x,E.fy-300,6)});
  }
  persist();
}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&Mic.state!=='off')micStop()});
init();
