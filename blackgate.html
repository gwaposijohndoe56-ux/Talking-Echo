/* ===== boot.js ===== */
/* ============================================================
   BLACKGATE boot: handshake with the law ledger, lease, load,
   offline catch-up, main loop.
   ============================================================ */
const setBoot=t=>{const e=$('#bootT');if(e)e.textContent=t};
function fatalScreen(html,acts){const b=$('#boot');if(b)b.remove();showOverlay(html,acts)}
function backToGame(){location.href=gameUrl()}
function lawRecoveryScreen(r){
  const bak=LAW.readBackup();
  fatalScreen(`<h1>The custody record can't be read</h1><p>It failed its integrity check (${esc(r.detail||r.why)}). Nothing was changed or deleted.</p>
   <button class="sbtn" data-a="ex" type="button">Show a copy of the raw data</button>${bak?`<button class="sbtn pri" data-a="bak" type="button">Restore the last good copy (rev ${bak.rev})</button>`:''}
   <button class="sbtn bad" data-a="rs" type="button">Discard the record and start clean</button><button class="sbtn" data-a="gm" type="button">Back to the game</button><pre id="rawOut" style="display:none;text-align:left;font-size:11px;max-height:160px;overflow:auto;white-space:pre-wrap;word-break:break-all;background:#0e1317;padding:8px;border-radius:8px"></pre>`,
   {ex:()=>{const p=$('#rawOut');p.style.display='block';p.textContent=LAW.exportText()},bak:()=>{if(LAW.write(bak))location.reload()},rs:b=>{if(!b._a){b._a=1;b.textContent='Tap again: this deletes the record';return}try{localStorage.removeItem(LAW.K.law);localStorage.removeItem(LAW.K.bak)}catch(e){}backToGame()},gm:backToGame});
}
function prisonRecoveryScreen(raw,cur){
  let bakRaw=null;try{bakRaw=localStorage.getItem(BGK.bak)}catch(e){}let bakOk=null;try{bakOk=migrate(JSON.parse(bakRaw),cur)}catch(e){}
  fatalScreen(`<h1>The prison save can't be read</h1><p>The saved prison world is damaged. Your sentence is safe in the separate custody record and is still counting. Nothing was deleted.</p>
   <button class="sbtn" data-a="ex" type="button">Show a copy of the damaged data</button>${bakOk?`<button class="sbtn pri" data-a="bak" type="button">Restore the previous save</button>`:''}
   <button class="sbtn bad" data-a="fr" type="button">Start a fresh prison file (the sentence is unchanged)</button><pre id="rawOut" style="display:none;text-align:left;font-size:11px;max-height:160px;overflow:auto;white-space:pre-wrap;word-break:break-all;background:#0e1317;padding:8px;border-radius:8px"></pre>`,
   {ex:()=>{const p=$('#rawOut');p.style.display='block';p.textContent=String(raw).slice(0,6000)},bak:()=>{try{localStorage.setItem(BGK.main,bakRaw);localStorage.removeItem(BGK.rev)}catch(e){}location.reload()},
    fr:b=>{if(!b._a){b._a=1;b.textContent='Tap again to confirm';return}try{localStorage.setItem(BGK.prev,String(raw));localStorage.removeItem(BGK.main);localStorage.removeItem(BGK.rev)}catch(e){}location.reload()}});
}
function storageBlockedScreen(){fatalScreen(`<h1>Storage is blocked</h1><p>Blackgate keeps the sentence and the prison world in this browser's storage, and it cannot read or write it here. It will not run without saving, because a sentence that can't be saved can't be served honestly. Nothing was changed.</p><p>Allow site data for this page (or leave private browsing) and try again.</p><button class="sbtn pri" data-a="r" type="button">Try again</button><button class="sbtn" data-a="g" type="button">Back to the game</button>`,{r:()=>location.reload(),g:backToGame})}
function notInmateScreen(st){
  const msg=st.status==='released'?'Echo has been released. Welcome back to the game.':st.status==='fugitive'?'Echo escaped and is a fugitive. The police are searching.':'There is no sentence in force. Echo is not an inmate here.';
  const acts={g:backToGame};let extra='';
  if(st.status==='fugitive'){extra='<button class="sbtn bad" data-a="s" type="button">Surrender and return to custody</button>';acts.s=()=>{const r=LAW.surrender();if(r.ok)location.reload();else toast('Could not update the record.')}}
  fatalScreen(`<h1>Blackgate</h1><p>${esc(msg)}</p><button class="sbtn pri" data-a="g" type="button">Back to the game</button>${extra}`,acts);
}
function leaseBlockedScreen(){
  fatalScreen(`<h1>Blackgate is open in another tab</h1><p>Only one window may run the prison at a time so two tabs can't overwrite each other's progress.</p><button class="sbtn pri" data-a="t" type="button">Take over here</button><button class="sbtn" data-a="g" type="button">Back to the game</button>`,{t:()=>{leaseWrite();setTimeout(()=>location.reload(),300)},g:backToGame});
}
function carryFrom(old){
  const c={rel:{},flags:{},stays:(old.stays||1)+1,endings:old.end?[old.end.id]:[]};
  for(const k in old.rel){const r=old.rel[k];c.rel[k]={fam:r.fam*.6,trust:r.trust*.5,resp:r.resp*.6,susp:r.susp*.5}}
  ['met_marlow'].forEach(k=>{});c.wmEnd=old.wm;c.leftAt=old.ts;return c;
}
async function boot(){
  setBoot('Checking storage...');
  if(!LAW.storageOk())return storageBlockedScreen();
  const r=LAW.read();
  if(r.why==='corrupt')return lawRecoveryScreen(r);
  if(!r.state||!LAW.locked(r.state))return notInmateScreen(r.state||{status:'free'});
  if(!leaseFree()&&!/[?&]takeover\b/.test(location.search))return leaseBlockedScreen();
  leaseWrite();
  /* ledger: transport -> custody. Idempotent: a second tab or a reload does nothing twice. */
  let st=r.state;
  if(st.status==='transport'){const c=LAW.toCustody();if(!c.ok)return fatalScreen('<h1>Could not record arrival</h1><p>The custody record could not be updated. Try again.</p><button class="sbtn pri" data-a="r" type="button">Try again</button>',{r:()=>location.reload()});st=c.state}
  const lc=LAW.commit(()=>{});if(!lc.ok)return lawRecoveryScreen({why:lc.why,detail:lc.why});lawSnap(lc);st=lc.state;
  const cur=st.cur;
  /* prison world */
  setBoot('Opening the prison record...');
  let raw=null;try{raw=localStorage.getItem(BGK.main)}catch(e){}
  let fresh=false,newStay=false,b=null;
  if(raw==null){b=freshB(cur);fresh=true}
  else{
    try{const j=JSON.parse(raw);b=migrate(j,cur);if(!b)throw new Error('schema');
      if(b.caseId!==cur.id){try{localStorage.setItem(BGK.prev,raw)}catch(e){}b=freshB(cur,carryFrom(b));fresh=true;newStay=true}}
    catch(e){return prisonRecoveryScreen(raw,cur)}
  }
  B=b;
  if(fresh&&B.carry){for(const k in B.carry.rel)B.rel[k]=B.carry.rel[k];B.stays=B.carry.stays;
    /* the prison kept living while Echo was out: its calendar continues */
    const away=Math.max(0,cur.arrestedAt-(B.carry.leftAt||cur.arrestedAt));B.wm=T0MIN+Math.floor((B.carry.wmEnd||0)/1440+1)*1440+Math.min(120*1440,Math.floor(away/60000*(1440/B.cfg.dayMin)))}
  /* Echo's own save: shared with the game */
  S=loadSave();
  if(S.needs.energy>100)S.needs.energy=100;
  applyCfg();
  if(B.cfg.audio){/* never autoplay: audio waits for a tap */B.cfg.audio=0}
  setLook();
  $('#boot').remove();
  const before=B.wm;updWorld();const gap=B.wm-before;
  if(!fresh&&gap>45)catchUp(before,B.wm,gap);
  mountRoom(B.loc);face('neutral');
  bindUI();refresh();setSave('ok');
  requestAnimationFrame(frame);
  startLoops();
  try{lawBeat()}catch(e){}
  if(fresh)saveNow();
  setTimeout(()=>afterBoot(fresh,newStay),400);
}
function bindUI(){
  $$('#dock button').forEach(b=>b.addEventListener('click',()=>{if(Aud.on)Aud.blip(380);openPanel(b.dataset.p)}));
  $('#shX').onclick=closeSheet;
  $('#actX').onclick=()=>{finishAct(false)};
  $('#scene').addEventListener('click',sceneTap);
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&SHEET&&!DLGON)closeSheet()});
  window.addEventListener('beforeunload',()=>{try{if(!RO)saveNow()}catch(e){}});
  document.addEventListener('pointerdown',()=>{if(B&&B.cfg.audio&&!Aud.on)Aud.start()},{once:false});
}
let LASTMIN=-1,LASTBLK='',LASTDAY=0,SECT=0;
function startLoops(){
  LASTMIN=Math.floor(B.wm);LASTBLK=curBlock().id;LASTDAY=DAYN();
  setInterval(tick,250);
  setInterval(()=>{if(!RO&&!document.hidden){lawBeat();if(eligibleNow()&&!B.flags.served){B.flags.served=1;onTimeServed()}}},10000);
  setInterval(leaseBeat,3000);
  setInterval(()=>{if(!RO&&saveDirty)saveNow()},4000);
}
function tick(force){
  if(RO||!B)return;
  const m0=Math.floor(B.wm);updWorld();const m1=Math.floor(B.wm);
  drawClock();drawAct();
  if(m1!==m0||force){
    const dm=Math.min(60,m1-m0),sleeping=B.act&&B.act.id==='sleep';
    decay(dm,sleeping);tickAct();
    if(DAYN()!==LASTDAY){LASTDAY=DAYN();try{rollover()}catch(e){console.error(e)}}
    const bid=curBlock().id;if(bid!==LASTBLK){const old=LASTBLK;LASTBLK=bid;onBlock(old,bid)}
    tint();renderNpcs();drawNeeds();echoFace();
    try{enforceNow();eventTick()}catch(e){console.error(e)}
    if(Math.floor(m1)%5===0)saveSoon();
  }
}
/* ---------- offline progression: bounded, deterministic, no invented drama ---------- */
function catchUp(w0,w1,gap){
  const days=Math.floor(w1/1440)-Math.floor(w0/1440),sum={gap,days,meals:0,shifts:0,pay:0};
  if(B.act){finishAct(true)}
  const maxDays=Math.min(days,14);
  /* world days the player slept through are processed one at a time, in order */
  if(days>0){const startDay=Math.floor(w0/1440)+1;
    for(let d=startDay+1;d<=startDay+maxDays;d++){
      try{rollover(d,true)}catch(e){console.error(e)}
      const dow=(2+d-1)%7,wd=dow!==0&&dow!==6;
      sum.meals+=3;if(B.job&&wd){sum.shifts+=2;const p=JOBS[B.job.id].pay*2;B.acct+=p;sum.pay+=p;B.job.shifts=(B.job.shifts||0)+2}
    }
    if(days>maxDays)B.roll=DAYN();
  }
  const n=S.needs,hrs=gap/60;
  n.hunger=Math.max(n.hunger,gap>180?62:n.hunger);n.clean=Math.max(n.clean,gap>240?58:n.clean);n.potty=Math.max(n.potty,gap>120?70:n.potty);
  n.energy=Math.max(n.energy,gap>480?78:gap>180?Math.min(100,n.energy+30):n.energy);n.fun=Math.max(n.fun,gap>240?40:n.fun);
  B.stress=clamp(B.stress+(30-B.stress)*Math.min(1,hrs/36),0,100);
  const stillOk=canPass(B.loc,{free:true}).ok||B.loc==='cell';if(!stillOk||curBlock().rule==='cell'){B.loc='cell';B.x=110}
  /* appointments that passed are simply dropped: nobody is punished for being away */
  const missed=(B.appt||[]).filter(a=>a.to<=B.wm);B.appt=(B.appt||[]).filter(a=>a.to>B.wm);
  B.catch={at:Date.now(),sum,missed:missed.map(a=>a.why)};
  jr('life','Time passed ('+(days>0?days+' day'+(days>1?'s':''):Math.round(gap/60)+' hours')+'). Echo kept to the routine.');
  persist();saveSoon();
}
function showCatchUp(){
  const c=B.catch;if(!c)return;B.catch=null;
  const s=c.sum;
  showOverlay(`<h1>While you were away</h1><p>${s.days>0?s.days+' day'+(s.days>1?'s':'')+' passed inside.':'A few hours passed inside.'} Echo followed the routine: meals, counts and lights out.${s.shifts?' He worked '+s.shifts+' shifts and earned '+s.pay+' credits.':''}${c.missed.length?' Missed: '+esc(c.missed.join(', '))+'. Nobody is punished for time spent away.':''}</p><p style="font-size:13px;color:#93a5b1">Nothing dramatic was invented. The sentence clock counted every real minute.</p><button class="sbtn pri" data-a="ok" type="button">Continue</button>`,{ok:hideOverlay});
}
function afterBoot(fresh,newStay){
  if(B.catch)showCatchUp();
  const st=LAW.read().state;
  if(st&&st.cur&&st.cur.reason==='recapture'&&!B.flags['recap_'+st.cur.escapes]){B.flags['recap_'+st.cur.escapes]=1;scene(()=>sceneRecaptured())}
  else if(B.intake.step<INTAKE_END){scene(()=>runIntake())}
  else storyBoot();
}
window.addEventListener('error',e=>{try{if(B&&!RO)saveSoon()}catch(_){}});
const _go=()=>boot().catch(e=>{console.error(e);fatalScreen('<h1>Blackgate could not start</h1><p>'+esc(e&&e.message||e)+'</p><button class="sbtn pri" data-a="r" type="button">Try again</button>',{r:()=>location.reload()})});
if(document.readyState==='loading')window.addEventListener('DOMContentLoaded',_go);else _go();
