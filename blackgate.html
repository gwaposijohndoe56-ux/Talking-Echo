<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Blackgate</title>
<style>
:root{--ink:#1b2228;--con:#9aa3a8;--con2:#7d878d;--blue:#4c5c6a;--blue2:#34424e;--grn:#6f8f78;--grn2:#a7bfae;--cream:#d8d6c8;--steel:#5b6770;--ochre:#b8a15a;--bad:#b0574a;--good:#6fa383;
 --bg:#12181d;--pan:#1c252c;--pan2:#26323b;--line:#3a4955;--tx:#e4ebef;--mu:#93a5b1;--fs:16px;color-scheme:dark}
:root[data-hc="1"]{--tx:#fff;--mu:#d0dce4;--line:#7e93a2;--pan:#0c1114;--pan2:#18222a}
:root[data-fs="1"]{--fs:18px}:root[data-fs="2"]{--fs:20px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:500 var(--fs)/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid #9fd4b4;outline-offset:2px}
html:not([data-ol="1"]) *:focus,html:not([data-ol="1"]) *:focus-visible{outline:none!important}html:not([data-ol="1"]) .hot:hover .hl,html:not([data-ol="1"]) .hot:focus .hl{opacity:0}
svg{display:block}
#app{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden}
#hud{flex:none;padding:calc(env(safe-area-inset-top,0px) + 6px) 10px 6px;background:var(--pan);border-bottom:1px solid var(--line);display:grid;gap:5px}
.hr1{display:flex;align-items:center;gap:8px;min-height:34px}
.loc{flex:1;min-width:0}.loc small{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mu)}.loc b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clk{text-align:right;line-height:1.1}.clk b{font-size:18px;font-variant-numeric:tabular-nums}.clk small{display:block;font-size:11px;color:var(--mu)}
.sent{background:var(--pan2);border:1px solid var(--line);border-radius:10px;padding:3px 8px;text-align:center;line-height:1.1;min-width:84px}.sent small{display:block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mu)}.sent b{font-size:13px;font-variant-numeric:tabular-nums}
#saveDot{width:10px;height:10px;border-radius:50%;background:var(--good);flex:none}#saveDot.bad{background:var(--bad)}#saveDot.wait{background:var(--ochre)}
#needs{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.nd{background:var(--pan2);border:1px solid var(--line);border-radius:9px;padding:3px 5px 4px;min-height:34px;text-align:left}
.nd span{display:block;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--mu)}.nd i{display:block;height:5px;border-radius:3px;background:#0e1317;margin-top:3px;overflow:hidden}.nd i s{display:block;height:100%;background:var(--grn);text-decoration:none;transition:width .6s}.nd.low i s{background:var(--bad)}
#stage{flex:1;min-height:0;position:relative;background:#0c1013;display:flex;justify-content:center}
#scene{width:100%;height:100%;display:block}
#actbar{position:absolute;left:8px;right:8px;top:8px;background:rgba(18,24,29,.92);border:1px solid var(--line);border-radius:12px;padding:8px 10px;display:none;gap:8px;align-items:center;z-index:3}
#actbar.on{display:flex}#actbar .t{flex:1;min-width:0;font-size:14px}#actbar .p{height:6px;background:#0e1317;border-radius:3px;margin-top:5px;overflow:hidden}#actbar .p s{display:block;height:100%;background:var(--grn2);text-decoration:none}
.sbtn{min-height:40px;padding:0 14px;border-radius:10px;background:var(--pan2);border:1px solid var(--line);font-weight:700;font-size:14px}
.sbtn.pri{background:#4f7a62;border-color:#6fa383;color:#fff}.sbtn.bad{background:#7a4038;border-color:#b0574a}.sbtn[disabled]{opacity:.45;cursor:not-allowed}
#dock{flex:none;display:grid;grid-template-columns:repeat(6,1fr);background:var(--pan);border-top:1px solid var(--line);padding:4px 4px calc(env(safe-area-inset-bottom,0px) + 4px)}
#dock button{min-height:50px;display:grid;place-items:center;gap:0;font-size:11px;color:var(--mu);border-radius:10px;position:relative}
#dock button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#dock button.on{color:#fff;background:var(--pan2)}#dock .bdg{position:absolute;top:4px;right:calc(50% - 20px);min-width:16px;height:16px;border-radius:8px;background:var(--ochre);color:#111;font-size:10px;font-weight:800;display:none;place-items:center;padding:0 3px}#dock .bdg.on{display:grid}
.hot{cursor:pointer}.hl{opacity:0;fill:#fff;transition:opacity .15s}.hot:hover .hl,.hot:focus .hl{opacity:.16}
#sheet{position:absolute;z-index:20;left:0;right:0;bottom:0;max-height:78%;background:var(--pan);border-top:2px solid var(--line);border-radius:16px 16px 0 0;display:none;flex-direction:column;box-shadow:0 -12px 30px rgba(0,0,0,.45)}
#sheet.open{display:flex}
.sh-h{flex:none;display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}.sh-h h2{flex:1;margin:0;font-size:18px}
.sh-b{overflow:auto;padding:10px 12px 16px;-webkit-overflow-scrolling:touch}
.x{width:44px;height:44px;border-radius:50%;background:var(--pan2);display:grid;place-items:center;font-size:20px;line-height:1}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid #2a3640}.row:last-child{border:0}
.row .s{color:var(--mu);font-size:13px}.chip{display:inline-block;background:var(--pan2);border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-size:12px;color:var(--mu)}
.card{background:var(--pan2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:0 0 8px}.card h3{margin:0 0 3px;font-size:15px}.card p{margin:0;color:var(--mu);font-size:14px}
.tabs{display:flex;gap:6px;margin:0 0 10px;overflow:auto}.tabs button{min-height:40px;padding:0 12px;border-radius:999px;background:var(--pan2);border:1px solid var(--line);font-size:14px;white-space:nowrap}.tabs button.on{background:#4f7a62;border-color:#6fa383}
#dlg{position:absolute;z-index:15;left:8px;right:8px;bottom:8px;display:none;background:rgba(22,30,36,.97);border:1px solid var(--line);border-radius:14px;padding:12px;max-height:62%;overflow:auto}
#dlg.on{display:block}#dlg .who{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--grn2);margin-bottom:4px;font-weight:800}#dlg .tx{font-size:calc(var(--fs) + 1px);min-height:2.6em}#dlg .nx{text-align:right;color:var(--mu);font-size:12px;margin-top:6px}
#dlg .ch{display:grid;gap:6px;margin-top:8px}#dlg .ch button{min-height:44px;text-align:left;padding:8px 12px;border-radius:10px;background:var(--pan2);border:1px solid var(--line)}#dlg .ch button:hover{border-color:var(--grn2)}
#toasts{position:absolute;z-index:30;top:8px;left:8px;right:8px;display:grid;gap:6px;pointer-events:none}#toasts div{background:rgba(28,37,44,.96);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px;justify-self:center;max-width:420px}
.ov{position:fixed;inset:0;z-index:100;background:rgba(10,14,17,.97);display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto;text-align:center}.ov .box{width:min(460px,100%);display:grid;gap:12px}.ov h1{margin:0;font-size:24px}.ov p{margin:0;color:#c3d0d8}
.tint{pointer-events:none}
@media (min-width:760px) and (min-height:520px){#sheet{left:auto;right:12px;bottom:70px;top:96px;width:min(440px,46%);max-height:none;border-radius:14px;border:2px solid var(--line)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
:root[data-rm="1"] *{animation:none!important;transition:none!important}
@keyframes bob{50%{transform:translateY(-2px)}}.npcb{animation:bob 3.2s ease-in-out infinite}
</style></head><body>
<div id="app">
 <header id="hud">
  <div class="hr1"><div class="loc"><small id="locZ">Blackgate</small><b id="locN">...</b></div><div class="sent" id="sent" title="Sentence clock (real time)"><small>Sentence</small><b id="sentT">--</b></div><div class="clk"><b id="clkT">--:--</b><small id="clkD">Day -</small></div><span id="saveDot" title="Save status" aria-label="Save status"></span></div>

 </header>
 <main id="stage">
  <svg id="scene" viewBox="0 0 400 560" preserveAspectRatio="xMidYMid meet" aria-label="Blackgate scene" style="--coat:#6f8f78">
   <defs>        <radialGradient id="vigG" gradientUnits="userSpaceOnUse" cx="200" cy="300" r="520"><stop offset=".55" stop-color="#2a1a40" stop-opacity="0"/><stop offset="1" stop-color="#2a1a40" stop-opacity=".22"/></radialGradient>
        <linearGradient id="floorG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".0"/><stop offset="1" stop-color="#fff" stop-opacity=".16"/></linearGradient>
        <linearGradient id="gWall" x1="0" y1="0" x2="0" y2="1"><stop id="wallA" offset="0" stop-color="#d2e8fa"/><stop id="wallB" offset="1" stop-color="#b4d8f3"/></linearGradient>
        <linearGradient id="gFloor" x1="0" y1="0" x2="0" y2="1"><stop id="floorA" offset="0" stop-color="#e8c999"/><stop id="floorB" offset="1" stop-color="#d9b07c"/></linearGradient>
        <linearGradient id="gSky" x1="0" y1="0" x2="0" y2="1"><stop id="skyA" offset="0" stop-color="#6ec3ff"/><stop id="skyB" offset="1" stop-color="#d8f0ff"/></linearGradient>
        <radialGradient id="gLamp"><stop offset="0" stop-color="#fff2b0" stop-opacity=".85"/><stop offset="1" stop-color="#fff2b0" stop-opacity="0"/></radialGradient>
        <radialGradient id="gMoon"><stop offset="0" stop-color="#cfd9ff" stop-opacity=".55"/><stop offset="1" stop-color="#cfd9ff" stop-opacity="0"/></radialGradient>
        <pattern id="pStar" width="52" height="52" patternUnits="userSpaceOnUse"><path d="M13 9l1.800 3.800 4.200.6-3 3 .7 4.200L13 18.600 9.300 20.600 10 16.400l-3-3 4.200-.6z" fill="#fff" opacity=".4"/><circle cx="40" cy="36" r="2.600" fill="#fff" opacity=".35"/></pattern>
        <pattern id="pStripe" width="9" height="10" patternUnits="userSpaceOnUse"><rect width="9" height="10" style="fill:var(--coat)"/><rect width="3" height="10" fill="#fff"/></pattern>
        <clipPath id="clipRide"><rect x="-1200" y="-900" width="2800" height="1353"/></clipPath>
        <pattern id="pRain" width="14" height="26" patternUnits="userSpaceOnUse" patternTransform="rotate(12)"><path d="M4 2v10M11 14v10" stroke="#fff" stroke-opacity=".75" stroke-width="1.600" stroke-linecap="round"/></pattern>
        <pattern id="pSnow" width="22" height="26" patternUnits="userSpaceOnUse"><circle cx="5" cy="5" r="2" fill="#fff"/><circle cx="16" cy="17" r="1.600" fill="#fff"/></pattern>
        <pattern id="pTile" width="26" height="26" patternUnits="userSpaceOnUse"><rect width="26" height="26" fill="#e9f7fb"/><path d="M0 0H26M0 0V26" stroke="#bfe1ea" stroke-width="2"/></pattern>
        <pattern id="pCheck" width="40" height="40" patternUnits="userSpaceOnUse"><rect width="40" height="40" fill="#fff6e6"/><rect width="20" height="20" fill="#f3d9b6"/><rect x="20" y="20" width="20" height="20" fill="#f3d9b6"/></pattern>
        <pattern id="pGrass" width="30" height="20" patternUnits="userSpaceOnUse"><rect width="30" height="20" fill="#8fd16a"/><path d="M5 18l2-6 2 6M20 10l2-6 2 6" stroke="#79c056" stroke-width="2" fill="none" stroke-linecap="round"/></pattern>
        <clipPath id="biteClip"><rect id="biteRect" x="-26" y="-26" width="52" height="52"/></clipPath>
        <clipPath id="mclip"><path id="mclipP" d=""/></clipPath>
   </defs>
   <g id="cam"><g id="roomA"></g><g id="roomB"></g><g id="disco" opacity="0"></g><g id="bedBack" opacity="0"></g><g id="npcBack"></g>
    <ellipse id="shadow" cx="200" cy="470" rx="64" ry="13" fill="#000" opacity=".22"/>
    <g id="echoWrap"><g id="echoRoot"></g></g><g id="bedFront" opacity="0"></g><g id="npcFront"></g><g id="roomFront"></g><g id="stall" opacity="0"></g></g>
   <rect id="vig" x="-1200" y="-900" width="2800" height="2500" fill="url(#vigG)" pointer-events="none"/>
   <rect id="tint" x="-1200" y="-900" width="2800" height="2500" fill="#0a1230" opacity="0" pointer-events="none"/>
   <g id="hots"></g>
  </svg>
  <div id="actbar" role="status"><div class="t"><span id="actT"></span><div class="p"><s id="actP" style="width:0"></s></div></div><button class="sbtn" id="actX" type="button">Stop</button></div>
  <div id="dlg" role="dialog" aria-live="polite"></div>
  <div id="toasts" aria-live="polite"></div>
  <section id="sheet" role="dialog" aria-modal="false" aria-label="Panel"><div class="sh-h"><h2 id="shT"></h2><button class="x" id="shX" type="button" aria-label="Close">&times;</button></div><div class="sh-b" id="shB"></div></section>
 </main>
 <nav id="dock" aria-label="Main">
  <button data-p="map" type="button"><svg viewBox="0 0 24 24"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14"/></svg>Map</button>
  <button data-p="do" type="button"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>Do</button>
  <button data-p="sched" type="button"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Day</button>
  <button data-p="journal" type="button"><svg viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M9 9h6M9 13h6"/></svg>Journal<i class="bdg" id="bdgJ"></i></button>
  <button data-p="people" type="button"><svg viewBox="0 0 24 24"><circle cx="9" cy="9" r="3.5"/><path d="M3 20c0-4 3-6 6-6s6 2 6 6"/><circle cx="17" cy="8" r="2.5"/></svg>People<i class="bdg" id="bdgP"></i></button>
  <button data-p="menu" type="button"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>Menu<i class="bdg" id="bdgM"></i></button>
 </nav>
</div>
<div id="boot" class="ov"><div class="box"><h1>Blackgate</h1><p id="bootT">Opening the record...</p></div></div>
<script>
/* ============================================================
   LAWCORE: the shared custody ledger. This exact file is inlined
   into BOTH the Echo game and Blackgate, so both sides read and
   write one schema through one code path.

   Honest limits: this is browser storage. It stops accidental
   bypasses (Back, refresh, extra tabs, stale tabs). It does NOT
   stop someone who edits localStorage or the clock on purpose.
   Corruption is detected with a checksum; tampering is not
   prevented.
   ============================================================ */
const LAW=(function(){
  'use strict';
  const K={law:'talking-echo.law.v1',bak:'talking-echo.law.v1.bak',save:'talking-echo.v2',bg:'talking-echo.blackgate.v1',lease:'talking-echo.blackgate.lease',probe:'talking-echo.probe'};
  const HOUR=3600e3,DAY=86400e3;
  /* ---------- configurable sentencing table (days of REAL time at timeScale 1) ---------- */
  const CFG={
    maxDays:14,minHours:6,
    crimes:{
      heiststore:{n:'Corner store robbery',d:1},heistbank:{n:'Bank robbery',d:3},heistburger:{n:'Burger Barn robbery',d:1},
      heistpizza:{n:'Pizza Palace robbery',d:1},heistnoodle:{n:'Noodle Nook robbery',d:1},heistscoop:{n:'Scoop Shack robbery',d:1},heistpawn:{n:'Pawn shop robbery',d:2},
      escape:{n:'Escape from custody',d:2},default:{n:'Theft',d:1}
    },
    lootDaysPer:10,lootDaysCap:1,            /* +0.25 day per 10 loot, max +1 */
    priorStep:.25,priorCap:1,                /* each earlier conviction +25%, max +100% */
    heatAt:70,heatDays:1,                    /* wanted level at/above this adds a day */
    paroleMult:1.5,                          /* offending while on parole */
    goodTimeMax:.10,                         /* conduct credit, max 10% of sentence */
    heatPer:{heiststore:18,heistbank:34,heistpawn:26,default:16},heatDecayPerDay:10,
    fugitiveGraceH:6,                        /* hours until police find a fugitive (scaled) */
    escapeAddDays:2
  };
  const num=(v,d,lo,hi)=>{v=+v;return isFinite(v)?Math.min(hi,Math.max(lo,v)):d};
  const str=(v,n,d='')=>typeof v==='string'?v.slice(0,n):d;
  const obj=o=>o&&typeof o==='object'&&!Array.isArray(o)?o:{};
  const STATUS=['free','transport','custody','released','fugitive'];

  /* ---------- storage layer: never throws, reports why ---------- */
  let _mem=null;
  function ls(){try{return window.localStorage}catch(e){return null}}
  function storageOk(){const s=ls();if(!s)return false;try{s.setItem(K.probe,'1');const ok=s.getItem(K.probe)==='1';s.removeItem(K.probe);return ok}catch(e){return false}}
  function hash(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0}return h.toString(36)}

  /* ---------- schema ---------- */
  function blank(){return {v:1,rev:0,sum:'',status:'free',heat:0,heatAt:0,cfg:{scale:1},cur:null,history:[],parole:{until:0},notoriety:0,fug:null,welcome:null,seq:0,created:Date.now(),modified:0}}
  function normCur(c){
    if(!c||typeof c!=='object')return null;
    const o={id:str(c.id,40),caseNo:str(c.caseNo,20),key:str(c.key,24),offense:str(c.offense,60),loot:num(c.loot,0,0,1e6),
      arrestedAt:num(c.arrestedAt,0,0,4e12),sentMs:num(c.sentMs,0,0,365*DAY),scale:num(c.scale,1,1,100000),
      served:num(c.served,0,0,4e12),added:num(c.added,0,0,400*DAY),credit:num(c.credit,0,0,400*DAY),lastSeen:num(c.lastSeen,0,0,4e12),
      stage:str(c.stage,16,'transport'),reason:str(c.reason,12,'arrest'),prior:num(c.prior,0,0,99),escapes:num(c.escapes,0,0,99),violations:num(c.violations,0,0,999),
      clockBack:num(c.clockBack,0,0,9999),dev:!!c.dev,breakdown:Array.isArray(c.breakdown)?c.breakdown.slice(0,10).map(x=>str(String(x),80)):[],
      intakeDone:!!c.intakeDone,releaseOk:!!c.releaseOk,
      log:Array.isArray(c.log)?c.log.slice(-40).map(e=>({t:num(e&&e.t,0,0,4e12),k:str(e&&e.k,14),x:str(e&&e.x,120)})):[]};
    if(!o.id)return null;return o;
  }
  function normalize(j){
    const b=blank();if(!j||typeof j!=='object'||j.v!==1)return null;
    b.rev=num(j.rev,0,0,1e9);b.status=STATUS.includes(j.status)?j.status:'free';b.heat=num(j.heat,0,0,100);b.heatAt=num(j.heatAt,0,0,4e12);
    b.cfg={scale:num(obj(j.cfg).scale,1,1,100000)};b.cur=normCur(j.cur);
    b.history=Array.isArray(j.history)?j.history.slice(-30).map(h=>({id:str(h&&h.id,40),caseNo:str(h&&h.caseNo,20),offense:str(h&&h.offense,60),arrestedAt:num(h&&h.arrestedAt,0,0,4e12),endedAt:num(h&&h.endedAt,0,0,4e12),
      outcome:str(h&&h.outcome,12),sentMs:num(h&&h.sentMs,0,0,4e12),served:num(h&&h.served,0,0,4e12),violations:num(h&&h.violations,0,0,999)})).filter(h=>h.id):[];
    b.parole={until:num(obj(j.parole).until,0,0,4e12)};b.notoriety=num(j.notoriety,0,0,100);
    b.fug=j.fug&&typeof j.fug==='object'?{since:num(j.fug.since,0,0,4e12),deadline:num(j.fug.deadline,0,0,4e12)}:null;
    b.welcome=j.welcome&&typeof j.welcome==='object'?{at:num(j.welcome.at,0,0,4e12),offense:str(j.welcome.offense,60),served:num(j.welcome.served,0,0,4e12),how:str(j.welcome.how,12)}:null;
    b.seq=num(j.seq,0,0,1e6);b.created=num(j.created,0,0,4e12);b.modified=num(j.modified,0,0,4e12);
    /* a status that needs a record but has none is repaired to the nearest honest state */
    if((b.status==='transport'||b.status==='custody')&&!b.cur)b.status='free';
    if(b.status==='fugitive'&&!b.cur)b.status='free';
    return b;
  }
  /* ---------- read ---------- */
  function read(){
    const s=ls();if(!s||!storageOk())return {state:null,why:'blocked'};
    let raw=null;try{raw=s.getItem(K.law)}catch(e){return {state:null,why:'blocked'}}
    if(raw==null)return {state:blank(),why:'missing',fresh:true};
    try{
      const j=JSON.parse(raw);const sum=j.sum;j.sum='';const ok=hash(JSON.stringify(j))===sum;j.sum=sum;
      const st=normalize(j);if(!st)throw new Error('schema');
      if(!ok)return {state:null,why:'corrupt',raw,detail:'checksum'};
      return {state:st,why:'ok',raw};
    }catch(e){return {state:null,why:'corrupt',raw,detail:String(e&&e.message||e)}}
  }
  function readBackup(){try{const raw=ls().getItem(K.bak);if(!raw)return null;const j=JSON.parse(raw);const sum=j.sum;j.sum='';if(hash(JSON.stringify(j))!==sum)return null;j.sum=sum;return normalize(j)}catch(e){return null}}
  function write(st){
    const s=ls();if(!s)return false;
    st.modified=Date.now();st.sum='';const body=JSON.stringify(st);st.sum=hash(body);
    const out=JSON.stringify(st);

/* ===== core.js ===== */
/* ============================================================
   BLACKGATE core: state, storage, lease, two clocks, UI helpers.
   Truth sources:
     - LAW (shared ledger)   : sentence, custody status, release rules
     - B   (this page's save): prison world, people, story, journal
     - S   (Echo's save)     : needs, wardrobe, hurt, coins (shared with the game)
   ============================================================ */
const BGK={main:LAW.K.bg,bak:LAW.K.bg+'.bak',rev:LAW.K.bg+'.rev',prev:LAW.K.bg+'.prev',lease:LAW.K.lease};
const MYID=LAW.uid();
const T0MIN=14*60+20;               /* arrival at 14:20 on day 1 */
const DOWN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DOWF=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
let B=null,LC=null,RO=false,ROWHY='',DEVMODE=/[?&]dev=1\b/.test(location.search);
const tm=(h,m=0)=>h*60+m;

/* ---------- deterministic randomness ---------- */
function h32(s){let h=1779033703^s.length;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19}h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return(h^h>>>16)>>>0}
function rng(seed){let a=h32(String(seed));return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rr=(...p)=>rng((B?B.caseId:'x')+'|'+p.join('|'));
const pickS=(arr,...seed)=>arr[Math.floor(rr(...seed)()*arr.length)];

/* ---------- fresh state + sanitising migration ---------- */
function freshB(cur,carry){
  return {v:1,rev:0,ts:0,caseId:cur.id,created:Date.now(),wm:T0MIN,svSeen:cur.served,
    cfg:{dayMin:48,fs:0,hc:0,rm:0,audio:0,ol:0},
    loc:'sally',x:200,act:null,stress:22,
    flags:{},know:{},rel:{},nm:{},prom:[],inv:{},acct:12,prop:null,job:null,cls:{lvl:2,next:0,score:0},priv:{},viol:[],hear:null,
    ch:{cur:'c1',done:[]},journal:[],alerts:[],mail:[],visits:{sched:[],hist:[]},stats:{},evh:[],evcd:{},esc:{ph:0,caught:0},end:null,
    intake:{step:0},warn:{d:0,n:0},roll:0,seen:{},look:{},cell:{},night:{},meal:{},wmEnd:0,stays:1,carry:carry||null,devUsed:false};
}
function migrate(b,cur){
  if(!b||typeof b!=='object'||b.v!==1||typeof b.caseId!=='string')return null;
  const f=freshB(cur||{id:b.caseId,served:0});
  for(const k in f){if(b[k]===undefined||typeof b[k]!==typeof f[k]&&f[k]!==null)b[k]=f[k]}
  for(const k in f.cfg)if(typeof b.cfg[k]!=='number')b.cfg[k]=f.cfg[k];
  b.cfg.dayMin=[24,48,96].includes(b.cfg.dayMin)?b.cfg.dayMin:48;
  ['alerts','journal','prom','viol','mail','evh'].forEach(k=>{if(!Array.isArray(b[k]))b[k]=[]});
  b.journal=b.journal.slice(-260);b.alerts=b.alerts.slice(-40);b.evh=b.evh.slice(-120);b.viol=b.viol.slice(-40);b.mail=b.mail.slice(-60);b.prom=b.prom.slice(-60);
  b.wm=isFinite(b.wm)?Math.max(0,b.wm):T0MIN;b.stress=Math.min(100,Math.max(0,+b.stress||0));b.acct=Math.max(0,+b.acct||0);
  if(!b.visits||typeof b.visits!=='object'||!Array.isArray(b.visits.sched)){b.visits={sched:[],hist:[]}}
  return b;
}

/* ---------- storage: lease, stale-write guard, backup, never a silent reset ---------- */
let saveT=0,saveDirty=false,saveState='ok';
function setSave(s){saveState=s;const d=$('#saveDot');if(d){d.className=s==='ok'?'':s==='bad'?'bad':'wait';d.title='Save: '+(s==='ok'?'saved':s==='bad'?'NOT saved (storage problem)':'saving')}}

function saveNow(){
  if(RO||!B)return false;clearTimeout(saveT);saveT=0;saveDirty=false;
  try{
    const ls=localStorage,rv=ls.getItem(BGK.rev);
    if(rv){const o=JSON.parse(rv);if(o.rev>B.rev&&o.owner!==MYID){goRO('stale');return false}}
    B.rev++;B.ts=Date.now();const out=JSON.stringify(B),prev=ls.getItem(BGK.main);
    if(prev)ls.setItem(BGK.bak,prev);
    ls.setItem(BGK.main,out);ls.setItem(BGK.rev,JSON.stringify({rev:B.rev,owner:MYID}));
    if(ls.getItem(BGK.main)!==out)throw new Error('readback');
    sSaveNow();setSave('ok');return true;
  }catch(e){B.rev--;saveDirty=true;setSave('bad');return false}
}
/* Echo's own save is rewritten whole; the game page is locked while Echo is in custody so nobody else writes it. */
let sT=0;
function persist(){if(RO)return;if(!sT)sT=setTimeout(sSaveNow,500)}
function sSaveNow(){clearTimeout(sT);sT=0;if(RO)return;try{S.last=Date.now();localStorage.setItem(KEY,JSON.stringify(S))}catch(e){setSave('bad')}}
function goRO(why){RO=true;ROWHY=why;setSave('bad');showOverlay(why==='taken'
  ?`<h1>Another tab took over</h1><p>Blackgate is now open in a different tab or window, which is allowed to save. This one is paused so the two can't overwrite each other.</p><button class="sbtn pri" data-a="re" type="button">Take over here again</button>`
  :`<h1>This view is out of date</h1><p>A newer copy of this prison record was saved somewhere else. Nothing was overwritten. Reload to continue from the newest record.</p><button class="sbtn pri" data-a="rl" type="button">Reload</button>`,
  {re:()=>{location.reload()},rl:()=>location.reload()})}
function leaseRead(){try{return JSON.parse(localStorage.getItem(BGK.lease)||'null')}catch(e){return null}}
function leaseWrite(){try{localStorage.setItem(BGK.lease,JSON.stringify({id:MYID,ts:Date.now()}))}catch(e){}}
function leaseFree(){const l=leaseRead();return !l||l.id===MYID||Date.now()-l.ts>9000}
function leaseBeat(){if(RO)return;const l=leaseRead();if(l&&l.id!==MYID&&Date.now()-l.ts<=9000){goRO('taken');return}leaseWrite()}
window.addEventListener('pagehide',()=>{try{if(!RO&&B){saveNow()}const l=leaseRead();if(l&&l.id===MYID)localStorage.setItem(BGK.lease,JSON.stringify({id:MYID,ts:0}))}catch(e){}});

/* ---------- law ledger link ---------- */
function lawSnap(r){if(r&&r.ok&&r.state&&r.state.cur){LC=r.state.cur;LSTATUS=r.state.status}return r}
let LSTATUS='custody';
function lawBeat(){const r=LAW.commit(()=>{});if(r.ok){lawSnap(r);if(!LAW.locked(r.state))onLawChanged(r.state)}else if(r.why==='corrupt'||r.why==='blocked'){setSave('bad')}return r}

function onLawChanged(st){/* status left custody elsewhere: sentence record changed under us */
  if(RO||HOLDREDIR)return;saveNow();if(st.status==='released'||st.status==='free'||st.status==='fugitive')location.replace(gameUrl())}
function gameUrl(){return location.protocol==='file:'?'index.html':new URL('./',location.href).href}

/* ---------- the two clocks ---------- */
const RATIO=()=>1440/B.cfg.dayMin;
function servedNow(){return LC?LC.served+Math.max(0,Date.now()-LC.lastSeen):0}
function updWorld(){const sv=servedNow(),d=sv-B.svSeen;if(d>0){B.wm+=d/60000*RATIO();B.svSeen=sv}else if(d<0){B.svSeen=sv}}
const DAYN=()=>Math.floor(B.wm/1440)+1;
const TOD=()=>B.wm%1440;
const DOWN_=()=>(2+Math.floor(B.wm/1440))%7;     /* day 1 is a Tuesday */
const WEEKEND=()=>{const d=DOWN_();return d===0||d===6};
const hh=m=>String(Math.floor(m/60)%24).padStart(2,'0')+':'+String(Math.floor(m%60)).padStart(2,'0');
const clockStr=()=>hh(TOD());
const remMs=()=>LC?Math.max(0,LAW.totalMs(LC)-servedNow()):0;
const eligibleNow=()=>!!LC&&remMs()<=0;
const wmFromServed=ms=>ms/60000*RATIO();

/* ---------- needs: Echo's real needs (S.needs); only stress is Blackgate's own ---------- */
function need(k,d){const n=S.needs;n[k]=clamp(n[k]+d,0,100);persist()}

function moodWord(){const n=S.needs,low=[n.hunger,n.fun,n.clean,n.energy,n.potty].filter(v=>v<30).length,s=B.stress;if(s>75||low>=3)return'worn down';if(s>55||low>=2)return'tense';if(s<25&&low===0)return'steady';return'getting by'}

function jr(kind,txt){const l=B.journal;if(l.length&&l[l.length-1].x===txt&&l[l.length-1].d===DAYN())return;l.push({d:DAYN(),t:Math.floor(TOD()),k:kind,x:String(txt).slice(0,400)});if(l.length>260)l.shift();bdg();saveSoon()}

/* ---------- audio: optional, silent by default, never autoplays ---------- */
const Aud={ctx:null,on:false,nodes:[],t:0,

function roomSvg(loc){
  const p=PAL[loc.pal]||PAL.hall,tod=TOD();
  const night=tod>=22*60||tod<5*60;
  let s=`<defs><linearGradient id="wsky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${skyCol(tod)[0]}"/><stop offset="1" stop-color="${skyCol(tod)[1]}"/></linearGradient><pattern id="pFloor" width="48" height="24" patternUnits="userSpaceOnUse"><rect width="48" height="24" fill="${p.f}"/><path d="M0 0H48M0 0V24" stroke="${p.f2}" stroke-width="2"/></pattern></defs>`;
  if(loc.id==='yard'){s+=`<rect width="400" height="360" fill="url(#wsky)"/><rect y="360" width="400" height="200" fill="${p.f}"/>`}
  else s+=`<rect width="400" height="360" fill="${p.w}"/><path d="M0 60H400M0 200H400" stroke="${p.w2}" stroke-width="2" opacity=".6"/><rect y="320" width="400" height="40" fill="${p.w2}"/><rect y="360" width="400" height="200" fill="url(#pFloor)"/><path d="M0 360H400" stroke="${INKC}" stroke-width="4"/>`;
  for(const pr of loc.props){const f=P[pr[0]];if(f)s+=f(...pr.slice(1))}
  return s;
}

function hairSvg(style,col,r,back){
  const s=`fill="${col}" stroke="${INKC}" stroke-width="3" stroke-linejoin="round"`;
  switch(style){

    case'short':return back?'':`<path d="M-${r*1.02} 2Q-${r*1.1} -${r*1.1} 0 -${r*1.12}Q${r*1.1} -${r*1.1} ${r*1.02} 2Q${r*.7} -${r*.52} 0 -${r*.58}Q-${r*.7} -${r*.52} -${r*1.02} 2Z" ${s}/>`;
    case'curly':return back?'':`<path d="M-${r*1.06} 6Q-${r*1.2} -${r*.9} -${r*.5} -${r*1.18}Q0 -${r*1.34} ${r*.5} -${r*1.18}Q${r*1.2} -${r*.9} ${r*1.06} 6Q${r*.7} -${r*.46} 0 -${r*.5}Q-${r*.7} -${r*.46} -${r*1.06} 6Z" ${s}/>`;
    case'long':return back?`<path d="M-${r*1.04} -${r*.3}Q-${r*1.1} ${r*1.1} -${r*.6} ${r*1.2}L${r*.6} ${r*1.2}Q${r*1.1} ${r*1.1} ${r*1.04} -${r*.3}Z" ${s}/>`:`<path d="M-${r*1.04} 2Q-${r*1.1} -${r*1.1} 0 -${r*1.12}Q${r*1.1} -${r*1.1} ${r*1.04} 2Q${r*.5} -${r*.55} 0 -${r*.5}Q-${r*.5} -${r*.55} -${r*1.04} 2Z" ${s}/>`;
    case'bun':return back?`<circle cx="0" cy="-${r*1.22}" r="${r*.34}" ${s}/>`:`<path d="M-${r*1.02} 2Q-${r*1.1} -${r*1.08} 0 -${r*1.1}Q${r*1.1} -${r*1.08} ${r*1.02} 2Q${r*.7} -${r*.52} 0 -${r*.56}Q-${r*.7} -${r*.52} -${r*1.02} 2Z" ${s}/>`;
    case'ponytail':return back?`<path d="M${r*.7} -${r*.7}Q${r*1.5} -${r*.2} ${r*1.1} ${r*.7}Q${r*1.0} ${r*.1} ${r*.6} -${r*.4}Z" ${s}/>`:`<path d="M-${r*1.02} 2Q-${r*1.1} -${r*1.08} 0 -${r*1.1}Q${r*1.1} -${r*1.08} ${r*1.02} 2Q${r*.7} -${r*.52} 0 -${r*.56}Q-${r*.7} -${r*.52} -${r*1.02} 2Z" ${s}/>`;
    case'cap':return back?'':`<path d="M-${r*1.05} -2Q-${r*1.1} -${r*1.15} 0 -${r*1.15}Q${r*1.1} -${r*1.15} ${r*1.05} -2L${r*1.35} 2L${r*1.35} 8L-${r*1.05} 8Z" fill="#4d5a62" stroke="${INKC}" stroke-width="3" stroke-linejoin="round"/>`;
  }
  return '';
}
function faceSvg(r,ex){
  const E1=ex||'n';
  const eyeY=-r*.04;let eyes,brows='',mouth;
  const ey=(dx,k)=>k==='tired'?`<path d="M${dx-7} ${eyeY}q7 6 14 0" stroke="${INKC}" stroke-width="3.2" fill="none" stroke-linecap="round"/>`:`<ellipse cx="${dx}" cy="${eyeY}" rx="4.4" ry="${k==='surprised'?7.5:5.4}" fill="${INKC}"/><circle cx="${dx+1.4}" cy="${eyeY-1.6}" r="1.5" fill="#fff"/>`;
  eyes=ey(-r*.38,E1)+ey(r*.38,E1);
  if(E1==='wary'||E1==='angry')brows=`<path d="M${-r*.58} ${eyeY-11}l${r*.4} 6M${r*.58} ${eyeY-11}l${-r*.4} 6" stroke="${INKC}" stroke-width="3.4" stroke-linecap="round"/>`;
  else if(E1==='sad')brows=`<path d="M${-r*.58} ${eyeY-6}l${r*.4} -6M${r*.58} ${eyeY-6}l${-r*.4} -6" stroke="${INKC}" stroke-width="3" stroke-linecap="round"/>`;
  else brows=`<path d="M${-r*.56} ${eyeY-12}h${r*.36}M${r*.2} ${eyeY-12}h${r*.36}" stroke="${INKC}" stroke-width="3" stroke-linecap="round" opacity=".7"/>`;
  mouth={n:`<path d="M${-r*.22} ${r*.42}h${r*.44}" stroke="${INKC}" stroke-width="3.2" stroke-linecap="round"/>`,smile:`<path d="M${-r*.3} ${r*.34}q${r*.3} ${r*.34} ${r*.6} 0" stroke="${INKC}" stroke-width="3.2" fill="none" stroke-linecap="round"/>`,
    frown:`<path d="M${-r*.26} ${r*.5}q${r*.26} -${r*.26} ${r*.52} 0" stroke="${INKC}" stroke-width="3.2" fill="none" stroke-linecap="round"/>`,tired:`<path d="M${-r*.2} ${r*.46}h${r*.4}" stroke="${INKC}" stroke-width="3" stroke-linecap="round"/>`,
    wary:`<path d="M${-r*.22} ${r*.46}l${r*.44} -3" stroke="${INKC}" stroke-width="3.2" stroke-linecap="round"/>`,surprised:`<ellipse cx="0" cy="${r*.5}" rx="5" ry="6.5" fill="${INKC}"/>`,angry:`<path d="M${-r*.28} ${r*.5}q${r*.28} -${r*.2} ${r*.56} 0" stroke="${INKC}" stroke-width="3.4" fill="none" stroke-linecap="round"/>`,sad:`<path d="M${-r*.26} ${r*.5}q${r*.26} -${r*.22} ${r*.52} 0" stroke="${INKC}" stroke-width="3" fill="none" stroke-linecap="round"/>`}[E1]||'';
  return eyes+brows+mouth;
}
function npcSvg(d,o={}){
  const lk=d.look||{},u=UNI[d.uni]||UNI.inm,sk=SK[lk.sk||'a'],hc=HC[lk.hc||'blk'],bw=[50,58,70][lk.build||0],h=(lk.h||1)*(o.scale||1),r=34;
  let s=`<g transform="scale(${f2(h)})${o.flip?' scale(-1 1)':''}">`;
  s+=`<ellipse cx="0" cy="4" rx="${bw*.62}" ry="8" fill="#000" opacity=".2"/>`;
  s+=`<g class="npcb">`;
  /* legs */
  s+=`<rect x="${-bw*.4}" y="-60" width="${bw*.34}" height="58" rx="6" fill="${u.pants}" stroke="${INKC}" stroke-width="3.2"/><rect x="${bw*.06}" y="-60" width="${bw*.34}" height="58" rx="6" fill="${u.pants}" stroke="${INKC}" stroke-width="3.2"/>`;
  s+=`<rect x="${-bw*.46}" y="-9" width="${bw*.42}" height="11" rx="5" fill="${u.shoe}" stroke="${INKC}" stroke-width="3"/><rect x="${bw*.04}" y="-9" width="${bw*.42}" height="11" rx="5" fill="${u.shoe}" stroke="${INKC}" stroke-width="3"/>`;
  /* arms behind torso */
  s+=`<rect x="${-bw/2-12}" y="-128" width="15" height="62" rx="7" fill="${u.top}" stroke="${INKC}" stroke-width="3.2"/><rect x="${bw/2-3}" y="-128" width="15" height="62" rx="7" fill="${u.top}" stroke="${INKC}" stroke-width="3.2"/>`;
  s+=`<circle cx="${-bw/2-4}" cy="-62" r="7" fill="${sk}" stroke="${INKC}" stroke-width="2.8"/><circle cx="${bw/2+4}" cy="-62" r="7" fill="${sk}" stroke="${INKC}" stroke-width="2.8"/>`;
  /* torso */
  s+=`<path d="M${-bw/2} -128Q${-bw/2-2} -90 ${-bw/2+2} -58H${bw/2-2}Q${bw/2+2} -90 ${bw/2} -128Q0 -140 ${-bw/2} -128Z" fill="${u.top}" stroke="${INKC}" stroke-width="3.4"/>`;
  if(u.cardi)s+=`<path d="M0 -134V-58" stroke="${u.acc}" stroke-width="4"/>`;
  if(u.apron)s+=`<path d="M${-bw*.36} -120h${bw*.72}v62h${-bw*.72}z" fill="#f4f2ea" stroke="${INKC}" stroke-width="3"/>`;
  if(u.stripes)s+=`<path d="M${-bw/2+4} -118h${bw-8}M${-bw/2+4} -110h${bw-8}" stroke="#d8d6c8" stroke-width="3"/>`;
  if(u.tie)s+=`<path d="M0 -132l-6 10l6 38l6 -38z" fill="#7a3b3b" stroke="${INKC}" stroke-width="2.5"/>`;
  if(u.jacket)s+=`<path d="M${-bw/2} -128L-8 -132L0 -92L8 -132L${bw/2} -128" fill="none" stroke="${INKC}" stroke-width="3"/>`;
  if(u.collar)s+=`<rect x="-8" y="-136" width="16" height="8" fill="#f4f2ea" stroke="${INKC}" stroke-width="2.5"/>`;
  if(u.belt)s+=`<rect x="${-bw/2}" y="-72" width="${bw}" height="9" fill="#14181d" stroke="${INKC}" stroke-width="2.5"/>`;
  if(u.badge)s+=`<path d="M${bw*.14} -112l5 -5l5 5l-5 8z" fill="#d6b95a" stroke="${INKC}" stroke-width="2"/>`;
  if(d.uni==='inm')s+=`<rect x="${-bw*.2}" y="-104" width="${bw*.4}" height="12" rx="2" fill="#d8d6c8" stroke="${INKC}" stroke-width="2"/>`;
  if(d.uni==='med')s+=`<path d="M-9 -134L0 -118L9 -134" fill="#e8ebea" stroke="${INKC}" stroke-width="2.5"/>`;
  /* neck + head */
  s+=`<rect x="-9" y="-142" width="18" height="14" fill="${sk}" stroke="${INKC}" stroke-width="3"/>`;
  s+=`<g transform="translate(0 -170)">${hairSvg(lk.hs,hc,r,true)}<ellipse cx="0" cy="0" rx="${r}" ry="${r*.96}" fill="${sk}" stroke="${INKC}" stroke-width="3.5"/>`;
  s+=`<ellipse cx="${-r*.62}" cy="${r*.22}" rx="5" ry="4" fill="#e08a7a" opacity=".35"/><ellipse cx="${r*.62}" cy="${r*.22}" rx="5" ry="4" fill="#e08a7a" opacity=".35"/>`;
  s+=faceSvg(r,o.face||d.face||'n');
  if(lk.scar)s+=`<path d="M${r*.3} -${r*.45}l${r*.28} ${r*.5}" stroke="#9b5a4c" stroke-width="3" stroke-linecap="round"/>`;
  if(lk.beard)s+=`<path d="M${-r*.8} ${r*.12}Q${-r*.7} ${r*1.0} 0 ${r*1.02}Q${r*.7} ${r*1.0} ${r*.8} ${r*.12}Q${r*.4} ${r*.58} 0 ${r*.52}Q${-r*.4} ${r*.58} ${-r*.8} ${r*.12}Z" fill="${hc}" stroke="${INKC}" stroke-width="2.6" opacity=".92"/>`;
  if(lk.mus)s+=`<path d="M${-r*.38} ${r*.36}Q0 ${r*.22} ${r*.38} ${r*.36}" stroke="${hc}" stroke-width="5" fill="none" stroke-linecap="round"/>`;
  s+=hairSvg(lk.hs,hc,r,false);
  if(lk.gl)s+=`<g fill="none" stroke="${INKC}" stroke-width="3"><circle cx="${-r*.4}" cy="${-r*.04}" r="${r*.3}"/><circle cx="${r*.4}" cy="${-r*.04}" r="${r*.3}"/><path d="M${-r*.1} ${-r*.04}h${r*.2}"/></g>`;
  if(u.badge&&d.role!=='staff'&&(d.role==='officer'||d.role==='captain'))s+=`<path d="M${-r*1.05} -${r*.26}Q0 -${r*1.4} ${r*1.05} -${r*.26}L${r*1.2} 0H${-r*1.2}Z" fill="${u.acc}" stroke="${INKC}" stroke-width="3" opacity=".0"/>`;
  s+=`</g></g></g>`;
  return s;
}

async function travel(to,opts={}){
  if(TRAVELING||to===B.loc)return false;
  if(B.act){toast('Finish or stop what you are doing first.');return false}
  const rt=route(B.loc,to,opts);
  if(!rt){const r=canPass(to);toast(r.ok?'No way through right now.':r.why);return false}
  TRAVELING=true;
  try{
    for(let i=1;i<rt.path.length;i++){
      const nx=rt.path[i],last=i===rt.path.length-1;
      const c=canPass(nx,{transit:!last});if(!c.ok&&!opts.ignore){toast(c.why);break}
      const dir=nx==='hall'||LOCS[nx].map&&LOCS[B.loc].map&&LOCS[nx].map[0]>=LOCS[B.loc].map[0]?1:-1;
      await new Promise(res=>echoWalk(dir>0?392:8,E.fy,res));
      const hop=(ADJ[B.loc].find(e=>e.to===nx)||{min:1}).min;
      $('#roomA').style.opacity=0;$('#roomFront').style.opacity=0;
      await wait(Math.min(1500,200+hop*250));

      updWorld();onEnter(nx);
      echoWalk(clamp(B.x+(dir>0?60:-60),60,340),468);
    }
  }finally{TRAVELING=false}
  saveSoon();refresh();return true;
}

/* ---------- speech helpers ---------- */
const N=(id,t)=>{echoTalkOff();return dline(nName(id)==='?'?'':(NPC[id]?NPC[id].nick||NPC[id].n:id),t)};
const EC=async t=>{window.TALK_ECHO=true;await dline('Echo',t);window.TALK_ECHO=false};
function echoTalkOff(){window.TALK_ECHO=false}
const NAR=t=>{echoTalkOff();return dline('',t)};

/* script runner: "E:" Echo, "*" narration, otherwise the given NPC. Lines can be [npc,text] pairs. */
async function say_(npc,lines){
  for(const l of lines){
    if(typeof l!=='string'){await N(l[0],l[1]);continue}
    if(l.startsWith('E:'))await EC(l.slice(2).trim());else if(l.startsWith('*'))await NAR(l.slice(1).trim());else await N(npc,l);
  }
}
/* ---------- relationships ---------- */
function rel(id){return B.rel[id]||(B.rel[id]={fam:0,trust:0,resp:.2,susp:0})}
function relBump(id,d){const r=rel(id);for(const k in d){r[k]=clamp((r[k]||0)+d[k],0,1)}saveSoon()}
function nmem(id){return B.nm[id]||(B.nm[id]={met:false,told:{},lied:{},seen:0,lastTalk:0,said:{}})}
function meet(id){const m=nmem(id);if(!m.met){m.met=true;m.bio=true;relBump(id,{fam:.06});if(!m.firstDay)m.firstDay=DAYN();return true}return false}
const R_=(id,k)=>(B.rel[id]||{})[k]||0;
const hasTrust=(id,v)=>R_(id,'trust')>=v;
/* ---------- promises ---------- */
function promise(to,what,due){const id='p'+(B.prom.length+1)+'_'+to;B.prom.push({id,to,what,state:'open',d:DAYN(),due:due||0});saveSoon();return id}
function keepPromise(id){const p=B.prom.find(x=>x.id===id||x.what===id);if(!p||p.state!=='open')return false;p.state='kept';relBump(p.to,{trust:.12,resp:.08});jr('promise','Kept a promise to '+nName(p.to)+': '+p.what);return true}
function breakPromise(id){const p=B.prom.find(x=>x.id===id||x.what===id);if(!p||p.state!=='open')return false;p.state='broken';relBump(p.to,{trust:-.25,resp:-.1,susp:.1});jr('promise','Broke a promise to '+nName(p.to)+': '+p.what);return true}
function overduePromises(){const d=DAYN();B.prom.forEach(p=>{if(p.state==='open'&&p.due&&d>p.due){breakPromise(p.id);note('You let a promise to '+nName(p.to)+' lapse.','social')}})}

const TOPICS={};
function TOP(npc,arr){TOPICS[npc]=(TOPICS[npc]||[]).concat(arr)}
const GREET={},CHAT={};
const GENERIC_GREET={inmate:{lo:['You new?','Mm.','Hey.'],mid:['Morning, Echo.','Hey, Echo.','What is up?'],hi:['There he is.','Good to see you, Echo.','Hey, my friend.']},
  officer:{lo:['Inmate.','Stay on the lines.','What do you need?'],mid:['Echo.','Keep it moving, Echo.','All right, Echo?'],hi:['Echo. Staying out of trouble?','Hey, Echo.','Good, you are on time.']},
  other:{lo:['Yes?','Can I help you?','Name?'],mid:['Hello, Echo.','Good to see you.','Hello again.'],hi:['Ah, Echo. Come in.','Hello, Echo. How are you holding up?','Good to see you.']}};
function greetLine(id){
  const n=NPC[id],r=rel(id),tier=r.trust>.45||r.fam>.6?'hi':r.fam>.15?'mid':'lo';
  const g=GREET[id]&&GREET[id][tier]||GENERIC_GREET[n.role==='inmate'?'inmate':(n.role==='officer'||n.role==='captain')?'officer':'other'][tier];
  if(r.susp>.6)return n.role==='inmate'?'What do you want.':'I am watching you, Echo.';
  const m=nmem(id);return g[(Math.floor(rng(id+DAYN()+m.seen)()*g.length))];
}
async function talkMenu(id){
  if(DLGON||SCENEBUSY||TRAVELING)return;
  const w=where(id);if(!w||w[0]!==B.loc){toast('They are not here.');return}
  const sleeping=w[1]==='asleep';
  await scene(async()=>{
    const m=nmem(id),first=meet(id);m.seen++;
    if(sleeping){await NAR(nName(id)+' is asleep. Echo lets them be.');return}
    if(first){await introScene(id)}else await N(id,greetLine(id));
    for(;;){
      const tops=(TOPICS[id]||[]).filter(t=>!(t.once&&m.said[t.id])&&(!t.req||t.req())&&(!t.cd||!m.said[t.id]||DAYN()-m.said[t.id]>=t.cd));
      const kf=Object.keys(B.know).filter(k=>ASKS[id]&&ASKS[id][k]&&!(m.told['ask_'+k]));
      const ch=[{t:'Chat'}];
      tops.forEach(t=>ch.push({t:t.t,tp:t}));
      if(kf.length)ch.push({t:'Ask about something I heard...',kf:1});
      const sp=npcSpecial(id);sp.forEach(s=>ch.push({t:s.t,sp:s,if:!s.if||s.if(),off:s.why&&s.why()}));
      ch.push({t:'Leave'});
      const i=await ASKQ(id,'',ch.map(c=>({t:c.t,off:c.off})));
      const c=ch[i];
      if(c.t==='Leave'){await N(id,farewell(id));break}
      if(c.t==='Chat'){await chatLine(id);continue}
      if(c.tp){m.said[c.tp.id]=DAYN();await runTopic(id,c.tp);continue}
      if(c.kf){const j=await ASKQ(id,'Ask about...',[...kf.map(k=>({t:FACTS[k].t})),{t:'Never mind'}]);if(j<kf.length){await askFact(id,kf[j])}continue}
      if(c.sp){await c.sp.run();if(c.sp.end)break}
    }
  });
}
function farewell(id){const n=NPC[id];return n.role==='inmate'?['Later.','Take care of yourself.','See you around.'][Math.floor(rng(id+DAYN()+'f')()*3)]:['That will be all.','Carry on.','Take care, Echo.'][Math.floor(rng(id+DAYN()+'f')()*3)]}
async function introScene(id){
  const n=NPC[id];

  const m=INTRO[id];if(m)await say_(id,m);else await N(id,n.role==='inmate'?'I am '+(n.nick||n.n)+'. You are new. Keep your head down and your tray level.':'I am '+n.n+'. Welcome to Blackgate.');
  relBump(id,{fam:.05});bump('met');
}
const INTRO={};
async function chatLine(id){
  const m=nmem(id),pool=(CHAT[id]||[]).filter((_,k)=>true),r=rng(id+DAYN()+m.seen+'c');
  if(!pool.length){await N(id,NPC[id].role==='inmate'?'Nothing much to say.':'Not now, Echo.');return}
  const k=Math.floor(r()*pool.length);let line=pool[(k+(m.lastChat===k?1:0))%pool.length];m.lastChat=k;
  await say_(id,Array.isArray(line)?line:[line]);relBump(id,{fam:.012,trust:.004});
  stress(-.4);
}
async function runTopic(id,t){
  await say_(id,t.lines||[]);
  if(t.ask){const i=await ASKQ(id,t.ask.q||'',t.ask.c.map(c=>({t:c.t,if:c.if?c.if():true})));const c=t.ask.c.filter(c=>c.if?c.if():true)[i];if(c){if(c.lines)await say_(id,c.lines);if(c.fx)await c.fx();if(c.rel)relBump(id,c.rel)}}
  if(t.learn)(Array.isArray(t.learn)?t.learn:[t.learn]).forEach(k=>learn(k,id));
  if(t.rel)relBump(id,t.rel);
  if(t.fx)await t.fx();
  if(t.jr)jr('talk',t.jr);
  saveSoon();
}
/* asking about a known fact: only answered when the person knows it AND trusts you enough */
const ASKS={};
function AS(npc,fact,o){(ASKS[npc]=ASKS[npc]||{})[fact]=o}
async function askFact(id,fact){
  const a=ASKS[id][fact],m=nmem(id);
  await EC(a.q||'Do you know anything about this?');
  if(a.min&&R_(id,'trust')<a.min||a.fam&&R_(id,'fam')<a.fam){m.told['ask_'+fact]=0;await N(id,a.no||'I do not know you well enough to talk about that.');relBump(id,{susp:.02});return}
  m.told['ask_'+fact]=1;
  await say_(id,a.lines);if(a.learn)(Array.isArray(a.learn)?a.learn:[a.learn]).forEach(k=>learn(k,id));if(a.fx)await a.fx();if(a.rel)relBump(id,a.rel);
  saveSoon();
}

  const stance=await ASKQ('calder','How do you respond to the charge?',['Responsible. It happened as written.','Partly right, but there is context.','Not guilty. That is not what happened.']);
  let score=stance===0?2:stance===1?1:0,honest=true;

    for(const f of evid){const k=await ASKQ('calder','You mentioned: '+FACTS[f].t+'. Do you wish to present it?',['Yes. '+FACTS[f].x,'No.']);if(k===0){score+=FACTS[f].sure>=2?2:1}}

  v.st=guilty?'guilty':'dismissed';v.heard=DAYN();dropAppt('hear_'+v.id);
  if(guilty){
    const sev=v.sev==='major'?.06:.025,ms=Math.round((LC?LC.sentMs:3*LAW.DAY)*sev*(stance===0?.7:1));
    await N('calder','Finding: responsible. Sanction: loss of '+(v.sev==='major'?'yard and commissary for six days':'yard for two days')+(ms>0?', and time added to the sentence: '+LAW.fmt(ms,true)+'.':'.'));

    LAW.addViolation(v.charge,ms);lawSnap(LAW.commit(()=>{}));stress(6);jr('discipline','Hearing: found responsible. '+(ms?'Time added.':''));
    B.cls.score-=1;echoFeel('sad',4)
  }else{
    await N('calder','Finding: not proven. The report is dismissed. Thank you for answering plainly.');jr('discipline','Hearing: dismissed.');echoFeel('relief',4);relBump('calder',{trust:.05,resp:.06})

 {id:'eli',t:'Ask about his family',req:()=>R_('marlow','trust')>.4,lines:['I had a brother, Eli. Younger. Quieter. He was housed in Wing C when the pipe went in ninety-eight.','They moved most of the men that same night. Not all. Not him, not for five days. That is what I was told. That is all I was told.','I put in requests for the file. Twice. They say it is "unavailable". I am too old to be angry. I am not too old to wonder.'],learn:['eli_greene','wingc_flood'],rel:{trust:.08},jr:'Marlow\'s brother Eli was in Wing C when it flooded in 1998. The file is "unavailable".'},
 {id:'parole',t:'Ask about his parole hearing',req:()=>R_('marlow','trust')>.5,lines:['In a month or so. Maybe. I have a folder and a clean record and a suit that no longer fits.','Do not tell me to hope. I am too tired for hope. Tell me to prepare.'],learn:'marlow_hearing',rel:{trust:.05}},
 {id:'advice',t:'Ask for advice about surviving here',lines:['Eat everything. Sleep when you can. Be known for one small useful thing.','And never promise what you cannot deliver. Here, a promise is the only currency that does not run out. People remember who spent it badly.'],rel:{fam:.04,trust:.02}}
]);
AS('marlow','wingc_tag',{q:'I saw a name on a door in Wing C. E. Greene.',min:.3,lines:['... Say that again.','That was his cell. C-12. You are sure?','Thank you. I did not know it would still be there. I did not know I wanted to know.'],learn:'eli_story',rel:{trust:.15},fx:async()=>{F('marlow_told_tag',1);echoFeel('sad',4)}});
AS('marlow','wingc_flood',{q:'What happened in Wing C?',min:.3,lines:['Water, and nobody coming. That is what happened.'],rel:{fam:.03}});
AS('marlow','closure_memo',{q:'I have seen the closure memo. It says "quietly".',min:.4,lines:['... Quietly.','Who signed it?','I thought it might be that. I would like to see that signature with my own eyes, one day.'],rel:{trust:.1}});

  if(B.stats.games>=3&&!F('marlow_chess3')){F('marlow_chess3',1);await N('marlow','You keep coming back. That is the only way anyone gets to know me.')}}}]);

/* ---------- Nico ---------- */
GREET.nico={lo:['Hey. Hey, new guy.','What is up. Nothing is up. It is fine.'],mid:['Echo! Hey. How is it going.','Yo. You eat yet? Do not eat the fish.'],hi:['Dude. Sit. I have a thing to tell you. Nothing. Just sit.','Echo! My man.']};
INTRO.nico=['I am Nico. Nineteen. I am fine. It is fine.'];
CHAT.nico=['They say the first year is the worst. Like it gets better. Like a hill. I do not see a hill.','I am not scared. I am just checking the door a lot.','My mom writes me every Sunday. I tell her it is like summer camp. She knows it is not.','I did a push-up set. Fifty. Fifty-ish. It felt like fifty.','Do you think they can hear us through the vents? Loomis says they can. Loomis says a lot.'];
TOP('nico',[
 {id:'scared',t:'Ask how he is really doing',req:()=>R_('nico','fam')>.2,lines:['I am... okay. I am fine. ...','No. Not fine. I wake up and for a second I forget. And then I do not. Every day.','You do not have to say anything. Thanks for asking.'],rel:{trust:.12,fam:.05},fx:async()=>{echoFeel('sad',3);stress(-2)}},
 {id:'why',t:'Ask what he is in for',req:()=>R_('nico','trust')>.3,lines:['Stupid thing. A car that was not mine. I did not even like it.','Twenty-two months. I have done five. Seventeen to go. I do the math every night. It does not change.'],rel:{trust:.06}}
]);
/* ---------- Cass ---------- */
GREET.cass={lo:['New face. I am Cass. Welcome to the economy.','Hey.'],mid:['Echo. Need anything? I mean that politely.','Good to see you.'],hi:['Echo. Your credit is good here.','Hey. Sit. Let me guess. Soap?']};
INTRO.cass=['Cass. If you need anything, soap, stamps, a plain envelope, you come to me. I do not charge much and I do not forget.'];
CHAT.cass=['A favor is a loan with better manners.','Everyone here owes someone. The trick is knowing who and for what and keeping that in your head, not on paper.','I do not gamble. I do arithmetic.','I have a daughter. Seven. She needs school shoes in the fall. That is all the math I care about.'];
TOP('cass',[
 {id:'trade',t:'Ask what he trades',lines:['Soap, stamps, paper. Instant coffee when the commissary runs out, which is always. Everything small and legal. Mostly.','Do not look at me like that. Mostly legal is a real category.'],learn:'cass_trade',rel:{fam:.04}},
 {id:'daughter',t:'Ask about his daughter',req:()=>R_('cass','trust')>.3,lines:['Piper. She draws horses with five legs. She says the fifth one is for luck.','If I can get out in time for school pictures, I will be a very reasonable man.'],rel:{trust:.06}}
]);
/* ---------- Sef ---------- */
GREET.sef={lo:['Hey! You are the new one. Hungry? Of course you are.','Hello, hello!'],mid:['Echo! I saved you the end of the cornbread.','Hey, my friend. How is the stomach?'],hi:['Echo! Sit. I made something. Do not ask what is in it.','There he is. The man with taste.']};
INTRO.sef=['Sef. Kitchen. If you ever see me with a spoon, run toward me, not away.'];
CHAT.sef=['Commissary ramen, crushed chips, a little hot sauce, cooked in a bag in the shower hot water. It is not food. It is hope in a pouch.','I trained at a hotel kitchen. Four years. I can make a hundred and fifty portions of anything that is not fish.','Sergeant Dolan pretends to hate my experiments. He eats them standing up in the pantry.','You know the best seasoning is time. That is why everything here tastes like waiting.'];
TOP('sef',[{id:'cert',t:'Ask about his certificate',req:()=>R_('sef','fam')>.25,lines:['Food handler certificate. If I pass, I can work any kitchen in the state. Outside. I study at night, with a flashlight.','I will not say it out loud to anyone else, but I want a little place. Twelve seats. A chalkboard menu.'],rel:{trust:.06}}]);
NSP('sef',[{t:'Share Auntie Lola\'s noodle recipe',if:()=>knows('recipe'),why:()=>F('recipe_shared')?'Already shared':null,run:async()=>{
  await EC('My aunt\'s recipe. The one they flagged as a code. It is just noodles.');
  await N('sef','"Broth for three hours." Echo. This is not a code. This is a love letter with a boil time.');
  await N('sef','Can I make it for the block on Friday? Dolan will let me if I ask him right.');
  F('recipe_shared',1);F('lola_noodles_day',DAYN()+((DOWN_()<=5?5-DOWN_():6)||1));relBump('sef',{trust:.2,fam:.1});jr('story','Shared Auntie Lola\'s noodle recipe with Sef. He will cook it for the block.');stress(-6);echoFeel('happy',5)}}]);
/* ---------- Bishop ---------- */
GREET.bishop={lo:['Peace.','Welcome.'],mid:['Echo. Sit if you like.','Good to see you.'],hi:['Echo. Sit. No need to talk.']};
INTRO.bishop=['Ellis Bishop. I come here to be quiet. You are welcome to be quiet with me.'];
CHAT.bishop=['I was a medic once. You learn to notice who is not okay. They usually say they are.','People think quiet is empty. It is full. You just have to stop shouting to hear it.','I do not preach. I sit. If someone wants to talk, I am the chair.'];
TOP('bishop',[{id:'clinic',t:'Ask about the clinic',lines:['Nurse Abara is the only nurse most days. She does the work of three. If you have to go, go early and bring a book.'],learn:'abara_short',rel:{fam:.04}}]);
NSP('bishop',[{t:'Sit quietly with Bishop',run:async()=>{
  await NAR('Bishop says nothing. Neither does Echo. A candle moves in the draught. After a while the weight in his chest feels smaller.');

/* ---------- Loomis ---------- */
GREET.loomis={lo:['Shhh. Come closer.','You. You are new.'],mid:['Echo. Keep your voice down.','Did you hear it last night?'],hi:['Echo. I need to tell you something. Walk with me.']};
INTRO.loomis=['I am Arthur Loomis. Do not sit with your back to a vent.'];
CHAT.loomis=['The soup has a pattern. Tuesday is always the same. Why would they do that?','They moved the camera. It was on the left. Now it is on the right. Someone knows something.','The pipes tap. Two, then three, then two. That is not plumbing.'];
TOP('loomis',[
 {id:'pipes',t:'Ask about the pipes',lines:['Every night after the three o\'clock check. Two taps, a pause, three taps. From behind Wing C.','Nobody believes me. I stopped saying it out loud in front of the staff.'],learn:'wingc_noise',rel:{fam:.05}},
 {id:'boiler',t:'Ask about the boiler',req:()=>R_('loomis','fam')>.25,lines:['It ticks. Around three. I hear it through the wall of the tier. Dutch says it is cooling metal. Metal does not tick for twenty years.'],learn:'boiler_ticks',rel:{fam:.04}}
]);
/* ---------- Ozzy ---------- */
GREET.ozzy={lo:['New guy! You play?','Yo.'],mid:['Echo! Yard today?','There he is. You owe me a game.'],hi:['Echo! My MVP.']};
INTRO.ozzy=['Ozzy! I run the yard games. You play? Everyone says no and then they are scary good.'];
CHAT.ozzy=['Three on three. Winner stays. Loser buys the next game by shutting up for a minute.','Summer tournament is in a few weeks. I am seeding it. The seeds are based on my feelings.','You do not have to be good. You have to be there.'];
SACT({loc:['yard'],t:'Play a pickup game with Ozzy',when:()=>{const w=where('ozzy');if(!w||w[0]!=='yard')return'Ozzy is not here.';return null},fn:async()=>{

/* ---------- Wren ---------- */
GREET.wren={lo:['What.','New guy.'],mid:['Echo. Folding or talking?','Hey.'],hi:['Echo. Sit. Fold. Talk. Pick two.']};
INTRO.wren=['Wren. I fold. I do not gossip. Everyone who says that is lying, but I mean it.'];
CHAT.wren=['Nineteen months. Not counting this one.','I have worked in laundry for three years. You would be amazed what people leave in pockets. Sorry. Amazed by what is not in pockets.','Do not be nice to Dill. He will mistake it for something.'];
TOP('wren',[{id:'grate',t:'Ask what she hears at the back door',req:()=>R_('wren','trust')>.35,lines:['The back door of the laundry opens on the service corridor. Nobody uses it except maintenance and the occasional rat.','There is an old grate in the floor behind the dryers. Smells like river. Someone said it goes somewhere. Someone says a lot of things.'],learn:'laundry_grate',rel:{trust:.05}}]);
/* ---------- Teddy ---------- */
GREET.teddy={lo:['Hey. Teddy.','Mm.'],mid:['Echo. What is up.','Hey, Echo.'],hi:['Echo. Good. Walk with me.']};
INTRO.teddy=['Teddy Park. I keep the pipes from complaining. You are the new one.'];
CHAT.teddy=['The trick to maintenance is that nobody notices you until something breaks. I like that.','I have been a trustee for two years. I have never asked for anything. That is also a skill.','Mr. Rusk says the boiler plant will outlive all of us. He says it like a threat.'];
TOP('teddy',[{id:'keys',t:'Ask about the service keys',req:()=>R_('teddy','trust')>.4,lines:['Every key is signed out in a ledger Mr. Rusk keeps. He has never lost one. He knows who held it, when, and for how long. The man is a machine.'],learn:'key_ledger',rel:{trust:.05}}]);
/* ---------- Dill ---------- */
GREET.dill={lo:['What are you looking at.','Hey, fresh meat.'],mid:['Oh. It is you.','Echo. Keep moving.'],hi:['What do you want, Echo.']};
INTRO.dill=['Ray Dill. Do not sit in my seat. Do not touch my tray. Do not talk to the officers where I can see.'];
CHAT.dill=['Everyone in here is a snitch or a liar. I am neither. I am just right.','Reyes thinks she is tough. She is not tough. She is loud and she has a key.','You think you are special because the officers like you? They like everyone. They like them quiet.'];
AS('dill','dill_rumor',{q:'Someone said you take other people\'s mail.',min:0,lines:['WHO said that? Hollis. It was Hollis. That little...','I do not take mail. I have never taken mail. I do not even get mail.','You tell Hollis I will remember that.'],rel:{susp:.08},fx:async()=>{learn('hollis_informs','dill',true);F('dill_denied',1)}});
TOP('dill',[{id:'afraid',t:'Notice that he goes quiet around the Captain',req:()=>R_('dill','fam')>.3,lines:['I do not go quiet. I go... careful. She wrote me up for something I did not do. Four years ago. It is still in my file.'],learn:'dill_scared',rel:{fam:.04}}]);
/* ---------- Hollis ---------- */
GREET.hollis={lo:['Hey! New face. I like new faces.','Hello there.'],mid:['Echo! You look tired. Anything I can do?','Good to see you.'],hi:['Echo. My friend. What is the word?']};
INTRO.hollis=['Wade Hollis. Everyone knows me. I know everyone. It is a very convenient arrangement.'];
CHAT.hollis=['Anything you need to know, you ask Hollis. Anything you need not to be known, you tell no one.','I am a people person. I wish more people were people.','You know what I like about you? You listen. Most people just wait to talk.'];
TOP('hollis',[{id:'rumor',t:'Ask what people are saying',lines:['Well. Dill took someone\'s mail the other week, I hear. Stamps, mostly. Did you lose some mail?','I would not say he did it. I would just say he is the sort.'],learn:'dill_rumor',rel:{fam:.05}}]);
/* ---------- Quill ---------- */
GREET.quill={lo:['Good day. You look like a person with something to say and no way to say it.','Hello.'],mid:['Echo. Writing today?','Good to see you.'],hi:['Echo. Pull up a stool. I have an hour and an excellent pen.']};
INTRO.quill=['Quentin Hale. They call me Quill. I write letters for people who cannot, or will not, or are afraid they will say it wrong.'];
CHAT.quill=['A good letter is a conversation where one person gets to think first.','I have written four hundred and twelve letters. Eleven were apologies. Nine worked.','The mail room is a river. Things go in. Some come out. Some sit in the eddy. People do not realise how much sits.'];
TOP('quill',[
 {id:'bin',t:'Ask where lost mail goes',req:()=>R_('quill','fam')>.15,lines:['Lost is the wrong word. Held. The bin marked FOR REVIEW in the mail room. Anything strange goes in there. Numbers, drawings, long lists.','Mr. Pell means well. He is also two years behind and too proud to say so.'],learn:['review_bin','pell_backlog'],rel:{fam:.05}}
]);
NSP('quill',[{t:'Ask Quill to help with a letter',run:async()=>{
  await N('quill','A letter is better with a second pair of eyes. Next time you write one, tell me what you are afraid of saying.');

/* ---------- Kimo ---------- */
GREET.kimo={lo:['Sorry. Hello. Sorry.','Hi. I am sorry. Am I in your way?'],mid:['Hi, Echo. Thank you for yesterday.','Hello.'],hi:['Echo. Hi. Can I sit?']};
INTRO.kimo=['I am Kimo. Sorry. Kimo Alana. I am new. I do not know where I am supposed to be.'];
CHAT.kimo=['Everyone is so loud. I do not know how to be this loud.','I keep waiting for someone to tell me this is a mistake.','Thank you. For showing me where to put the tray.'];
NSP('kimo',[{t:'Show Kimo how the day works',if:()=>!F('kimo_shown'),run:async()=>{
  await EC('Four counts, three meals, one phone line. Do not sit in Dill\'s seat. That is most of it.');
  await N('kimo','That is... actually most of it? Thank you. I was trying to figure it out by watching.');
  F('kimo_shown',1);relBump('kimo',{trust:.25,fam:.15});jr('story','Showed Kimo how the day works. He looks at Echo like he is a landmark.');echoFeel('proud',4);stress(-4)}}]);


/* ===== dialog2.js ===== */
/* BLACKGATE dialogue: staff. They are people with jobs, limits and opinions. None of them will help with anything unlawful. */
const SG=(id,intro,g,chat)=>{INTRO[id]=intro;GREET[id]=g;CHAT[id]=chat};
SG('halloran',['Ruth Halloran. I am the Warden. I do not usually walk the floor, but new arrivals are my business.','This place runs on routine and on people choosing to keep it. I would like you to be one of the people who choose.'],{lo:['Echo. Steady on.','Mm.'],mid:['Echo. I hear good and ordinary things. Keep it ordinary.'],hi:['Echo. Walk with me a moment.']},['I have run this facility nine years. The paperwork wins every year.','A building this old has opinions. I try not to argue with it.','I read every closure and review memo that crosses my desk. People assume I do not.']);
TOP('halloran',[{id:'rules',t:'Ask what she expects of the people here',lines:['Be where you are supposed to be. Be honest with the record. Treat the staff as people and expect the same.','If you do that, I will never need to know your name. That is a compliment.'],rel:{fam:.04}}]);
SG('okafor',['Deputy Warden Okafor. I handle the schedule, which means I am the reason lights go out when they do.'],{lo:['Echo. On time, I hope.'],mid:['Morning, Echo.'],hi:['Echo. Good. Anything I should know?']},['Time is the only thing we all have the same amount of. Mm. Not quite, in here.','I keep the timetable on one page. One page means everyone can read it.']);
SG('reyes',['Captain Reyes. Security. I am not here to be liked.','I read the incident reports before they are filed. Do not give me one to read.'],{lo:['Echo. Eyes front.','What is it.'],mid:['Echo. Quiet day?'],hi:['Echo. Mm. Go on.']},['A quiet block is a block where someone has done their job.','Four years on this floor. I remember every name that has caused me trouble.','Respect costs nothing and I am surprised how rarely it is spent.']);
TOP('reyes',[{id:'record',t:'Ask how a good record is kept',lines:['Show up. Do the job. No reports. Nothing complicated, and almost nobody manages it for a month.','Those who do get noticed. By me, by Calder, by the review board.'],learn:'goodtime',rel:{respect:.05}}]);
SG('brandt',['Officer Brandt. Day shift, mostly the block. If you need something, ask. If you need something you should not have, do not.'],{lo:['Morning.'],mid:['Echo. Doing alright?'],hi:['Echo. Good to see you upright.']},['The trick to the early shift is the coffee. And ignoring the first bell.','I do the cell checks in the morning. Keep your space tidy and I do not look twice.']);
SG('pike',['Officer Pike. Afternoons. I run mail call in the dayroom, so be nice to me.'],{lo:['Evening.'],mid:['Echo. Anything for the bag?'],hi:['Echo. Pull up a chair, quick.']},['Mail call is my favourite part of the day. Everyone is a little more human for ten minutes.','I count what I hand out. Always have.','If it is not on the log, I cannot help you.']);
SG('lindqvist',['Lindqvist. I take nights. The block is calm because I make it calm.'],{lo:['Quiet, Echo.'],mid:['You are up late.'],hi:['Echo. Cannot sleep?']},['Nights are mostly listening. You learn what a normal sound is.','I do my walk at the half hour. Same route. Nothing mysterious about it.','Old buildings talk. I stopped being afraid of it years ago.']);
TOP('lindqvist',[{id:'night',t:'Ask what nights are like',req:()=>R_('lindqvist','fam')>.15,lines:['Three checks after midnight, at half past. Between them I do paperwork at the desk by the entrance.','I am telling you so you know nobody is hiding anything. Rules are rules. They are also a clock.'],learn:'night_count',rel:{fam:.04}}]);
SG('garza',['I am Officer Garza. Intake.'],{lo:['Echo. Steady.'],mid:['Echo. How are the first days?'],hi:['Echo. Good to see you out of the orange.']},['Fifteen years in intake. People are scared on day one and polite on day two. Day three is where it goes either way.','If anyone says the first week is the worst, they are lying. It is the third.']);
SG('dolan',['Sergeant Dolan. Kitchen. If it is on your tray, I put it there.'],{lo:['Tray.'],mid:['Echo. Seconds?'],hi:['Echo. Sef has been experimenting again. Try it.']},['Cooking for two hundred is a logistics problem with a smell.','Do not tell Sef I like his cornbread. I will deny it.','Friday is fish. Plan accordingly.']);
SG('abara',['Nurse Abara. The clinic is open mornings and afternoons. If you are sick, say so early, not late.'],{lo:['Clinic or hello?'],mid:['Echo. Sleeping alright?'],hi:['Echo. Sit. Tell me honestly.']},['I am the only nurse most days. It is a lot of ice and tea.','If you feel a chest tightness, a bad headache, or want to be someone else, come in.','Rest is medicine. People hate that answer.']);
TOP('abara',[{id:'rest',t:'Ask for advice on staying well',lines:['Eat all three meals. Walk the yard. Drink water. Sleep on schedule. That is ninety percent of it.'],rel:{trust:.03}}]);
NSP('abara',[{t:'Get checked at the clinic',if:()=>B.loc==='clinic'||B.loc==='infirm',run:async()=>{
  await N('abara','Sit. Breathe in. Out. Pulse is fine. You are tired, not ill.');need('energy',6);stress(-6);relBump('abara',{trust:.04});bump('clinic')}}]);
SG('weiss',['Dr. Weiss. I run counseling. What you say here is confidential except where I have a duty to act.','I will be honest about the limits so you can decide what to share.'],{lo:['Echo. Do you want to sit?'],mid:['Echo. How are you holding up?'],hi:['Echo. I am glad you came.']},['People think counseling is about fixing. Mostly it is about hearing yourself.','Stress is not weakness. It is information.','If you cannot sleep three nights in a row, tell someone.']);
NSP('weiss',[{t:'Talk about how you are doing',if:()=>B.loc==='counsel',run:async()=>{
  const i=await ASKQ('weiss','What is the heaviest thing today?',['The time. All of it.','The noise.','Nothing really. I am okay.']);
  await N('weiss',i===0?'One day, one meal, one count. The sentence is long. The day is short. We work in days.':i===1?'Find a quiet place at a quiet hour. The library, early.':'Good. Then we have a quiet hour. Thank you for coming anyway.');
  stress(-14);relBump('weiss',{trust:.06});echoFeel('relief',4)}}]);
SG('bell',['Chaplain Bell. I serve all faiths and none. The chapel is open if you want to sit.'],{lo:['Peace.'],mid:['Echo. Welcome.'],hi:['Echo. A quiet one today.']},['I do not preach unless asked. Mostly I carry messages and keep the heater running.','People think I came here to save someone. I came to keep someone company.']);
TOP('bell',[{id:'wing',t:'Ask about the closed wing',req:()=>knows('wingc_closed'),lines:['I was here when it closed. I was not told why. I was asked to bless an empty corridor.','If you find something true about it, tell the right person. Not me. Me, I am a bad keeper of secrets.'],learn:'wingc_closed',rel:{trust:.05}}]);
SG('tan',['Ms. Tan. Library. Request slips are at the desk. Quiet please.'],{lo:['Quiet.'],mid:['Echo. A book?'],hi:['Echo. I saved you something.']},['A library is a promise to be still.','Every borrowed book comes back eventually. People, too, if you wait.','I do not judge what people read. I judge what they return late.']);
NSP('tan',[{t:'Borrow a book',if:()=>B.loc==='library',run:async()=>{
  await N('tan','What are you looking for? A story or a fact?');need('fun',10);stress(-4);bump('books');
  await N('tan','This one is dull on page one and wonderful by page forty. Trust me.')}}]);
SG('ortiz',['Mr. Ortiz. Education. If you want your GED, I will see you here. If you want to learn anything, same.'],{lo:['Here for class?'],mid:['Echo. Ready?'],hi:['Echo. You are a natural.']},['Most of my students are afraid of the first page. I give them the second.','Every person here once told a teacher they were not good at something. It was usually a teacher.']);
SG('kessler',['Foreman Kessler. Workshop. Safety glasses on. No exceptions.'],{lo:['Gloves.'],mid:['Echo. Hands steady?'],hi:['Echo. You are getting good at this.']},['A good tool is boring. A bad one is exciting. Pick boring.','Everything in here gets counted back at the end of a shift.']);
SG('pell',['Pell. Mail room. Mail is handled with care and with delay.','I know it is slow. I am one person.'],{lo:['Mail window is over there.'],mid:['Echo. Anything I can help with?'],hi:['Echo. Good to see you again.']},['I am about two weeks behind. I am not proud of it.','The review bin is where the odd ones go. Numbers, drawings, long lists. Nine times out of ten they are harmless.']);
TOP('pell',[{id:'bin',t:'Ask about the review bin',req:()=>R_('pell','fam')>.1,lines:['It is where I put what I cannot read in under a minute. Right now it is full.','I should go through it. I tell myself that every Friday.'],learn:'review_bin',rel:{trust:.04}}]);
SG('voss',['Mrs. Voss. Records. Slips in the box, answers in a few days.'],{lo:['Slip?'],mid:['Echo. Records window is two to three.'],hi:['Echo. Slip in the box.']},['Records is where facts go to wait.','I do not editorialise. I fetch what is on paper.']);
SG('odom',['Odom. Laundry and linens. Sheets on Thursday, towels on Monday. Do not ask me to change it.'],{lo:['Laundry.'],mid:['Echo. Fresh sheets Thursday.'],hi:['Echo. Folded properly this time.']},['Wren folds faster than any machine.','If something goes missing from the dryers it is usually under the dryers.']);
