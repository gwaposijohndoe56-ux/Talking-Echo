<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Talking Echo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: a full-bleed room. Status bar floats on top, the action dock sits at the bottom, sheets slide up between them and the room shrinks to stay visible. Single bright look by choice: the room itself follows the real clock. */
:root{
  --sky:#cfe6f7; --sky2:#a9d2f0; --ink:#17120f; --jacket:#2f6a93; --jacket-dk:#1f4a69;
  --butter:#ffd45e; --blush:#ff93a8; --paper:#f8fcff; --glass:rgba(255,255,255,.86);
  --text:#1e2f44; --muted:#5d7690; --good:#35c28a; --warn:#ffb21f; --bad:#ff5f6d;
  --shadow:0 6px 18px rgba(30,70,120,.18);
  --f-display:'Baloo 2','Trebuchet MS',system-ui,sans-serif; --f-body:'Nunito',system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:#bfe0f6;color:var(--text);font-family:var(--f-body);font-weight:600;overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible{outline:3px solid var(--jacket);outline-offset:2px}
svg{display:block}
#app{position:relative;height:100%;display:flex;flex-direction:column;overflow:hidden}

/* status bar */
#hud{position:absolute;z-index:6;left:0;right:0;top:0;padding:10px 16px 0;display:grid;gap:8px;pointer-events:none}
#hud>*{pointer-events:auto}
.toprow{display:flex;align-items:center;gap:8px}
.badge{display:flex;align-items:center;gap:8px;background:var(--glass);border-radius:999px;padding:3px 14px 3px 3px;box-shadow:var(--shadow);min-width:0}
.ring{position:relative;width:38px;height:38px;flex:none}
.ring svg{position:absolute;inset:0}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:800 15px var(--f-display);color:var(--jacket)}
.badge .nm{font:800 16px/1 var(--f-display)}
.badge small{display:block;font:700 11px/1.1 var(--f-body);color:var(--muted)}
.sp{flex:1}
.pill{background:var(--glass);border-radius:999px;box-shadow:var(--shadow);height:38px;display:flex;align-items:center;gap:6px;padding:0 14px 0 10px;font:800 16px var(--f-display)}
.pill svg{width:20px;height:20px;color:#e9a400}
.pill.bump{animation:bump .35s}
@keyframes bump{40%{transform:scale(1.18)}}
.ibtn{width:38px;height:38px;border-radius:50%;background:var(--glass);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--text)}
.ibtn svg{width:20px;height:20px}
.needs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.meter{background:var(--glass);border-radius:14px;padding:6px 6px;display:flex;align-items:center;gap:4px;box-shadow:var(--shadow);min-width:0;text-align:left}
.meter .mi{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none;background:var(--c)}
.meter .mi svg{width:14px;height:14px}
.meter .bar{flex:1;height:8px;border-radius:99px;background:rgba(30,70,120,.14);overflow:hidden;min-width:0}
.meter .bar i{display:block;height:100%;width:50%;border-radius:inherit;background:var(--c);transition:width .4s,background .3s}
.meter.low .bar i{background:var(--bad)}
.meter.low{animation:wob 1.1s infinite}
@keyframes wob{0%,70%,100%{transform:none}78%{transform:rotate(-3deg)}86%{transform:rotate(3deg)}94%{transform:rotate(-2deg)}}
#app.ingame .needs{visibility:hidden}

/* stage */
#stage{position:relative;flex:1;min-height:0;overflow:hidden;--insetTop:104px;--insetBottom:0px}
#scene{position:absolute;left:0;top:var(--insetTop);width:100%;height:calc(100% - var(--insetTop) - var(--insetBottom));overflow:visible;touch-action:none;transition:height .3s ease}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
#echoRoot{cursor:grab}
.prop{cursor:pointer}
#bubble{position:absolute;z-index:4;left:50%;top:40%;pointer-events:none;max-width:min(270px,72%);background:#fff;border-radius:20px;padding:9px 14px;font:700 16px/1.25 var(--f-display);color:var(--text);box-shadow:var(--shadow);transform:translate(-50%,-100%) scale(.6);transform-origin:50% 100%;opacity:0;transition:opacity .16s,transform .22s cubic-bezier(.3,1.6,.5,1);text-align:center;overflow-wrap:anywhere}
#bubble.show{opacity:1;transform:translate(-50%,-100%) scale(1)}
#bubble::after{content:"";position:absolute;left:50%;bottom:-9px;width:16px;height:16px;background:#fff;transform:translateX(-50%) rotate(45deg);border-radius:3px}
#toast{position:absolute;z-index:8;left:50%;top:var(--insetTop);transform:translate(-50%,-16px);background:var(--text);color:#fff;border-radius:999px;padding:8px 16px;font:700 14px var(--f-display);opacity:0;pointer-events:none;transition:opacity .2s,transform .25s;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,6px)}

/* dock */
#dock{position:relative;z-index:7;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;padding:8px 8px 10px;background:linear-gradient(#ffffffd9,#e6f3ffef);backdrop-filter:blur(10px);border-radius:24px 24px 0 0;box-shadow:0 -6px 24px rgba(30,70,120,.18)}
#app.ingame #dock{display:none}
.dbtn{display:grid;justify-items:center;gap:3px;font:800 11px/1 var(--f-display);color:var(--muted);min-width:0}
.dbtn .ic{width:44px;height:44px;border-radius:16px;display:grid;place-items:center;color:#fff;background:var(--c);box-shadow:0 4px 0 rgba(0,0,0,.14);transition:transform .12s,box-shadow .12s}
.dbtn .ic svg{width:24px;height:24px}
.dbtn:active .ic{transform:translateY(3px) scale(.96);box-shadow:0 1px 0 rgba(0,0,0,.14)}
.dbtn.on .ic{outline:3px solid #fff;box-shadow:0 0 0 3px var(--c)}

/* sheets */
.sheet{position:absolute;z-index:6;left:0;right:0;bottom:0;max-height:54%;overflow:auto;background:var(--glass);backdrop-filter:blur(12px);border-radius:24px 24px 0 0;padding:12px 16px 16px;box-shadow:0 -8px 28px rgba(30,70,120,.2);transform:translateY(105%);transition:transform .3s cubic-bezier(.3,1.2,.5,1),visibility 0s linear .3s;visibility:hidden}
.sheet.open{transform:none;visibility:visible;transition-delay:0s}
.tnum{font-variant-numeric:tabular-nums}
.sh-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.sh-head h2{margin:0;font:800 20px var(--f-display)}
.x{width:34px;height:34px;border-radius:50%;background:#e4f1fb;display:grid;place-items:center}
.x svg{width:18px;height:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:10px}
.card{position:relative;background:#fff;border-radius:16px;padding:8px 4px 7px;display:grid;justify-items:center;align-content:start;gap:1px;box-shadow:0 3px 0 rgba(30,70,120,.12);font:700 12px/1.15 var(--f-display);text-align:center;min-width:0}
.card svg.pv{width:46px;height:46px}
.card .nm{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .tag{font:800 11px var(--f-body);color:var(--muted);display:flex;align-items:center;gap:3px;min-height:15px}
.card .tag svg{width:12px;height:12px;color:#e9a400}
.card.locked{opacity:.62}
.card.on{outline:3px solid var(--jacket)}
.card .fav{position:absolute;top:4px;right:4px;width:18px;height:18px;color:var(--blush)}
.card:active{transform:translateY(2px)}
.tabs{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto;padding-bottom:2px}
.tab{flex:none;padding:7px 14px;border-radius:999px;background:#e4f1fb;font:800 14px var(--f-display);color:var(--muted)}
.tab.on{background:var(--jacket);color:#fff}
.gcards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:12px}
.gcard{text-align:left;padding:12px;border-radius:18px;background:var(--c);color:#fff;display:grid;gap:2px;box-shadow:0 4px 0 rgba(0,0,0,.16);min-width:0}
.gcard b{font:800 17px/1.1 var(--f-display)}
.gcard span{font:700 12px/1.25 var(--f-body);opacity:.95}
.gcard em{font:800 11px var(--f-body);font-style:normal;opacity:.9;margin-top:2px}
.gcard:active{transform:translateY(2px)}
.sub{margin:4px 0 8px;font:800 13px var(--f-display);color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 14px;border-radius:999px;background:#fff;box-shadow:0 3px 0 rgba(30,70,120,.12);font:800 14px var(--f-display)}
.chip.on{background:var(--jacket);color:#fff;box-shadow:0 3px 0 var(--jacket-dk)}
.say{display:flex;gap:8px;margin-bottom:12px}
.say input{flex:1;min-width:0;border:3px solid #cfe4f5;border-radius:16px;padding:10px 14px;font:700 16px var(--f-body);color:var(--text);background:#fff;user-select:text;-webkit-user-select:text}
.btn{background:var(--jacket);color:#fff;border-radius:16px;padding:10px 18px;font:800 16px var(--f-display);box-shadow:0 4px 0 var(--jacket-dk)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--jacket-dk)}
.btn.alt{background:#e4f1fb;color:var(--text);box-shadow:0 4px 0 #c3dbee}
.btn.danger{background:var(--bad);box-shadow:0 4px 0 #c24150}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:2px solid #e4f1fb;font:800 15px var(--f-display)}
.row:last-child{border:0}
.sw{width:50px;height:30px;border-radius:99px;background:#c9dcec;position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .2s}
.sw.on{background:var(--good)}
.sw.on::after{transform:translateX(20px)}
.hint{font:600 13px/1.4 var(--f-body);color:var(--muted);margin:2px 0 0}

/* game overlay */
#gamebar{position:absolute;z-index:6;left:0;right:0;top:58px;padding:0 16px;display:none;align-items:center;gap:8px;pointer-events:none}
#gamebar.on{display:flex}
#gamebar>*{pointer-events:auto}
.gstat{background:var(--glass);border-radius:999px;box-shadow:var(--shadow);padding:6px 14px;font:800 17px var(--f-display);display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.gstat small{font:700 11px var(--f-body);color:var(--muted)}
#gmsg{position:absolute;z-index:5;left:0;right:0;top:34%;text-align:center;font:800 34px/1 var(--f-display);color:#fff;text-shadow:0 3px 0 rgba(30,70,120,.45),0 0 20px rgba(30,70,120,.35);pointer-events:none;opacity:0;transform:scale(.6);transition:opacity .2s,transform .3s cubic-bezier(.3,1.6,.5,1);padding:0 16px}
#gmsg.show{opacity:1;transform:scale(1)}
#pads{position:absolute;z-index:6;left:0;right:0;bottom:0;padding:10px 16px 14px;display:none;gap:10px}
#pads.on{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr)}
.pad{height:78px;border-radius:22px;background:var(--c);color:#fff;font:800 15px var(--f-display);display:grid;place-items:center;align-content:center;gap:2px;box-shadow:0 5px 0 rgba(0,0,0,.2);touch-action:none;transition:filter .08s}
.pad svg{width:30px;height:30px}
.pad.lit{filter:brightness(1.3) saturate(1.1);transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.pad{position:relative}
.pad i{position:absolute;inset:-6px;border-radius:26px;border:5px solid #fff;pointer-events:none;opacity:0}
.pad[disabled]{opacity:.55}

/* modal */
#modal{position:absolute;z-index:9;inset:0;display:none;place-items:center;background:rgba(20,50,90,.4);padding:16px}
#modal.open{display:grid}
.mcard{background:#fff;border-radius:26px;padding:22px 20px 20px;max-width:340px;width:100%;text-align:center;box-shadow:0 20px 50px rgba(20,50,90,.35);animation:pop .4s cubic-bezier(.3,1.6,.5,1);display:grid;gap:10px}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.mcard h3{margin:0;font:800 26px/1.1 var(--f-display)}
.mcard p{margin:0;font:700 15px/1.4 var(--f-body);color:var(--muted)}
.big{font:800 52px/1 var(--f-display);color:var(--jacket);font-variant-numeric:tabular-nums}
.mrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:4px}
.gain{display:flex;gap:14px;justify-content:center;font:800 15px var(--f-display)}
.gain span{display:flex;align-items:center;gap:4px}
.gain svg{width:18px;height:18px;color:#e9a400}

@media (prefers-reduced-motion:reduce){.sheet,#toast,#bubble,#scene{transition:none}.meter.low{animation:none}}
@media (max-height:600px){.dbtn .ic{width:40px;height:40px;border-radius:14px}.dbtn .ic svg{width:22px;height:22px}#stage{--insetTop:96px}}

/* v2 additions */
#cam{will-change:transform}
.ctxrow{position:absolute;z-index:5;left:0;right:0;top:calc(var(--insetTop) + 2px);display:flex;justify-content:center;pointer-events:none}
#ctx{pointer-events:auto;background:var(--glass);border-radius:999px;box-shadow:var(--shadow);padding:6px 16px;font:800 15px var(--f-display);display:flex;align-items:center;gap:6px;max-width:56%}
#ctx svg{width:16px;height:16px;color:var(--muted)}
#ctx span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.navb{position:absolute;z-index:5;top:46%;width:40px;height:56px;border-radius:20px;background:var(--glass);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--text)}
.navb svg{width:22px;height:22px}
#navL{left:6px}#navR{right:6px}
#app.ingame .navb,#app.ingame #ctx,#app.ingame #tools,#app.ingame #wx{display:none}
#wx{position:absolute;z-index:5;left:10px;top:calc(var(--insetTop) + 2px);display:flex;align-items:center;gap:5px;background:var(--glass);border-radius:999px;box-shadow:var(--shadow);padding:5px 11px 5px 7px;font:800 14px var(--f-display)}
#wx svg{width:22px;height:22px}
#tools{position:absolute;z-index:5;right:10px;top:calc(var(--insetTop) + 2px);display:grid;gap:8px}
#tools .ibtn{width:42px;height:42px;position:relative}
#tools .ibtn.on{background:var(--bad);color:#fff}
#tools .ibtn.listen{background:var(--good);color:#fff;animation:lpulse 1s infinite}
@keyframes lpulse{50%{box-shadow:0 0 0 8px rgba(53,194,138,.3)}}
#stage.punch #scene{cursor:crosshair}
.drift{animation:drift 14s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-22px)}to{transform:translateX(22px)}}
.rainfall{animation:rainfall .55s linear infinite}
@keyframes rainfall{to{transform:translate(-6px,26px)}}
.snowfall{animation:snowfall 3.2s linear infinite}
@keyframes snowfall{to{transform:translate(-14px,30px)}}
.swayp{transform-box:fill-box;transform-origin:50% 100%;animation:swayp calc(3.2s / var(--wind,1)) ease-in-out infinite alternate}
@keyframes swayp{from{transform:rotate(-2.5deg)}to{transform:rotate(2.5deg)}}
.rattle .rt{animation:rattle .12s linear 6}
@keyframes rattle{25%{transform:translate(1.5px,-1px) rotate(1deg)}75%{transform:translate(-1.5px,1px) rotate(-1deg)}}
.zone{opacity:0;transition:opacity .2s}
.zhint .zone{opacity:1}
.zone ellipse{animation:zp 1s ease-in-out infinite alternate}
@keyframes zp{from{stroke-opacity:.35}to{stroke-opacity:1}}
#map{position:absolute;z-index:8;inset:0;display:none;background:linear-gradient(#8fd0ff,#b8e79a 30%,#8ed07a);overflow:auto;overscroll-behavior:contain}
#map.open{display:block;animation:mapIn .35s cubic-bezier(.2,.9,.3,1.1)}
@keyframes mapIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.mapwrap{position:relative;margin:0 auto;height:max(min(100%,calc(100vw*1.5)),520px);aspect-ratio:2/3;max-width:100%}
.mapwrap svg.bg{position:absolute;inset:0;width:100%;height:100%}
.pin{position:absolute;transform:translate(-50%,-100%);display:grid;justify-items:center;gap:1px;font:800 12px var(--f-display);color:var(--text);width:96px;text-align:center;animation:pinBob 2.6s ease-in-out var(--d,0s) infinite;-webkit-tap-highlight-color:transparent}
.pin .pb{width:48px;height:48px;border-radius:50%;background:var(--c);display:grid;place-items:center;box-shadow:0 5px 0 rgba(0,0,0,.2),0 10px 14px rgba(0,0,0,.14);border:3px solid #fff;position:relative}
.pin .pb::after{content:"";position:absolute;left:50%;bottom:-9px;width:12px;height:12px;background:var(--c);border-right:3px solid #fff;border-bottom:3px solid #fff;transform:translateX(-50%) rotate(45deg);border-radius:0 0 4px 0;z-index:-1}
.pin .pb b{font:800 24px/1 var(--f-display);color:#fff}
.pin .pn{margin-top:8px;background:rgba(255,255,255,.92);border-radius:99px;padding:1px 9px;box-shadow:0 2px 0 rgba(0,0,0,.1);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.pin:active .pb{transform:scale(.92)}
.pin.lock{filter:grayscale(.8);opacity:.85}
.pin small{border-radius:99px;padding:0 8px;font:800 10.5px var(--f-body);color:#fff;background:rgba(30,47,68,.62)}
.pin.here .pb{outline:4px solid var(--butter);outline-offset:1px}
.pin .bike{position:absolute;left:50%;top:-24px;font-style:normal;font-size:24px;animation:bikeRoll 1.2s ease-in-out infinite;transform:translateX(26px)}
@keyframes pinBob{0%,100%{transform:translate(-50%,-100%)}50%{transform:translate(-50%,calc(-100% - 4px))}}
@keyframes bikeRoll{0%,100%{transform:translateX(26px) rotate(-4deg)}50%{transform:translateX(30px) rotate(3deg)}}
.maptop{position:sticky;top:0;z-index:3;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;pointer-events:none}
.maptop>*{pointer-events:auto}
.maptop h2{margin:0;background:var(--glass);border-radius:999px;padding:6px 16px;font:800 18px var(--f-display);box-shadow:var(--shadow)}
#ride{position:absolute;z-index:6;left:0;right:0;top:calc(var(--insetTop) + 4px);display:none;justify-content:center;gap:8px;align-items:center}
#ride.on{display:flex}
#ride .pill{height:34px}
.plbars{display:grid;gap:6px;margin:6px 0 10px}
.plb{display:flex;align-items:center;gap:8px;font:800 13px var(--f-display)}
.plb .bar{flex:1;height:10px;border-radius:99px;background:rgba(30,70,120,.14);overflow:hidden}
.plb .bar i{display:block;height:100%;background:var(--c);border-radius:inherit;transition:width .3s}
.plb span{width:64px}
.prow{display:flex;gap:8px;flex-wrap:wrap}
.prow .btn{padding:9px 14px;font-size:15px}
.btn[disabled]{opacity:.5;filter:grayscale(.5)}
.pcard{display:flex;gap:12px;align-items:center}
.pcard svg.pv{width:84px;height:92px;flex:none;background:#e9f6ff;border-radius:16px}
.menuhead{font:700 13px/1.35 var(--f-body);color:var(--muted);margin:0 0 8px}

/* ---- responsive pass ---- */
#hud,#dock{max-width:680px;margin-left:auto;margin-right:auto}
#hud{padding-top:calc(10px + env(safe-area-inset-top,0px))}
#dock{padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));width:100%}
.sheet{left:max(0px,calc(50% - 340px));right:max(0px,calc(50% - 340px))}
@media (min-width:700px){#dock{border-radius:24px 24px 0 0;margin-bottom:0}.dbtn{font-size:12px}.dbtn .ic{width:50px;height:50px}.dbtn .ic svg{width:27px;height:27px}.badge .nm{font-size:18px}.meter{padding:8px}.meter .mi{width:26px;height:26px}}
@media (max-width:359px){.needs{gap:4px}.meter{padding:5px 4px}.meter .mi{width:18px;height:18px}.meter .mi svg{width:11px;height:11px}.dbtn .ic{width:38px;height:38px}.dbtn{font-size:10px}.pill{padding:0 10px 0 8px}}
@media (orientation:landscape) and (max-height:520px){
  #app{flex-direction:row}
  #stage{flex:1;--insetTop:64px}
  #dock{width:72px;max-width:none;margin:0;grid-template-columns:1fr;grid-template-rows:repeat(7,1fr);align-content:center;gap:0;padding:4px 4px;border-radius:24px 0 0 24px;box-shadow:-6px 0 24px rgba(30,70,120,.18);overflow:hidden}
  .dbtn{font-size:9px;gap:1px}.dbtn .ic{width:34px;height:34px;border-radius:12px}.dbtn .ic svg{width:19px;height:19px}
  #hud{max-width:none;right:72px;padding:6px 10px 0;gap:4px}
  .badge{padding:2px 10px 2px 2px}.ring{width:30px;height:30px}.badge .nm{font-size:14px}.badge small{display:none}.pill,.ibtn{height:30px}.ibtn{width:30px}

#arrCard{position:absolute;z-index:6;left:50%;top:30%;transform:translate(-50%,-50%);background:#fff;border-radius:24px;padding:8px 22px 10px;font:800 26px/1.1 var(--f-display);color:var(--text);box-shadow:0 10px 30px rgba(30,70,120,.3);text-align:center;white-space:nowrap;animation:arrIn .55s cubic-bezier(.2,1.4,.4,1) both;pointer-events:none}

#gamebar{flex-wrap:nowrap}
.gtime{position:absolute;left:16px;right:16px;top:40px;height:7px;border-radius:99px;background:rgba(255,255,255,.55);box-shadow:inset 0 1px 2px rgba(30,70,120,.25);overflow:hidden;pointer-events:none}

.gtime i.low{background:linear-gradient(90deg,#ff5f6d,#ffb21f);animation:tlow .5s infinite alternate}

#gmsg.num{font-size:84px;-webkit-text-stroke:3px #1f4a69;paint-order:stroke fill;letter-spacing:.02em}

.pad .pt{font:800 28px/1 var(--f-display)}
.pad:active,.pad.lit{filter:brightness(1.12);transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.2)}
.stars{display:flex;gap:8px;justify-content:center;font-size:42px;line-height:1;margin:2px 0 6px}
.st{color:#d3dce8;opacity:0;transform:scale(.3);animation:stIn .55s calc(.2s + var(--i)*.22s) cubic-bezier(.2,1.6,.4,1) forwards}
.st.on{color:#ffc928;text-shadow:0 3px 0 #c98a00,0 0 18px rgba(255,201,40,.55)}

.orelist{display:grid;gap:6px;margin:8px 0}
.orow{display:flex;align-items:center;gap:8px;background:#f2f7fc;border-radius:12px;padding:6px 10px;font:800 14px var(--f-display);text-align:left}
.orow i{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink);flex:none}
.orow b{flex:1}.orow span{min-width:34px}.orow em{font:700 12px var(--f-body);color:var(--muted);font-style:normal;min-width:62px;text-align:right}

function deepMerge(a,b){for(const k in b){if(b[k]&&typeof b[k]==='object'&&!Array.isArray(b[k])&&a[k]&&typeof a[k]==='object')deepMerge(a[k],b[k]);else a[k]=b[k];}return a}

/* ---------- audio ---------- */
let AC=null,master=null,sfxG=null,musG=null,echoSend=null,noiseBuf=null;
function ensureAudio(){
  if(!AC){
    try{
      const C=window.AudioContext||window.webkitAudioContext; if(!C) return false;
      AC=new C(); master=AC.createGain(); master.gain.value=.9;
      const comp=AC.createDynamicsCompressor(); master.connect(comp); comp.connect(AC.destination);
      sfxG=AC.createGain(); sfxG.connect(master);
      musG=AC.createGain(); musG.gain.value=.5; musG.connect(master);
      const d=AC.createDelay(1); d.delayTime.value=.24;
      const fb=AC.createGain(); fb.gain.value=.4;
      const lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=2400;
      echoSend=AC.createGain(); echoSend.gain.value=1;
      echoSend.connect(d); d.connect(lp); lp.connect(fb); fb.connect(d);
      const wet=AC.createGain(); wet.gain.value=.55; lp.connect(wet); wet.connect(master);
    }catch(e){AC=null;return false}
  }
  if(AC.state==='suspended') AC.resume().catch(()=>{});
  return true;
}
function tone(f,dur=.12,o={}){
  if(!AC) return; if(!S.sfx&&!o.music) return;
  const t0=AC.currentTime+(o.at||0), osc=AC.createOscillator(), g=AC.createGain();
  osc.type=o.type||'sine'; osc.frequency.setValueAtTime(f,t0);
  if(o.to) osc.frequency.exponentialRampToValueAtTime(Math.max(20,o.to),t0+dur);
  g.gain.setValueAtTime(.0001,t0); g.gain.exponentialRampToValueAtTime(o.vol??.18,t0+(o.atk||.008)); g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  osc.connect(g); g.connect(o.bus||sfxG);
  if(o.send){const s=AC.createGain(); s.gain.value=o.send; g.connect(s); s.connect(echoSend);}
  osc.start(t0); osc.stop(t0+dur+.05);
}
function noise(dur,o={}){
  if(!AC||!S.sfx) return;
  if(!noiseBuf){noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}

  const fl=AC.createBiquadFilter(); fl.type=o.ft||'lowpass'; fl.frequency.setValueAtTime(o.f||1200,t0);
  if(o.f2) fl.frequency.exponentialRampToValueAtTime(o.f2,t0+dur); fl.Q.value=o.q||1;
  const g=AC.createGain(); g.gain.setValueAtTime(.0001,t0); g.gain.exponentialRampToValueAtTime(o.vol||.2,t0+(o.atk||.01)); g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  src.connect(fl); fl.connect(g); g.connect(sfxG); src.start(t0); src.stop(t0+dur+.05);
}

/* animalese voice */
const VOICES={echo:{p:1.62,type:'triangle',n:'Echo',cute:1},chip:{p:2.1,type:'triangle',n:'Squeaky',cute:1},deep:{p:.74,type:'sawtooth',n:'Deep'},robot:{p:1.1,type:'square',n:'Robot'}};
const FORM={a:900,e:700,i:430,o:560,u:380,y:600};
function blip(ch,mod=1){
  if(!AC||!S.sfx||S.real) return;
  const v=VOICES[S.voice]||VOICES.echo, c=ch.toLowerCase(), code=c.charCodeAt(0);
  if(code<97||code>122) return;
  const vow=FORM[c]!==undefined, dur=vow?.1:.06;

  bp.type='bandpass'; bp.frequency.value=(FORM[c]||1500)*v.p*.9; bp.Q.value=2.2;
  g.gain.setValueAtTime(.0001,t0); g.gain.exponentialRampToValueAtTime(vow?.34:.2,t0+.012); g.gain.exponentialRampToValueAtTime(.0001,t0+dur);

    o2.type='sine';o2.frequency.setValueAtTime(f0*2.01,t0);o2.frequency.exponentialRampToValueAtTime(f0*2*(vow?1.12:.92),t0+dur);
    lf.frequency.value=7;lg.gain.value=f0*.025;lf.connect(lg);lg.connect(o2.frequency);lf.start(t0);lf.stop(t0+dur+.04);
    g2.gain.setValueAtTime(.0001,t0);g2.gain.exponentialRampToValueAtTime(vow?.17:.07,t0+.014);g2.gain.exponentialRampToValueAtTime(.0001,t0+dur);
    o2.connect(g2);g2.connect(sfxG);g2.connect(s);o2.start(t0);o2.stop(t0+dur+.04)}
}
/* music (soft pentatonic loop) */
const Music={t:0,step:0,timer:0,
  start(){ if(this.timer||!AC) return; this.t=AC.currentTime+.1; this.step=0; this.timer=setInterval(()=>this.pump(),120); },

/* ---------- springs ---------- */
class Sp{
  constructor(x,k,c){this.x=x;this.t=x;this.v=0;this.k=k;this.c=c}
  step(dt){const h=dt/4;for(let i=0;i<4;i++){this.v+=(this.k*(this.t-this.x)-this.c*this.v)*h;this.x+=this.v*h}}
  to(t){this.t=t;return this}
  snap(x){this.x=this.t=x;this.v=0}
}

const FX=[];
function fx(k,x,y,o={}){
  const L=o.life||1;
  FX.push(Object.assign({k,x,y,vx:0,vy:0,g:0,sz:8,rot:0,vr:0,col:'#fff',a:1,grow:0,fric:0,txt:''},o,{life:L,max:L}));

}
function burst(k,x,y,n,o={}){for(let i=0;i<n;i++){const a=rnd(0,TAU),sp=rnd(o.s0??40,o.s1??140);fx(k,x+rnd(-(o.jx||0),o.jx||0),y+rnd(-(o.jy||0),o.jy||0),Object.assign({},o,{vx:Math.cos(a)*sp+(o.bx||0),vy:Math.sin(a)*sp+(o.by||0),sz:o.sz?o.sz*rnd(.7,1.2):8,life:(o.life||1)*rnd(.7,1.2),vr:rnd(-4,4),col:Array.isArray(o.col)?pick(o.col):o.col||'#fff'}))}}
const COLS=['#ff7eb0','#ffd45e','#3cb4e8','#3ec28f','#b07cf0','#ff9d3c'];

      case'star':{const r=p.sz;c.beginPath();for(let i=0;i<10;i++){const an=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.45:r;c.lineTo(Math.cos(an)*rr,Math.sin(an)*rr)}c.closePath();c.fillStyle=p.col;c.fill();c.lineWidth=1.500;c.strokeStyle='rgba(23,18,15,.55)';c.stroke();break}
      case'spark':{const r=p.sz;c.beginPath();c.moveTo(0,-r);c.quadraticCurveTo(0,0,r,0);c.quadraticCurveTo(0,0,0,r);c.quadraticCurveTo(0,0,-r,0);c.quadraticCurveTo(0,0,0,-r);c.fillStyle=p.col;c.fill();break}

      case'coin':c.scale(Math.max(.15,Math.abs(Math.cos(p.rot*2))),1);c.beginPath();c.arc(0,0,p.sz,0,TAU);c.fillStyle='#ffd45e';c.fill();c.lineWidth=2;c.strokeStyle='#b97f00';c.stroke();c.beginPath();c.arc(0,0,p.sz*.6,0,TAU);c.strokeStyle='rgba(255,255,255,.7)';c.stroke();break;

      case'drop':c.beginPath();c.ellipse(0,0,p.sz*.6,p.sz,0,0,TAU);c.fillStyle='rgba(120,200,255,.85)';c.fill();break;

function stepFx(dt){
  for(let i=FX.length-1;i>=0;i--){
    const p=FX[i];p.life-=dt;if(p.life<=0){FX.splice(i,1);continue}
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.g*dt;if(p.fric){const k=Math.max(0,1-p.fric*dt);p.vx*=k;p.vy*=p.k==='bubble'?1:k}p.rot+=p.vr*dt;

    if(p.k==='bubble'&&p.wob)p.x+=Math.sin(T*3+p.wob)*18*dt;
  }
}

function hearts(x,y,n=5){burst('heart',x,y,n,{s0:20,s1:80,by:-90,life:1.5,sz:11,col:['#ff6fa0','#ff93a8','#ff5f8a'],g:-30,jx:20})}
function sparkles(x,y,n=8,cols=['#fff','#ffd45e','#9be3ff','#ffb3d1']){burst('spark',x,y,n,{s0:30,s1:150,life:.9,sz:9,col:cols,fric:1.8,jx:18,jy:18})}
function confetti(n=60){const y0=V.sh?-V.oy/V.sc-10:-20;for(let i=0;i<n;i++)fx('confetti',rnd(0,400),y0+rnd(-40,20),{vx:rnd(-60,60),vy:rnd(80,230),g:120,sz:rnd(7,13),col:pick(COLS),life:rnd(2,3.4),vr:rnd(-5,5)})}
function floatTxt(txt,x,y,col='#ffd45e'){fx('txt',x,y,{txt,sz:24,col,vy:-60,life:1.2,fric:.6})}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),1900)}
function tween(ms,fn){return new Promise(res=>{const t0=performance.now();(function f(){const t=clamp((performance.now()-t0)/ms,0,1);fn(t);t<1?requestAnimationFrame(f):res()})()})}
let ACT=0,SLEEP=false;
function act(fn){const id=++ACT,ok=()=>id===ACT,w=ms=>new Promise(r=>setTimeout(()=>r(ok()),ms));try{return Promise.resolve(fn(ok,w)).catch(()=>{})}catch(e){return Promise.resolve()}}
function armFront(side,on){const arm=G_['arm'+side],up=G_.upper;if(on)up.appendChild(arm);else up.insertBefore(arm,G_.head)}
function relax(keepFace){
  R.aLs.t=8;R.aLe.t=-10;R.aRs.t=-8;R.aRe.t=10;R.lL.t=0;R.lR.t=0;R.hRot.t=0;R.hY.t=0;R.hS.t=1;R.lean.t=0;R.tilt.t=0;R.tum.t=1;R.chk.t=0;R.food.t=0;R.sq.t=1;R.spin.snap(0);R.gl.t=S.hurt>60?1:0;R.cry.t=S.hurt>45?1:0;R.lift.t=0;R.umb.t=(typeof UMB!=='undefined'&&UMB)?1:0;R.earW.t=(typeof Mic!=='undefined'&&Mic.state!=='off')?1:0;
  armFront('L',false);armFront('R',false);E.dance=0;R.disco.t=0;
  if(typeof UMB!=='undefined'&&UMB&&!RIDE.on){armFront('R',true);reach('R',44,-300)}
  if(!keepFace)face(moodFace());
}
function land(v){
  if(!RIDE.on&&v>200){const vs=E.tramp?v*.3:v;shake(clamp(vs/(GAME?260:95),1.2,GAME?3:13),.5);if(v>420&&!GAME){for(let i=0;i<5;i++)fx('dust',rnd(20,380),rnd(-30,10),{vy:rnd(30,90),g:80,life:1.2,sz:rnd(2,4),a:.7});SFX.rumble&&v>500&&tone(70,.4,{to:45,type:'triangle',vol:.12})}}
  R.sq.x=clamp(1-v/2600,.68,.95);R.sq.v=-1;R.hS.x=1.06;R.hair.v+=70;R.hY.v+=120*clamp(v/700,0,1.3);R.aLs.v-=110;R.aRs.v+=110;R.lL.v+=60;R.lR.v-=60;SFX.thud(v);dust(E.x,E.fy,v>500?10:6);E.air=false;
  R.lL.t=0;R.lR.t=0;
}
async function jump(ok,w,pw=620){
  R.sq.t=.72;R.hY.t=10;R.lean.t=3;R.aLs.t=-30;R.aRs.t=30;R.aLe.t=-5;R.aRe.t=5;R.lL.t=10;R.lR.t=-10;
  if(!await w(170))return;
  R.sq.t=1.13;R.hY.t=-8;R.lean.t=0;E.air=true;E.vy=pw;SFX.boing();R.aLs.t=135;R.aRs.t=-135;R.lL.t=-8;R.lR.t=8;R.hair.v-=110;
  if(!await w(110))return;R.sq.t=1.02;
  let ph=0;
  while(E.air&&ok()){
    if(E.vy<120&&ph<1){ph=1;R.aLs.t=80;R.aRs.t=-80;R.lL.t=-22;R.lR.t=22;R.hY.t=0}
    if(E.vy<-260&&ph<2){ph=2;R.aLs.t=55;R.aRs.t=-55;R.lL.t=12;R.lR.t=-12;R.sq.t=1.06}
    await w(25)}
  if(!ok())return;
  R.aLs.t=25;R.aRs.t=-25;R.hY.t=6;await w(240);R.hY.t=0;
}
function walkTo(x,y,speed=85){return new Promise(res=>{if(E.walk&&E.walk.res)E.walk.res();E.walk={x:clamp(x,64,336),y:clamp(y??E.fy,442,498),speed,res}})}

/* ---------- tricks ---------- */
async function wave(ok,w,n=6){
  R.sq.t=.94;R.lean.t=-2;if(!await w(110))return;armFront('R',true);R.aRs.t=-155;R.aRe.t=0;R.hRot.t=-4;R.sq.t=1.03;R.lean.t=1.5;emote('happy',n*190+400);
  if(!await w(220))return;
  for(let i=0;i<n;i++){R.aRe.t=i%2?-34:34;if(!await w(170))return}
  R.aRs.t=-8;R.aRe.t=10;if(!await w(260))return;armFront('R',false);relax();
}
async function flip(ok,w){
  const dir=Math.random()<.5?-1:1,vy=720,air=2*vy/1750*1000;
  R.sq.t=.72;R.hY.t=10;R.aLs.t=-35;R.aRs.t=35;R.lL.t=10;R.lR.t=-10;if(!await w(190))return;
  R.sq.t=1.12;R.hY.t=-6;E.air=true;E.vy=vy;SFX.boing();R.aLs.t=150;R.aRs.t=-150;R.lL.t=-6;R.lR.t=6;emote('laugh',1400);
  await tween(air*.9,t=>{R.tilt.x=R.tilt.t=dir*360*ease(t);R.tilt.v=0;
    if(t>.2&&t<.75){R.aLs.t=70;R.aRs.t=-70;R.aLe.t=95;R.aRe.t=-95;R.sq.t=.94;R.lL.t=-30;R.lR.t=30}
    else if(t>=.75){R.aLs.t=110;R.aRs.t=-110;R.aLe.t=0;R.aRe.t=0;R.sq.t=1.04;R.lL.t=6;R.lR.t=-6}});
  R.tilt.snap(0);R.lean.snap(0);
  while(E.air&&ok())await w(25);
  if(ok()){R.hY.t=5;await w(380);relax()}
}
async function spinTrick(ok,w){
  R.sq.t=.78;R.aLs.t=-20;R.aRs.t=20;R.hY.t=8;if(!await w(150))return;
  emote('happy',1700);E.air=true;E.vy=640;SFX.whoosh();R.sq.t=1.08;R.hY.t=-4;R.aLs.t=100;R.aRs.t=-100;R.lL.t=-8;R.lR.t=8;
  const air=2*640/1750*1000;
  await tween(air*.92,t=>{R.spin.x=R.spin.t=720*ease(t);R.spin.v=0;R.hair.v+=Math.sin(t*20)*4});
  R.spin.snap(0);while(E.air&&ok())await w(25);
  if(ok()){R.hY.t=5;await w(300);relax()}
}
async function flex(ok,w){
  armFront('L',true);armFront('R',true);emote('smug',2200);R.aLs.t=90;R.aLe.t=90;R.aRs.t=-90;R.aRe.t=-90;R.sq.t=.96;SFX.whoosh();

async function peek(ok,w){
  R.gl.t=.62;R.glY.t=-8;R.glR.t=-4;SFX.pop();R.lx.t=0;gazeLock=T+3;R.ly.t=0;
  if(!await w(380))return;R.eyeH.t=0;R.eyeO.t=1;R.blush.t=.8;
  const sc=['peek peek!','Hi there!','Boo!'];say(pick(sc));
  if(!await w(1600))return;R.eyeH.t=1;if(!await w(380))return;
  R.gl.t=0;R.glY.t=0;R.glR.t=0;SFX.pop();relax();
}
async function dance(ok,w,secs=4){
  E.dance=Math.PI/.52;E.forceWalk=Math.PI/.52;R.disco.t=1;emote('happy',secs*1000);let n=0;
  const iv=setInterval(()=>{if(!E.dance)return clearInterval(iv);SFX.note([523,587,659,784,880][n++%5]);const h=headPos();burst('note',h.x+rnd(-60,60),h.y-120*h.s,1,{s0:10,s1:30,by:-50,life:1.3,sz:14,col:pick(COLS),txt:pick(['♪','♫'])})},260);
  if(!await w(secs*1000)){clearInterval(iv);E.forceWalk=false;return}
  clearInterval(iv);E.forceWalk=false;relax();
}
async function hum(ok,w){
  face('happy0');const notes=[523,587,659,784,659,587,523];
  for(const f of notes){if(!ok())return;SFX.note(f);R.mO.t=.45;R.mW.t=.3;R.hRot.t=Math.sin(f)*5;const h=headPos();burst('note',h.x+50*h.s,h.y-70*h.s,1,{s0:8,s1:20,by:-46,life:1.4,sz:14,col:pick(COLS),txt:pick(['♪','♫'])});if(!await w(240))return;R.mO.t=0;if(!await w(60))return}

async function adjustShades(ok,w){
  if(!glassesVisible())return;
  armFront('L',true);reach('L',-62,-292);R.hRot.t=-3;if(!await w(480))return;
  R.glY.t=-4;R.glR.t=-3;SFX.pop();if(!await w(220))return;R.glY.t=0;R.glR.t=0;emote('smug',1200);

async function stretch(ok,w){
  R.aLs.t=165;R.aRs.t=-165;R.aLe.t=0;R.aRe.t=0;R.hY.t=-6;R.sq.t=1.05;R.mO.t=.9;R.mW.t=.3;R.eyeO.t=.3;SFX.yawn();

async function lookAround(ok,w){
  gazeLock=T+2.6;R.lx.t=-1;R.hRot.t=-5;if(!await w(650))return;R.lx.t=1;R.hRot.t=5;if(!await w(800))return;R.lx.t=0;R.ly.t=-.6;R.hRot.t=0;if(!await w(500))return;relax();

const TRICKS={wave,flip,spin:spinTrick,flex,dance:(ok,w)=>dance(ok,w,4.5),peek};

/* ---------- reactions ---------- */
let cooldown=0,patN=0,patT=0,tickN=0,tickT=0;

  const h=headPos();R.hS.x=.9;R.hY.v+=60;R.blush.t=1;emote('love',1300);SFX.pop();hearts(h.x,h.y-60*h.s,3);
  patN=(T-patT<3)?patN+1:1;patT=T;S.love=clamp(S.love+.7,0,100);
  if(patN===5){patN=0;SFX.giggle();say(pick(['Hehe, that tickles!','Pat pat pat!','I love head pats!','Best friends!']));hearts(h.x,h.y-60*h.s,8)}
}
function reactTummy(){
  tickN=(T-tickT<2.2)?tickN+1:1;tickT=T;R.tum.x=1.18;R.tum.v=3;R.sq.x=.92;SFX.giggle();emote('laugh',1100);
  R.aLs.t=40;R.aRs.t=-40;R.lL.v+=40;R.lR.v-=40;setTimeout(()=>{R.aLs.t=8;R.aRs.t=-8},400);
  if(tickN>=4){tickN=0;act(async(ok,w)=>{say(pick(['Ahaha stop it!','Hehehe, that tickles!','Okay okay!!']));emote('laugh',2400);E.air=true;E.vy=380;R.tilt.t=10;await w(700);R.tilt.t=-10;await w(500);relax()})}
}
function reactNose(){
  R.hS.x=.88;R.hY.v+=50;SFX.boop();emote('wow',650);const h=headPos();burst('ring',h.x,h.y+34*h.s,1,{s0:0,s1:0,life:.5,sz:6,grow:60,col:'#fff'});
  if(Math.random()<.5)say(pick(['Boop!','Beep!','Hehe!','Honk!']),{pitch:1.3});
}
function reactMouth(){act(async(ok,w)=>{R.mO.t=1;R.mW.t=.8;R.eyeH.t=1;SFX.pop();say('Aaaah!');if(!await w(1000))return;relax()})}
function reactHand(side){act(async(ok,w)=>{SFX.pop();const f=side==='L'?-1:1;armFront(side,true);R['a'+side+'s'].t=f*-150;R['a'+side+'e'].t=0;emote('happy',1400);say(pick(['High five!','Yeah!','Up top!']));const h=headPos();sparkles(E.x+f*70*h.s,h.y-30*h.s,6);if(!await w(900))return;relax()})}
function reactFeet(){act(async(ok,w)=>{SFX.pop();R.lL.t=-14;await jump(ok,w,460);relax()})}
function reactShades(){act(peek)}
function reactGround(p){
  gazeLock=0;lookUntil=T+2;const dx=p.x-E.x;
  walkTo(p.x,p.y>470?p.y:E.fy,95);R.lean.t=dx>0?3:-3;
}
function sayTime(){const d=new Date();const h=d.getHours()%12||12,m=String(d.getMinutes()).padStart(2,'0');say(`It's ${h}:${m} ${d.getHours()>=12?'PM':'AM'}!`);emote('smug',1500)}
function toggleLights(){lightsOn=!lightsOn;R.light.t=lightsOn?1:0;SFX.tap();if(!lightsOn&&!SLEEP){say('Ooh, dark!');}else if(lightsOn&&!SLEEP)say('Bright!')}

/* ---------- input ---------- */
const PT={down:false,x:200,y:300,sx:0,sy:0,part:null,prop:null,moved:false,cx:0,cy:0,scrub:0};
let lookUntil=0,gazeLock=0,GAME=null,BATH=null;
function scenePt(e){updateView();return toScene(e.clientX,e.clientY)}
function startDrag(p){
  if(!S.tossHint){S.tossHint=1;setTimeout(()=>toast('Tip: fling Echo and let go to toss him around!'),900)}
  E.walk&&E.walk.res&&E.walk.res();E.walk=null;E.air=false;ACT++;
  E.drag={off:(E.fy-E.h)-p.y};E.drift=0;E.hist=[];E.toss=false;E.rot=0;E.rotV=0;E.fvx=0;E.slide=0;relax(true);emote('wow',900);SFX.pop();R.sq.t=1.06;R.eyeO.t=1.1;
}
function endDrag(){
  E.drag=null;E.air=true;E.vy=0;E.drift=clamp(E.vx,-240,240);R.tilt.t=0;
  {const H=E.hist||[];let vxr=0,vyr=0;if(H.length>2){const a=H[0],b=H[H.length-1],dt=Math.max(b[0]-a[0],.03);vxr=(b[1]-a[1])/dt;vyr=(b[2]-a[2])/dt}
   const sp=Math.hypot(vxr,vyr);E.toss=sp>420;
   if(E.toss){E.fvx=clamp(vxr*1.05,-950,950);E.vy=clamp(-vyr*1.05,-500,1300);E.drift=0;E.rot=R.tilt.x;E.rotV=clamp(vxr*.9,-900,900)||rnd(-300,300);E.bounces=0;E.tossMax=0;SFX.whoosh();R.sq.t=1.1}}
  act(async(ok,w)=>{R.aLs.t=100;R.aRs.t=-100;if(!await w(100))return;while(E.air&&ok())await w(30);if(!ok())return;
    const fell=E.lastFall||0;if(E.toss){E.toss=false;E.dizzy=Math.max(E.dizzy,E.tossMax>260?2.6:1.4);SFX.giggle();say(pick(['Wheeeee!','Again again!!','Whoa, the room is spinning!','I\'m a rocket!']));emote(E.tossMax>260?'yuck':'laugh',1800)}else if(fell>140){SFX.giggle();say(pick(['Wheee!','Again, again!','Whoa!']));emote('laugh',1400)}else emote('happy',900);
    await w(450);relax();const z=zoneAt(E.x);if(z&&ok())setTimeout(()=>zoneAction(z.id),150)});
}
$scene.addEventListener('pointerdown',e=>{
  ensureAudio();const p=scenePt(e);PT.down=true;PT.x=p.x;PT.y=p.y;PT.sx=e.clientX;PT.sy=e.clientY;PT.moved=false;
  const inEcho=e.target.closest&&e.target.closest('#echoRoot');
  const hit=e.target.closest&&e.target.closest('[data-hit]');
  PT.part=inEcho&&hit?hit.dataset.hit:(inEcho?'body':null);
  const pr=e.target.closest&&e.target.closest('[data-prop]');PT.prop=pr?pr.dataset.prop:null;
  PT.punched=false;
  if(FW.on&&!inEcho&&!GAME){launchFW(p)}
  if(balVisible()&&!E.drag&&Math.hypot(p.x-BAL.x,p.y-(BAL.fy-BAL.h))<48){bopBal(p.x<BAL.x?1:-1,1);PT.part=null;PT.prop=null;PT.punched=true;return}
  if(ballVisible()&&MODE==='home'&&!E.drag&&Math.hypot(p.x-BALL.x,p.y-(BALL.fy-BALL.h-21))<46){kickBall(p.x<BALL.x?1:-1,1.1);PT.part=null;PT.prop=null;PT.punched=true;return}
  if(PUNCH&&inEcho&&!GAME&&MODE==='home'){PT.punched=true;punchEcho(p);return}
  if(GAME&&GAME.onDown){GAME.onDown(p,e);return}
  if(MODE==='bath'){PT.scrub=1;return}
  try{$scene.setPointerCapture(e.pointerId)}catch(_){}
});
window.addEventListener('pointermove',e=>{
  if(!V.sc)return;const p=scenePt(e);PT.x=p.x;PT.y=p.y;lookUntil=T+2.4;
  if(GAME&&GAME.onMove){GAME.onMove(p);return}
  if(!PT.down)return;
  if(MODE==='bath'){if(BATH)BATH.move(p);return}
  if(!PT.moved&&Math.hypot(e.clientX-PT.sx,e.clientY-PT.sy)>9){PT.moved=true;if(PT.part&&!BUSY&&MODE==='home'&&!PT.punched&&!roomBusy)startDrag(p)}
});
window.addEventListener('pointerup',e=>{
  if(!PT.down)return;PT.down=false;PT.scrub=0;
  if(E.drag){endDrag();return}
  if(PT.punched){PT.punched=false;return}
  if(GAME||MODE==='bath'){return}
  if(PT.moved)return;
  tap(PT.part,PT.prop,scenePt(e));
});
window.addEventListener('pointercancel',()=>{PT.down=false;if(E.drag)endDrag()});
function tap(part,prop,p){
  if(SLEEP){wakeUp();return}
  if(BUSY)return;
  if(T<cooldown)return;cooldown=T+.12;
  if(prop&&propTap(prop,p))return;
  if(prop==='lamp')return toggleLights();
  if(prop==='clock')return sayTime();
  if(prop==='trophy')return showRecords();
  if(part==='head')return reactHead();
  if(part==='nose')return reactNose();
  if(part==='mouth')return reactMouth();
  if(part==='shades')return reactShades();
  if(part==='tummy'||part==='body')return reactTummy();
  if(part==='hand'){return reactHand(p.x<E.x?'L':'R')}
  if(part==='feet')return reactFeet();
  if(p.y>400)reactGround(p);
}

/* ---------- locomotion + update ---------- */
let blinkT=2,idleT=4,uiT=0,saveT=0,needT=0,decayAcc=0;
function blink(dbl){if(R.eyeH.t>.5||SLEEP)return;R.eyeO.t=.04;setTimeout(()=>{if(!SLEEP)R.eyeO.t=(FACES[FACE_BASE]||FACES.neutral).eyeO??1},95);if(!dbl&&Math.random()<.18)setTimeout(()=>blink(true),230)}
function update(dt){
  stepBall(dt);stepBal(dt);stepFW(dt);
  for(const k in R)R[k].step(dt);
  /* walking */
  let walking=false;
  if(E.walk&&!E.drag&&!E.air&&!SLEEP_LOCK()){
    const dx=E.walk.x-E.x,dy=E.walk.y-E.fy,d=Math.hypot(dx,dy);
    if(d<1.2){const r=E.walk.res;E.walk=null;r&&r();R.lean.t=0}
    else{const want=Math.min(E.walk.speed,10+d*4.4),c0=E.cur||0;E.cur=c0+(want-c0)*Math.min(1,dt*(want>c0?7:12));const sp=E.cur,st=Math.min(1,sp*dt/d);E.x+=dx*st;E.fy+=dy*st*.6;E.vx=dx/d*sp;walking=true;R.lean.t=Math.sign(dx)*3.2*clamp(sp/70,0,1);R.hair.t=-Math.sign(dx)*5*clamp(sp/70,0,1)}
  }else if(!E.drag){E.cur=(E.cur||0)*Math.pow(.0005,dt);E.vx*=Math.pow(.001,dt);if(Math.abs(E.vx)<5)R.hair.t=0}
  if(E.slide&&!E.air&&!E.drag){E.x=clamp(E.x+E.slide*dt,54,346);E.slide*=Math.pow(.015,dt);if(Math.abs(E.slide)<6)E.slide=0}
  if(walking&&!E.air){R.sq.t=1+Math.cos(E.wph*2)*.028;R.hRot.t=Math.sin(E.wph)*2.6;E._wk=1}
  else if(E._wk&&!BUSY){E._wk=0;R.sq.t=1;R.hRot.t=0}
  const wk=walking||E.forceWalk;E.wamp+=((walking?clamp((E.cur||0)/80,.3,1.15):(E.forceWalk?1:0))-E.wamp)*Math.min(1,dt*9);if(wk||E.wamp>.02)E.wph+=dt*(walking?Math.max(4,(E.cur||0)/9.5):(E.forceWalk>1?E.forceWalk:11));

/* Dance Party */
function gDance(){
  const defs=[{n:'Left',c:'#ff7eb0',ic:'i-left'},{n:'Pop',c:'#e6a800',ic:'i-up'},{n:'Right',c:'#2bb0e0',ic:'i-right'}];
  const beat=.58,lead=1.35,N=30,evs=[];let prev=-1;
  for(let k=0;k<N;k++){let p;do{p=Math.floor(Math.random()*3)}while(p===prev);prev=p;evs.push({t:1.8+k*beat,pad:p,done:false})}
  const g={key:'dance',title:'Dance Party',cm:.5,xm:.42,score:0,clock:0,lastBeat:-1,combo:0,hits:0,live:false,
    async intro(){await walkTo(200,466,140);if(GAME!==g)return false;buildPads(defs,i=>g.pad(i));R.disco.t=1;E.dance=Math.PI/beat;setBar('Score 0','Ready');return countdown()},
    pad(i){
      if(GAME!==g||!g.live)return;
      litPad(i,180);
      let best=null;for(const e of evs){if(!e.done&&e.pad===i&&Math.abs(e.t-g.clock)<.3&&(!best||Math.abs(e.t-g.clock)<Math.abs(best.t-g.clock)))best=e}
      const h=headPos();
      if(!best){g.combo=0;SFX.bad();return}
      best.done=true;const err=Math.abs(best.t-g.clock);g.hits++;g.combo++;
      const pts=err<.09?3:2;g.score+=pts+Math.floor(g.combo/8);
      floatTxt(err<.09?'Perfect!':'Good',h.x,h.y-120*h.s,err<.09?'#fff':'#ffd45e');
      SFX.note([523,659,784][i]*(err<.09?2:1));sparkles(h.x+(i-1)*60,h.y-40*h.s,err<.09?8:4);
      const d=i-1;R.tilt.v+=d*190;R.hair.v+=d*200;if(i===1){E.air=true;E.vy=330}else{R.aLs.v+=d*400;R.aRs.v+=d*400}R.hS.x=1.06;
    },
    update(dt){
      if(!g.live)return;
      g.clock+=dt;
      const nb=Math.floor(g.clock/beat);
      if(nb>g.lastBeat){g.lastBeat=nb;tone(130,.16,{to:45,vol:.38,bus:musG||sfxG,music:true});if(nb%2)noise(.06,{ft:'highpass',f:6000,vol:.08});if(nb%4===0)tone(98,.5,{type:'triangle',vol:.1,music:true})}
      const pads=$$('#pads .pad');
      for(const e of evs){if(!e.done&&g.clock>e.t+.26){e.done=true;g.combo=0;SFX.bad()}}
      pads.forEach((p,i)=>{
        const e=evs.find(x=>!x.done&&x.pad===i&&x.t-g.clock<lead);const ring=p.querySelector('i');
        if(e){const k=clamp((e.t-g.clock)/lead,0,1);ring.style.opacity=(.95-k*.55).toFixed(2);ring.style.transform=`scale(${(1+k*1.4).toFixed(3)})`}else ring.style.opacity=0;
      });
      setBar('Score '+g.score,g.combo>=3?`Combo x${g.combo}`:'Keep going');
      if(g.clock>evs[evs.length-1].t+1.1){g.score=g.score;finishGame(g)}
    }
  };
  return g;
}

/* ---------- wiring ---------- */
function wire(){
  $$('.dbtn').forEach(b=>b.addEventListener('click',()=>{
    ensureAudio();const a=b.dataset.act;
    if(a==='bath')return goBath();
    if(a==='feed')return goFeed();
    if(a==='sleep')return goBed();
    if(a==='map')return openMap();
    openSheet(a);
  }));
  $('#navL').addEventListener('click',()=>navDir(-1));$('#navR').addEventListener('click',()=>navDir(1));
  $('#ctx').addEventListener('click',()=>{ensureAudio();openSheet('go')});
  $('#goChips').addEventListener('click',e=>{const b=e.target.closest('[data-room]');if(b){closeSheets();const l=areaList(curRoom);goRoom(b.dataset.room,{dir:l.indexOf(b.dataset.room)>l.indexOf(curRoom)?1:-1,x:200});return}if(e.target.closest('[data-home]')){closeSheets();travelTo(LOCS[0])}});
  $('#wx').addEventListener('click',()=>{ensureAudio();showWeather()});
  $('#btnMic').addEventListener('click',()=>{ensureAudio();micAsk()});
  $('#btnPunch').addEventListener('click',()=>{ensureAudio();togglePunch()});
  $('#rideSkip').addEventListener('click',()=>{RIDE.skip=true});
  $('#plBody').addEventListener('click',e=>{const s=e.target.closest('[data-seed]'),a=e.target.closest('[data-pl]');if(s)plantAct('seed',s.dataset.seed);else if(a)plantAct(a.dataset.pl)});
  $('#menuGrid').addEventListener('click',e=>{const b=e.target.closest('[data-sfood]');if(b)feed(b.dataset.sfood)});
  $('#btnGear').addEventListener('click',()=>{ensureAudio();openSheet('set')});
  $('#btnSound').addEventListener('click',()=>{ensureAudio();S.sfx=!S.sfx;updateHud();if(S.sfx)SFX.pop();persist()});
  $('#btnLevel').addEventListener('click',()=>{ensureAudio();showInfo()});
  const hints={potty:'Potty: drag Echo to the toilet',hunger:'Hunger: give Echo a snack',fun:'Fun: play a game together',clean:'Clean: time for a bath',energy:'Energy: let Echo take a nap'};
  $$('.meter').forEach(m=>m.addEventListener('click',()=>toast(hints[m.dataset.need]+` (${Math.round(S.needs[m.dataset.need])}%)`)));
  $$('[data-close]').forEach(b=>b.addEventListener('click',()=>closeSheets()));
  $('#foodGrid').addEventListener('click',e=>{const b=e.target.closest('[data-food]');if(b)feed(b.dataset.food)});
  $('#gameCards').addEventListener('click',e=>{const b=e.target.closest('[data-game]');if(b)startGame(b.dataset.game)});
  $('#trickChips').addEventListener('click',e=>{const b=e.target.closest('[data-trick]');if(!b)return;if(BUSY||SLEEP)return;closeSheets();ensureAudio();act(TRICKS[b.dataset.trick])});
  $('#styleTabs').addEventListener('click',e=>{const b=e.target.closest('[data-cat]');if(b){styleCat=b.dataset.cat;buildStyle();syncInset()}});
  $('#styleGrid').addEventListener('click',e=>{const b=e.target.closest('[data-item]');if(b)pickItem(b.dataset.item)});
  $('#phraseChips').addEventListener('click',e=>{const b=e.target.closest('[data-phrase]');if(b)PHRASES[+b.dataset.phrase].run()});
  $('#voiceChips').addEventListener('click',e=>{const b=e.target.closest('[data-voice]');if(!b)return;S.voice=b.dataset.voice;buildTalk();echoBack('Hello! Do you like my voice?')});
  $('#sayForm').addEventListener('submit',e=>{e.preventDefault();ensureAudio();const i=$('#sayInput');const v=i.value;i.value='';if(v.trim())echoBack(v)});
  $('#gQuit').addEventListener('click',()=>{if(MODE==='bath'&&BATH)BATH.finish(true);else if(GAME)finishGame(GAME,true)});
  $('#setRows').addEventListener('click',e=>{
    const s=e.target.closest('[data-set]');
    if(s){const k=s.dataset.set;if(k==='sfx')S.sfx=!S.sfx;else if(k==='music'){S.music=!S.music;if(S.music){ensureAudio();Music.start()}else Music.stop()}else if(k==='talk')S.real=!S.real;buildSet();persist();return}
    if(e.target.closest('[data-reset]')){
      if(!resetArm){resetArm=1;e.target.closest('[data-reset]').textContent='Tap again to erase';return}
      try{localStorage.removeItem(KEY)}catch(_){}
      S=JSON.parse(JSON.stringify(DEF));S.intro=false;S.day='';location.reload();
    }
  });
  window.addEventListener('keydown',e=>{if(e.key==='Escape'){if(modalOpen)closeModal();else if($('#map').classList.contains('open'))closeMap();else closeSheets()}});
  window.addEventListener('resize',()=>{sizeCanvas();updateView();syncInset()});
  if(window.ResizeObserver){const ro=new ResizeObserver(syncInset);$$('.sheet').forEach(s=>ro.observe(s))}
  document.addEventListener('visibilitychange',()=>{if(document.hidden)persist()});
  window.addEventListener('pagehide',persist);
  document.addEventListener('pointerdown',function f(){ensureAudio();if(S.music)Music.start();document.removeEventListener('pointerdown',f)},{once:true,capture:true});
}

function cloudG(x,y,s){return `<g transform="translate(${x} ${y}) scale(${s})"><ellipse cx="0" cy="0" rx="22" ry="9"/><ellipse cx="14" cy="-6" rx="14" ry="9"/><ellipse cx="-12" cy="-5" rx="11" ry="7"/></g>`}

    c.strokeStyle='#2a2018';c.lineWidth=2.5;c.lineCap='round';if(dm>.25){c.beginPath();c.moveTo(-4,-22);c.lineTo(2,-8);c.lineTo(-6,2);c.stroke()}if(dm>.5){c.beginPath();c.moveTo(14,-14);c.lineTo(6,0);c.lineTo(14,12);c.stroke()}if(dm>.75){c.beginPath();c.moveTo(-26,-4);c.lineTo(-12,4);c.lineTo(-20,16);c.stroke()}

function gMine(){
  const g={key:'mine',title:'Gold Mine',cm:.35,xm:.5,score:0,t:35,live:false,tx:200,got:{coal:0,copper:0,silver:0,gold:0,gem:0},nodes:[],swing:null,last:0,flash:0,total:0};
  const roll=()=>{const r=Math.random();return r<.34?'coal':r<.58?'copper':r<.74?'silver':r<.84?'gold':r<.87?'gem':'tnt'};
  const mk=i=>{const ty=roll();return {i,x:MINE_SPOTS[i][0],y:MINE_SPOTS[i][1],type:ty,hp:ty==='tnt'?1:ORE[ty].hp,max:ty==='tnt'?1:ORE[ty].hp,pop:0,shake:0,dead:0,life:ty==='tnt'?4.5:99}};
  const bar=()=>setBar(`Ore ${Object.values(g.got).reduce((a,b)=>a+b,0)}`,Math.max(0,Math.ceil(g.t))+'s');
  Object.assign(g,{
    async intro(){
      await walkTo(200,470,140);if(GAME!==g)return false;
      TEMP=OUTFITS.miner.w;applyLook();sparkles(E.x,E.fy-200,12);SFX.sparkle();say('Let us find gold!');
      face('smug');R.sq.t=.9;
      g.nodes=[0,1,2,3,4].map(mk);g.pool=[5,6];bar();
      return countdown();
    },
    cleanup(){
      TEMP=null;applyLook();S.ore=S.ore||{};let n=0;for(const k in g.got){S.ore[k]=(S.ore[k]||0)+g.got[k];n+=g.got[k]}persist();
      if(n)setTimeout(()=>toast('Ore added to your bag. Sell it at the Pawn Shop!'),900);
    },
    onDown(p){
      if(!g.live)return;
      let best=null,bd=54;for(const n of g.nodes){if(n.dead||n.pop<.6)continue;const d=Math.hypot(p.x-n.x,p.y-n.y);if(d<bd){bd=d;best=n}}
      if(!best)return;
      g.tx=clamp(best.x,76,324);const side=best.x<E.x?'L':'R';
      armFront(side,true);const sc=depthScale(E.fy);reach(side,clamp((best.x-E.x)/sc,-150,150),clamp((best.y-E.fy)/sc,-250,-30));setTimeout(()=>{try{armFront(side,false)}catch(e){}},260);
      R.lx.t=clamp((best.x-E.x)/140,-1,1);R.sq.t=.9;R.hY.v-=40;g.swing={x:best.x,y:best.y,k:0,side:best.x<E.x?-1:1};
      if(best.type==='tnt'){
        best.dead=1;best.t=1.6;g.t-=3;shake(9,.5);SFX.punch&&SFX.punch();tone(90,.5,{to:40,type:'sawtooth',vol:.25});burst('dust',best.x,best.y,18,{s0:60,s1:220,by:-30,life:.8,sz:7,fric:2});floatTxt('BOOM! -3s',best.x,best.y-40,'#ff6a6a');g.flash=.6;emote('wow',900);return;
      }
      best.hp--;best.shake=1;SFX.thud&&SFX.thud(500);tone(600+Math.random()*300,.05,{type:'square',vol:.06});
      burst('spark',best.x,best.y,5,{s0:60,s1:180,life:.45,sz:5,col:['#fff','#ffd45e',ORE[best.type].c],fric:1.5});burst('dust',best.x,best.y+10,3,{s0:20,s1:80,by:-20,life:.4,sz:4,fric:2});
      if(best.hp<=0){
        g.got[best.type]++;g.score+=ORE[best.type].v;best.dead=1;best.t=rnd(.7,1.5);
        const rich=best.type==='gold'||best.type==='gem';SFX[rich?'sparkle':'coin']();sparkles(best.x,best.y,rich?14:6,['#fff',ORE[best.type].c]);floatTxt('+'+ORE[best.type].n,best.x,best.y-36,rich?'#ffd45e':'#fff');
        if(rich){confetti(10);emote('love',900)}bar();
      }
    },
    update(dt){
      if(!g.live)return;
      g.t-=dt;if(g.flash>0)g.flash-=dt*2;if(g.swing){g.swing.k+=dt*6;if(g.swing.k>1.4)g.swing=null}
      const px=E.x;E.x+=(clamp(g.tx,66,334)-E.x)*Math.min(1,dt*9);const mv=(E.x-px)/dt;E.forceWalk=Math.abs(mv)>25;R.tilt.t=clamp(mv*.03,-8,8);
      for(const n of g.nodes){
        if(n.dead){n.t-=dt;if(n.t<=0){Object.assign(n,mk(n.i))}continue}
        n.pop=Math.min(1,n.pop+dt*5);if(n.shake>0)n.shake=Math.max(0,n.shake-dt*5);
        if(n.type==='tnt'){n.life-=dt;if(n.life<=0){n.dead=1;n.t=1;sparkles(n.x,n.y,6,['#ccc'])}}
      }
      bar();if(g.t<=0)finishGame(g);
    },
    draw(c){
      for(const n of g.nodes){if(n.dead)continue;drawRockNode(c,n,T)}
      if(g.swing)drawPick(c,g.swing.x-g.swing.side*34,g.swing.y-30,g.swing.k,g.swing.side);
      if(g.flash>0){c.save();c.globalAlpha=clamp(g.flash,0,.5);c.fillStyle='#fff3c0';c.fillRect(-900,-900,2200,2200);c.restore()}
    }
  });
  return g;
}

const ZM={z:1,tz:1,zmax:1.4,mode:null,fx:200,fy:300,base:null};
const _uv16=updateView;

function zoomApply(){
  const B=ZM.base;if(!B)return;const z=ZM.z;
  if(z<1.003&&ZM.tz===1){if($scene.style.transform)$scene.style.transform='';V.sc=B.sc;V.ox=B.ox;V.oy=B.oy;return}
  const w=clamp((z-1)/(ZM.zmax-1),0,1);
  const F0={x:B.ox+ZM.fx*B.sc,y:B.oy+ZM.fy*B.sc},Ft={x:B.sw/2,y:B.sh*.55};
  const Fc={x:lerp(F0.x,Ft.x,w),y:lerp(F0.y,Ft.y,w)};
  V.sc=B.sc*z;V.ox=Fc.x+(B.ox-F0.x)*z;V.oy=Fc.y+(B.oy-F0.y)*z;
  const tx=Fc.x-z*F0.x-B.sl*(1-z),ty=Fc.y-z*F0.y-B.stp*(1-z);
  $scene.style.transformOrigin='0 0';$scene.style.transform=`translate(${tx.toFixed(2)}px,${ty.toFixed(2)}px) scale(${z.toFixed(4)})`;
}
